<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>いいこと抽出マシーン</title>
<style>
  :root{
    --cream:#fdf3e0;
    --cream-dark:#f0e2c0;
    --mustard:#f4b942;
    --mustard-dark:#d99a1f;
    --teal:#2f8f8f;
    --teal-dark:#1f6b6b;
    --red:#e2543b;
    --red-dark:#a83420;
    --ink:#3a2f22;
    --metal:#d8d0ba;
    --metal-dark:#a89e84;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; min-height:100%;
    font-family:"Hiragino Sans","Yu Gothic","Zen Maru Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      repeating-linear-gradient(135deg, #00000006 0 12px, transparent 12px 24px),
      linear-gradient(160deg, #e8dcc4, #d8c9a3);
    color:var(--ink);
    overflow-x:hidden;
    -webkit-user-select:none; user-select:none;
  }

  #page{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px 16px 40px;
  }

  /* ===== マシン筐体 ===== */
  #machine{
    position:relative;
    width:100%; max-width:380px;
    background:linear-gradient(160deg, var(--cream), var(--cream-dark));
    border:5px solid var(--ink);
    border-radius:26px;
    box-shadow:0 18px 0 #00000018, 0 22px 30px rgba(0,0,0,.25);
    padding:0 0 20px;
    overflow:hidden;
  }

  /* 警告ストライプの帯 */
  #stripeBar{
    height:16px;
    background:repeating-linear-gradient(45deg, var(--mustard) 0 14px, var(--ink) 14px 28px);
  }

  header{
    text-align:center;
    padding:14px 16px 6px;
  }
  header h1{
    font-size:16px;
    letter-spacing:2px;
    margin:0;
    color:var(--ink);
    font-weight:900;
  }
  header .badge{
    display:inline-block;
    margin-top:6px;
    font-size:10.5px;
    letter-spacing:2px;
    color:#fff;
    background:var(--teal);
    padding:3px 10px;
    border-radius:10px;
    font-weight:700;
  }

  /* リベット（ネジ）装飾 */
  .rivet{
    position:absolute;
    width:10px; height:10px;
    background:radial-gradient(circle at 35% 30%, #fff, var(--metal-dark));
    border-radius:50%;
    box-shadow:inset 0 -1px 2px rgba(0,0,0,.4);
    z-index:3;
  }

  /* ===== 投入口（テキストエリア） ===== */
  #slotWrap{
    margin:14px 18px 0;
    background:var(--metal);
    border-radius:14px;
    padding:10px;
    box-shadow:inset 0 3px 8px rgba(0,0,0,.25);
    border:2px solid var(--metal-dark);
  }
  #slotLabel{
    font-size:11px; font-weight:700; color:#6a6250;
    margin-bottom:6px; letter-spacing:1px;
    display:flex; align-items:center; gap:4px;
  }
  #worryInput{
    width:100%;
    min-height:78px;
    resize:none;
    border:1.5px dashed #b0a685;
    border-radius:8px;
    background:#fffdf7;
    padding:10px 12px;
    font-size:13.5px;
    font-family:inherit;
    color:var(--ink);
    outline:none;
    line-height:1.6;
  }
  #worryInput:focus{ border-color:var(--teal); }

  /* ===== 大げさな抽出ボタン ===== */
  #buttonWrap{
    display:flex; justify-content:center;
    margin:18px 0 4px;
  }
  #extractBtn{
    position:relative;
    width:170px; height:170px;
    border-radius:50%;
    border:none;
    background:radial-gradient(circle at 35% 30%, #ff8a72, var(--red) 55%, var(--red-dark) 100%);
    box-shadow:
      0 10px 0 var(--red-dark),
      0 16px 20px rgba(0,0,0,.3),
      inset 0 0 0 6px rgba(255,255,255,.15);
    color:#fff8ec;
    font-size:16px;
    font-weight:900;
    line-height:1.4;
    letter-spacing:1px;
    cursor:pointer;
    transition:transform .08s ease, box-shadow .08s ease;
    -webkit-tap-highlight-color:transparent;
  }
  #extractBtn:active{
    transform:translateY(8px);
    box-shadow:
      0 2px 0 var(--red-dark),
      0 6px 10px rgba(0,0,0,.25),
      inset 0 0 0 6px rgba(255,255,255,.15);
  }
  #extractBtn .ring{
    position:absolute; inset:-8px;
    border-radius:50%;
    border:3px dashed rgba(255,255,255,.5);
    animation:ringSpin 6s linear infinite;
  }
  @keyframes ringSpin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }
  #extractBtn.disabled{ opacity:.55; pointer-events:none; }

  /* ===== ローディング演出（ガチャガチャ解析） ===== */
  #loadingWrap{
    display:none;
    margin:6px 18px 0;
    background:#20211f;
    border-radius:14px;
    padding:16px 14px;
    border:3px solid var(--ink);
    box-shadow:inset 0 3px 10px rgba(0,0,0,.5);
  }
  #loadingWrap.show{ display:block; }

  #gearRow{
    display:flex; justify-content:center; align-items:center; gap:14px;
    margin-bottom:10px;
  }
  .gear{
    width:34px; height:34px;
    position:relative;
    animation:gearSpin 1.1s linear infinite;
  }
  .gear.rev{ animation-direction:reverse; animation-duration:.9s; }
  .gear::before{
    content:"⚙";
    font-size:34px;
    line-height:1;
    color:var(--mustard);
    position:absolute; left:0; top:-3px;
  }
  @keyframes gearSpin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }

  #lightsRow{
    display:flex; justify-content:center; gap:8px; margin-bottom:10px;
  }
  .lamp{
    width:9px; height:9px;
    border-radius:50%;
    background:#3a3a35;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.6);
    animation:lampBlink 1s ease-in-out infinite;
  }
  .lamp:nth-child(1){ background:#ff5a4d; animation-delay:0s; }
  .lamp:nth-child(2){ background:#ffd75a; animation-delay:.15s; }
  .lamp:nth-child(3){ background:#7ed957; animation-delay:.3s; }
  .lamp:nth-child(4){ background:#5ab4ff; animation-delay:.45s; }
  .lamp:nth-child(5){ background:#c98aff; animation-delay:.6s; }
  @keyframes lampBlink{ 0%,100%{ opacity:.25; } 50%{ opacity:1; } }

  #statusText{
    text-align:center;
    font-size:12.5px;
    color:#f0e8d0;
    font-weight:700;
    letter-spacing:1px;
    min-height:16px;
    margin-bottom:10px;
  }
  #progressOuter{
    height:10px;
    background:#3a3a35;
    border-radius:6px;
    overflow:hidden;
  }
  #progressInner{
    height:100%; width:0%;
    background:repeating-linear-gradient(45deg, var(--mustard) 0 8px, var(--teal) 8px 16px);
    transition:width .1s linear;
  }

  /* ===== 排出口 ===== */
  #dispenseSlot{
    margin:16px 18px 0;
    height:14px;
    background:linear-gradient(180deg, #00000030, transparent);
    border-radius:0 0 10px 10px;
    border-top:3px solid var(--ink);
    position:relative;
  }

  /* ===== カプセル演出 ===== */
  #capsuleArea{
    position:relative;
    margin:0 18px;
    min-height:0;
    display:flex; justify-content:center;
  }
  #capsule{
    position:relative;
    width:70px; height:70px;
    display:none;
  }
  #capsule.drop{
    display:block;
    animation:capsuleDrop .5s cubic-bezier(.4,.4,.3,1.3) forwards;
  }
  @keyframes capsuleDrop{
    0%{ transform:translateY(-60px) scale(.7); opacity:0; }
    70%{ transform:translateY(4px) scale(1.05); opacity:1; }
    100%{ transform:translateY(0) scale(1); }
  }
  .capsuleHalf{
    position:absolute; left:0; width:100%; height:50%;
    background:linear-gradient(160deg,#fff, var(--teal));
    box-shadow:0 3px 8px rgba(0,0,0,.25);
  }
  .capsuleHalf.top{ top:0; border-radius:50% 50% 0 0 / 100% 100% 0 0; }
  .capsuleHalf.bottom{ bottom:0; border-radius:0 0 50% 50% / 0 0 100% 100%; background:linear-gradient(160deg,#fff,var(--mustard)); }
  #capsule.cracking .capsuleHalf.top{
    animation:crackTop .5s ease forwards;
  }
  #capsule.cracking .capsuleHalf.bottom{
    animation:crackBottom .5s ease forwards;
  }
  @keyframes crackTop{ to{ transform:translate(-30px,-40px) rotate(-30deg); opacity:0; } }
  @keyframes crackBottom{ to{ transform:translate(30px,40px) rotate(30deg); opacity:0; } }

  /* ===== 結果カード ===== */
  #resultWrap{
    display:none;
    margin:10px 18px 4px;
  }
  #resultWrap.show{ display:block; }
  #resultCard{
    position:relative;
    background:linear-gradient(160deg,#fffdf6,#fff1cf);
    border:3px solid var(--mustard-dark);
    border-radius:18px;
    padding:22px 18px 20px;
    text-align:center;
    box-shadow:0 10px 20px rgba(0,0,0,.15);
    animation:cardPop .5s cubic-bezier(.3,1.6,.4,1);
  }
  @keyframes cardPop{
    0%{ transform:scale(.6) rotate(-6deg); opacity:0; }
    100%{ transform:scale(1) rotate(0deg); opacity:1; }
  }
  #resultCard .stamp{
    position:absolute; top:-18px; right:-10px;
    background:var(--red);
    color:#fff;
    font-size:13px; font-weight:900;
    padding:6px 14px;
    border-radius:20px;
    transform:rotate(12deg);
    box-shadow:0 4px 8px rgba(0,0,0,.25);
    animation:stampPop .4s cubic-bezier(.3,1.8,.4,1) .5s backwards;
  }
  @keyframes stampPop{
    0%{ transform:rotate(12deg) scale(0); }
    70%{ transform:rotate(12deg) scale(1.2); }
    100%{ transform:rotate(12deg) scale(1); }
  }
  #resultCard .eyebrow{
    font-size:11px; color:#b08a2a; font-weight:700; letter-spacing:2px; margin-bottom:10px;
  }
  #resultText{
    font-size:19px;
    font-weight:900;
    color:var(--ink);
    line-height:1.5;
  }

  #retryBtn{
    display:block;
    margin:16px auto 0;
    padding:12px 28px;
    border:none; border-radius:24px;
    background:linear-gradient(160deg, var(--teal), var(--teal-dark));
    color:#fff; font-weight:800; font-size:13.5px; letter-spacing:1px;
    box-shadow:0 5px 0 #124e4e, 0 8px 12px rgba(0,0,0,.2);
  }
  #retryBtn:active{ transform:translateY(4px); box-shadow:0 1px 0 #124e4e; }

  #footerNote{
    text-align:center;
    font-size:9.5px;
    color:#a89a78;
    letter-spacing:1px;
    margin-top:14px;
  }
</style>
</head>
<body>

<div id="page">
  <div id="machine">
    <div class="rivet" style="top:22px; left:12px;"></div>
    <div class="rivet" style="top:22px; right:12px;"></div>
    <div id="stripeBar"></div>

    <header>
      <h1>いいこと抽出マシーン</h1>
      <div class="badge">POSITIVE EXTRACTOR MK-1</div>
    </header>

    <div id="slotWrap">
      <div id="slotLabel">📥 投入口：やらかし・落ち込みを入れてください</div>
      <textarea id="worryInput" maxlength="200" placeholder="例）今日のミーティングで頭が真っ白になって、変なこと言っちゃった…"></textarea>
    </div>

    <div id="buttonWrap">
      <button id="extractBtn">
        <div class="ring"></div>
        1個<br>いいことを<br>見つける！
      </button>
    </div>

    <div id="loadingWrap">
      <div id="gearRow">
        <div class="gear"></div>
        <div class="gear rev"></div>
        <div class="gear"></div>
      </div>
      <div id="lightsRow">
        <div class="lamp"></div><div class="lamp"></div><div class="lamp"></div><div class="lamp"></div><div class="lamp"></div>
      </div>
      <div id="statusText">解析中…</div>
      <div id="progressOuter"><div id="progressInner"></div></div>
    </div>

    <div id="dispenseSlot"></div>

    <div id="capsuleArea">
      <div id="capsule">
        <div class="capsuleHalf top"></div>
        <div class="capsuleHalf bottom"></div>
      </div>
    </div>

    <div id="resultWrap">
      <div id="resultCard">
        <div class="stamp">GET!</div>
        <div class="eyebrow">抽出結果</div>
        <div id="resultText"></div>
      </div>
      <button id="retryBtn">もう一回まわす</button>
    </div>

    <div id="footerNote">RESULT MAY NOT BE LOGICAL, BUT IT'S TRUE.</div>
  </div>
</div>

<script>
(function(){
  const worryInput = document.getElementById('worryInput');
  const extractBtn = document.getElementById('extractBtn');
  const loadingWrap = document.getElementById('loadingWrap');
  const statusText = document.getElementById('statusText');
  const progressInner = document.getElementById('progressInner');
  const capsule = document.getElementById('capsule');
  const resultWrap = document.getElementById('resultWrap');
  const resultText = document.getElementById('resultText');
  const retryBtn = document.getElementById('retryBtn');
  const slotWrap = document.getElementById('slotWrap');
  const buttonWrap = document.getElementById('buttonWrap');

  const goodThings = [
    "それに気づけたってことは、客観視できてる証拠！",
    "とりあえず息しててえらい！",
    "そのモヤモヤは、本気で向き合おうとした（熱量があった）証拠！",
    "でも、とりあえず寝れば明日は来る！",
    "やらかしたけど、データ（経験値）は1つ取れた！"
  ];

  const statusMessages = [
    "ガシャガシャ解析中…",
    "いいこと成分を検出中…",
    "ポジティブ変換プロトコル起動…",
    "自己嫌悪データを分解中…",
    "視点をずらすパーツを装填中…",
    "抽出パーツを組み立て中…"
  ];

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  let statusTimer = null;
  let progressTimer = null;

  function startExtraction(){
    if(!worryInput.value.trim()) {
      worryInput.focus();
      worryInput.style.borderColor = '#e2543b';
      setTimeout(() => { worryInput.style.borderColor = ''; }, 600);
      return;
    }

    extractBtn.classList.add('disabled');
    resultWrap.classList.remove('show');
    capsule.classList.remove('drop','cracking');
    capsule.style.display = 'none';

    loadingWrap.classList.add('show');
    statusText.textContent = pick(statusMessages);
    progressInner.style.width = '0%';

    let progress = 0;
    const DURATION = 2200;
    const stepTime = 60;
    progressTimer = setInterval(() => {
      progress += (100 / (DURATION/stepTime)) * (0.7 + Math.random()*0.6);
      if(progress >= 100) progress = 100;
      progressInner.style.width = progress + '%';
    }, stepTime);

    statusTimer = setInterval(() => {
      statusText.textContent = pick(statusMessages);
    }, 420);

    setTimeout(() => {
      clearInterval(statusTimer);
      clearInterval(progressTimer);
      progressInner.style.width = '100%';
      statusText.textContent = '抽出完了！';
      setTimeout(finishExtraction, 350);
    }, DURATION);
  }

  function finishExtraction(){
    loadingWrap.classList.remove('show');

    capsule.style.display = 'block';
    capsule.classList.add('drop');

    setTimeout(() => {
      capsule.classList.add('cracking');
    }, 550);

    setTimeout(() => {
      capsule.style.display = 'none';
      capsule.classList.remove('drop','cracking');
      resultText.textContent = pick(goodThings);
      resultWrap.classList.add('show');
      extractBtn.classList.remove('disabled');
    }, 1050);
  }

  function resetMachine(){
    resultWrap.classList.remove('show');
    worryInput.value = '';
    worryInput.focus();
  }

  extractBtn.addEventListener('click', startExtraction);
  retryBtn.addEventListener('click', resetMachine);
})();
</script>
</body>
</html>
