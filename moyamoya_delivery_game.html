<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>モヤモヤ納品</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo-deep:#1f3350;
    --indigo-mid:#2e4a70;
    --washi:#f6efe0;
    --gold:#c9a227;
    --gold-light:#e6c869;
    --vermillion:#b23a2f;
    --charcoal:#3a332a;
    --paper1:#efe6d8;
    --paper2:#e6dbc4;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--charcoal);
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    touch-action:none;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.18) 0 2px, transparent 2px 6px),
      linear-gradient(160deg, var(--paper1), var(--paper2));
  }
  .mincho{ font-family:"Shippori Mincho", serif; }
  #app{
    position:relative; width:100%; height:100%;
    max-width:520px; margin:0 auto;
    display:flex; flex-direction:column; align-items:center;
    padding:8px 10px 10px;
  }

  /* ===== HUD ===== */
  #hud{ width:100%; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  #scoreBox{ font-weight:700; }
  #scoreBox small{ display:block; font-size:10px; color:#8a7a5a; }
  #scoreVal{ font-size:20px; font-variant-numeric:tabular-nums; }
  #destBox{ text-align:center; font-size:11px; color:#8a7a5a; }
  #destName{ display:block; font-size:14px; font-weight:700; color:var(--indigo-deep); }
  #lineBar{ width:90px; height:5px; margin:3px auto 0; border-radius:3px; background:#0001; overflow:hidden; }
  #lineBarIn{ height:100%; width:0; background:var(--gold); transition:width .3s ease; }
  #nextBox{ text-align:center; font-size:10px; color:#8a7a5a; }
  #nextCanvas{ display:block; margin-top:2px; background:#fffaf0; border:1px solid #d8c69a; border-radius:6px; }

  /* ===== 箱 ===== */
  #boxWrap{
    flex:1; width:100%;
    display:flex; align-items:center; justify-content:center;
    min-height:0; margin:6px 0;
    position:relative;
  }
  #board{
    display:block;
    border-radius:8px;
    background:linear-gradient(180deg, #f6efe0, #e8dcc0);
    box-shadow:
      0 0 0 6px var(--indigo-mid),
      0 0 0 8px var(--gold-light),
      0 14px 24px rgba(30,20,10,.3);
  }
  #shipBanner{
    position:absolute; left:50%; top:40%;
    transform:translate(-50%,-50%);
    text-align:center; pointer-events:none; opacity:0; z-index:5;
  }
  #shipBanner.show{ animation:banner 1.4s ease forwards; }
  @keyframes banner{ 0%{ opacity:0; transform:translate(-50%,-30%) scale(.8); } 15%,75%{ opacity:1; transform:translate(-50%,-50%) scale(1); } 100%{ opacity:0; } }
  #shipBanner .big{
    font-family:"Shippori Mincho", serif;
    font-size:26px; font-weight:700; color:#fff;
    background:var(--vermillion); padding:4px 18px; border-radius:8px;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
  }
  #shipBanner .small{ margin-top:6px; font-size:13px; font-weight:700; color:var(--indigo-deep); background:#fffaf0e8; padding:3px 10px; border-radius:10px; display:inline-block; }

  /* ===== ボタン ===== */
  #pad{ width:100%; display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; }
  .pbtn{
    padding:12px 0;
    border:none; border-radius:12px;
    background:linear-gradient(160deg, var(--indigo-mid), var(--indigo-deep));
    color:#f6efe0; font-size:18px; font-weight:700; font-family:inherit;
    box-shadow:0 4px 0 #16273e; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .pbtn:active{ transform:translateY(3px); box-shadow:0 1px 0 #16273e; }
  .pbtn.drop{ background:linear-gradient(160deg, var(--gold-light), var(--gold)); color:#4a3a10; box-shadow:0 4px 0 #9c7d1c; }

  /* ===== はじまり・結果 ===== */
  .overlay{
    position:fixed; inset:0; z-index:50;
    background:rgba(40,30,20,.75);
    display:none; flex-direction:column; align-items:center;
    padding:16px; overflow-y:auto; text-align:center;
    touch-action:pan-y;
  }
  .overlay.show{ display:flex; }
  .card{
    margin:auto 0; width:100%; max-width:340px;
    background:linear-gradient(160deg,#fffaf0,#f2e6cc);
    border:1px solid #d8c69a; border-radius:18px;
    padding:20px 18px;
    box-shadow:0 20px 40px rgba(0,0,0,.35);
  }
  .title{ font-family:"Shippori Mincho", serif; font-size:22px; font-weight:700; color:var(--indigo-deep); letter-spacing:3px; }
  .howto{ text-align:left; font-size:12.5px; line-height:1.85; background:#ffffff90; border-radius:12px; padding:10px 12px; margin:12px 0; }
  .best{ font-size:12px; color:#8a7a5a; margin-bottom:12px; }
  .mainBtn{
    padding:12px 34px; border:none; border-radius:24px;
    background:linear-gradient(160deg, var(--indigo-mid), var(--indigo-deep));
    color:#f6efe0; font-weight:700; font-size:15px; font-family:inherit;
    box-shadow:0 5px 0 #16273e; cursor:pointer;
  }
  .stamp{ font-family:"Shippori Mincho", serif; font-size:13px; letter-spacing:4px; color:var(--vermillion); font-weight:700; }
  #finalScore{ font-size:42px; font-weight:700; color:var(--indigo-deep); line-height:1.15; font-variant-numeric:tabular-nums; }
  #newBest{ display:inline-block; margin:4px 0; font-size:11.5px; font-weight:700; letter-spacing:2px; color:#fff; background:var(--vermillion); padding:2px 12px; border-radius:10px; }
  #bestLine{ font-size:12px; color:#8a7a5a; margin-bottom:10px; }
  .stats{ display:flex; gap:8px; justify-content:center; margin-bottom:10px; }
  .stat{ background:#ffffffa0; border-radius:10px; padding:7px 10px; min-width:84px; }
  .stat .n{ font-size:18px; font-weight:700; color:var(--indigo-deep); }
  .stat .l{ font-size:10.5px; color:#8a7a5a; }
  #comment{ font-size:13px; background:#ffffffa0; border-radius:10px; padding:7px 10px; margin-bottom:14px; }
</style>
</head>
<body>

<div id="app">
  <div id="hud">
    <div id="scoreBox"><small>SCORE</small><span id="scoreVal">0</span></div>
    <div id="destBox">いまの届け先<span id="destName"></span><div id="lineBar"><div id="lineBarIn"></div></div></div>
    <div id="nextBox">NEXT<canvas id="nextCanvas"></canvas></div>
  </div>

  <div id="boxWrap">
    <canvas id="board"></canvas>
    <div id="shipBanner"><div class="big" id="bannerBig">出荷！</div><div class="small" id="bannerSmall"></div></div>
  </div>

  <div id="pad">
    <button class="pbtn" data-a="left">◀</button>
    <button class="pbtn" data-a="rotate">⟳</button>
    <button class="pbtn" data-a="right">▶</button>
    <button class="pbtn" data-a="down">▼</button>
    <button class="pbtn drop" data-a="drop">⤓</button>
  </div>
</div>

<div id="startScreen" class="overlay show">
  <div class="card">
    <div class="title">モヤモヤ納品</div>
    <div class="howto">
      モヤモヤが書かれたブロックが落ちてくる。箱にすきまなく詰めよう。<br>
      横1列そろうと <b>出荷！</b> 5列出荷するごとに、届け先が遠くなる。<br>
      箱からあふれたら、おしまい。<br>
      <span style="font-size:11.5px;color:#8a7a5a">◀▶ 移動　⟳ 回転　▼ ゆっくり落とす　⤓ 一気に落とす<br>画面のスワイプ・タップ、キーボード（←→↑↓・スペース）でも操作できます</span>
    </div>
    <div class="best" id="startBest"></div>
    <button class="mainBtn" id="startBtn">箱を用意する</button>
  </div>
</div>

<div id="resultScreen" class="overlay">
  <div class="card">
    <div class="stamp">— 本日の納品 —</div>
    <div id="finalScore">0</div>
    <div id="newBest">NEW BEST!</div>
    <div id="bestLine"></div>
    <div class="stats">
      <div class="stat"><div class="n" id="stLines">0</div><div class="l">出荷した列</div></div>
      <div class="stat"><div class="n" id="stDest" style="font-size:14px">-</div><div class="l">いちばん遠い届け先</div></div>
    </div>
    <div id="comment"></div>
    <button class="mainBtn" id="retryBtn">また箱を用意する</button>
  </div>
</div>

<script>
(function(){
  const COLS = 8, ROWS = 14;

  // 4文字のモヤモヤ（1マス1文字）
  const WORDS = ['情けない','もう無理','嫌われた','自己嫌悪','気まずい','言いすぎ','中途半端','失敗した','落ち込む','自信ない',
                 '才能ない','要領悪い','不安だな','焦ってる','空回りだ','寝不足だ','締め切り','恥かいた','比べがち','後悔多め',
                 '素直ゼロ','強がった','また遅刻','先延ばし','気にしい'].filter(w => Array.from(w).length === 4);

  // テトロミノ（n×n の中での座標）
  const SHAPES = {
    I:{ n:4, cells:[[0,1],[1,1],[2,1],[3,1]], color:'#9fb8d8' },
    O:{ n:2, cells:[[0,0],[1,0],[0,1],[1,1]], color:'#e6c869' },
    T:{ n:3, cells:[[0,1],[1,1],[2,1],[1,0]], color:'#c9a0d8' },
    L:{ n:3, cells:[[0,1],[1,1],[2,1],[2,0]], color:'#e8a878' },
    J:{ n:3, cells:[[0,0],[0,1],[1,1],[2,1]], color:'#8fb8c8' },
    S:{ n:3, cells:[[1,0],[2,0],[0,1],[1,1]], color:'#a8cf8a' },
    Z:{ n:3, cells:[[0,0],[1,0],[1,1],[2,1]], color:'#e09a9a' }
  };
  const TYPES = Object.keys(SHAPES);

  const DESTS = ['🏠 となりの町','🗻 富士山頂','🌕 月の裏側','🐧 南極','🐟 深海6000m','🦕 白亜紀','🏃 江戸時代','🌌 銀河の果て','🏛️ 未来の博物館','🕳️ ブラックホール'];
  const LINES_PER_DEST = 5;
  const COMMENTS = {
    great: ['宇宙規模の配送業者だ','その詰め方、職人芸','もはや倉庫の主'],
    good:  ['いい箱詰めだった','手際がよくなってきた','遠くまで届けたね'],
    normal:['まずは近場から','次はもっと遠くへ','箱はいくらでもあるよ']
  };

  const SAVE_KEY = 'moyamoyaPack_v1';
  function loadSave(){
    try{ return Object.assign({ best:0, bestDest:0 }, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); }
    catch(e){ return { best:0, bestDest:0 }; }
  }
  function writeSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
  let save = loadSave();

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  const board = document.getElementById('board');
  const ctx = board.getContext('2d');
  const nextCanvas = document.getElementById('nextCanvas');
  const nctx = nextCanvas.getContext('2d');
  let cell = 28;

  /* ===== 状態 ===== */
  let grid = [];        // grid[y][x] = { ch, color } | null
  let piece = null, nextPiece = null;
  let running = false, clearing = false;
  let score = 0, lines = 0, destIndex = 0;
  let dropTimer = 0, lastTs = null, rafId = null;
  let bag = [];

  function emptyGrid(){ grid = Array.from({ length:ROWS }, () => Array(COLS).fill(null)); }

  function newPiece(){
    if(bag.length === 0) bag = TYPES.slice().sort(() => Math.random() - .5);
    const type = bag.pop();
    const s = SHAPES[type];
    const word = Array.from(pick(WORDS));
    // 読む順（上→下、左→右）に1文字ずつ置く
    const order = s.cells.slice().sort((a,b) => a[1] - b[1] || a[0] - b[0]);
    const cells = order.map((c, i) => ({ x:c[0], y:c[1], ch:word[i] }));
    return { type, n:s.n, color:s.color, cells, x:Math.floor((COLS - s.n) / 2), y:-1, word:word.join('') };
  }

  function collides(p, dx, dy, cells){
    return (cells || p.cells).some(c => {
      const x = p.x + c.x + dx, y = p.y + c.y + dy;
      if(x < 0 || x >= COLS || y >= ROWS) return true;
      return y >= 0 && grid[y][x];
    });
  }

  function rotate(){
    if(!piece || piece.type === 'O') return;
    const rotated = piece.cells.map(c => ({ x: piece.n - 1 - c.y, y: c.x, ch: c.ch }));
    for(const kick of [0, -1, 1, -2, 2]){
      if(!collides(piece, kick, 0, rotated)){
        piece.cells = rotated;
        piece.x += kick;
        draw();
        return;
      }
    }
  }
  function move(dx){
    if(piece && !collides(piece, dx, 0)){ piece.x += dx; draw(); }
  }
  function softDrop(){
    if(!piece) return;
    if(!collides(piece, 0, 1)){ piece.y++; score += 1; dropTimer = 0; renderHud(); draw(); }
    else lock();
  }
  function hardDrop(){
    if(!piece) return;
    let d = 0;
    while(!collides(piece, 0, d + 1)) d++;
    piece.y += d;
    score += d * 2;
    lock();
  }

  function lock(){
    let over = false;
    piece.cells.forEach(c => {
      const x = piece.x + c.x, y = piece.y + c.y;
      if(y < 0){ over = true; return; }
      grid[y][x] = { ch:c.ch, color:piece.color };
    });
    piece = null;
    renderHud();
    if(over){ gameOver(); return; }
    const full = [];
    for(let y=0;y<ROWS;y++) if(grid[y].every(Boolean)) full.push(y);
    if(full.length){
      clearRows(full);
    } else {
      spawn();
    }
    draw();
  }

  function clearRows(full){
    clearing = true;
    let flashes = 0;
    const iv = setInterval(() => {
      flashes++;
      draw(flashes % 2 ? full : []);
      if(flashes >= 4){
        clearInterval(iv);
        full.forEach(y => { grid.splice(y, 1); grid.unshift(Array(COLS).fill(null)); });
        const before = destIndex;
        lines += full.length;
        score += [0, 100, 300, 500, 800][full.length] * (destIndex + 1);
        destIndex = Math.min(DESTS.length - 1, Math.floor(lines / LINES_PER_DEST));
        if(destIndex > before) banner('出荷完了！', `次の届け先：${DESTS[destIndex]}`);
        else banner(full.length >= 2 ? `${full.length}列 出荷！` : '出荷！', DESTS[destIndex] + ' へ');
        clearing = false;
        renderHud();
        spawn();
        draw();
      }
    }, 70);
  }

  function spawn(){
    piece = nextPiece || newPiece();
    nextPiece = newPiece();
    drawNext();
    if(collides(piece, 0, 0)) gameOver();
  }

  function banner(big, small){
    document.getElementById('bannerBig').textContent = big;
    document.getElementById('bannerSmall').textContent = small;
    const b = document.getElementById('shipBanner');
    b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  }

  function gravity(){ return Math.max(0.09, 0.75 - destIndex * 0.07); }   // 秒/1マス

  /* ===== 描画 ===== */
  function resize(){
    const wrap = document.getElementById('boxWrap');
    const h = wrap.clientHeight - 16, w = wrap.clientWidth - 24;
    cell = Math.max(16, Math.floor(Math.min(h / ROWS, w / COLS)));
    const dpr = window.devicePixelRatio || 1;
    board.width = COLS * cell * dpr; board.height = ROWS * cell * dpr;
    board.style.width = COLS * cell + 'px'; board.style.height = ROWS * cell + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const nc = Math.round(cell * 0.6);
    nextCanvas.width = 4 * nc * dpr; nextCanvas.height = 2.5 * nc * dpr;
    nextCanvas.style.width = 4 * nc + 'px'; nextCanvas.style.height = 2.5 * nc + 'px';
    nctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(); drawNext();
  }

  function drawCell(c2, x, y, size, color, ch, alpha){
    c2.globalAlpha = alpha == null ? 1 : alpha;
    c2.fillStyle = color;
    c2.fillRect(x + 1, y + 1, size - 2, size - 2);
    c2.fillStyle = 'rgba(255,255,255,.35)';
    c2.fillRect(x + 1, y + 1, size - 2, 3);
    c2.strokeStyle = 'rgba(58,51,42,.35)';
    c2.lineWidth = 1;
    c2.strokeRect(x + 1.5, y + 1.5, size - 3, size - 3);
    if(ch){
      c2.fillStyle = '#3a332a';
      c2.font = `700 ${Math.floor(size * 0.55)}px "Zen Kaku Gothic New", sans-serif`;
      c2.textAlign = 'center'; c2.textBaseline = 'middle';
      c2.fillText(ch, x + size/2, y + size/2 + 1);
    }
    c2.globalAlpha = 1;
  }

  function draw(flashRows){
    const W = COLS * cell, H = ROWS * cell;
    ctx.clearRect(0, 0, W, H);
    // うっすらマス目
    ctx.strokeStyle = 'rgba(0,0,0,.05)';
    for(let x=1;x<COLS;x++){ ctx.beginPath(); ctx.moveTo(x*cell, 0); ctx.lineTo(x*cell, H); ctx.stroke(); }
    for(let y=1;y<ROWS;y++){ ctx.beginPath(); ctx.moveTo(0, y*cell); ctx.lineTo(W, y*cell); ctx.stroke(); }
    for(let y=0;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        const g = grid[y][x];
        if(!g) continue;
        const flash = flashRows && flashRows.includes(y);
        drawCell(ctx, x*cell, y*cell, cell, flash ? '#fff6c8' : g.color, g.ch);
      }
    }
    if(piece){
      // 落ちる場所のガイド
      let d = 0;
      while(!collides(piece, 0, d + 1)) d++;
      piece.cells.forEach(c => {
        const y = piece.y + c.y + d;
        if(y >= 0) drawCell(ctx, (piece.x + c.x)*cell, y*cell, cell, piece.color, '', 0.22);
      });
      piece.cells.forEach(c => {
        const y = piece.y + c.y;
        if(y >= 0) drawCell(ctx, (piece.x + c.x)*cell, y*cell, cell, piece.color, c.ch);
      });
    }
  }

  function drawNext(){
    const nc = Math.round(cell * 0.6);
    nctx.clearRect(0, 0, 4*nc, 2.5*nc);
    if(!nextPiece) return;
    const xs = nextPiece.cells.map(c => c.x), ys = nextPiece.cells.map(c => c.y);
    const minX = Math.min(...xs), minY = Math.min(...ys);
    const w = Math.max(...xs) - minX + 1, h = Math.max(...ys) - minY + 1;
    const ox = (4 - w) * nc / 2, oy = (2.5 - h) * nc / 2;
    nextPiece.cells.forEach(c => drawCell(nctx, ox + (c.x - minX)*nc, oy + (c.y - minY)*nc, nc, nextPiece.color, c.ch));
  }

  function renderHud(){
    document.getElementById('scoreVal').textContent = score.toLocaleString();
    document.getElementById('destName').textContent = DESTS[destIndex];
    document.getElementById('lineBarIn').style.width = ((lines % LINES_PER_DEST) / LINES_PER_DEST * 100) + '%';
  }

  /* ===== ループ ===== */
  function loop(ts){
    if(!running) return;
    if(lastTs === null) lastTs = ts;
    const dt = Math.min(0.1, (ts - lastTs) / 1000);
    lastTs = ts;
    if(!clearing && piece){
      dropTimer += dt;
      if(dropTimer >= gravity()){
        dropTimer = 0;
        if(!collides(piece, 0, 1)){ piece.y++; draw(); }
        else lock();
      }
    }
    rafId = requestAnimationFrame(loop);
  }

  /* ===== 操作 ===== */
  function action(a){
    if(!running || clearing) return;
    if(a === 'left') move(-1);
    else if(a === 'right') move(1);
    else if(a === 'rotate') rotate();
    else if(a === 'down') softDrop();
    else if(a === 'drop') hardDrop();
  }
  document.querySelectorAll('.pbtn').forEach(b => b.addEventListener('click', () => action(b.dataset.a)));
  window.addEventListener('keydown', e => {
    const map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'rotate', ArrowDown:'down', ' ':'drop' };
    if(map[e.key]){ e.preventDefault(); action(map[e.key]); }
  });
  // スワイプ：左右で移動、下で一気に落とす、タップで回転
  let sx = 0, sy = 0, lastX = 0, moved = false, tracking = false;
  board.addEventListener('pointerdown', e => { sx = lastX = e.clientX; sy = e.clientY; moved = false; tracking = true; });
  window.addEventListener('pointermove', e => {
    if(!tracking) return;
    const step = cell * 0.9;
    while(e.clientX - lastX > step){ action('right'); lastX += step; moved = true; }
    while(lastX - e.clientX > step){ action('left'); lastX -= step; moved = true; }
  });
  window.addEventListener('pointerup', e => {
    if(!tracking) return;
    tracking = false;
    const dy = e.clientY - sy, dx = e.clientX - sx;
    if(dy > cell * 2 && Math.abs(dy) > Math.abs(dx)) action('drop');
    else if(!moved && Math.abs(dx) < 10 && Math.abs(dy) < 10) action('rotate');
  });

  function startGame(){
    document.getElementById('startScreen').classList.remove('show');
    document.getElementById('resultScreen').classList.remove('show');
    emptyGrid();
    score = 0; lines = 0; destIndex = 0; bag = []; nextPiece = null; clearing = false;
    renderHud();
    spawn();
    running = true;
    lastTs = null; dropTimer = 0;
    resize();
    rafId = requestAnimationFrame(loop);
  }

  function gameOver(){
    if(!running) return;
    running = false;
    cancelAnimationFrame(rafId);
    const isBest = score > save.best;
    if(isBest) save.best = score;
    save.bestDest = Math.max(save.bestDest, destIndex);
    writeSave();
    document.getElementById('finalScore').textContent = score.toLocaleString();
    document.getElementById('newBest').style.display = isBest && score > 0 ? 'inline-block' : 'none';
    document.getElementById('bestLine').textContent = `自己ベスト ${save.best.toLocaleString()}`;
    document.getElementById('stLines').textContent = lines;
    document.getElementById('stDest').textContent = DESTS[destIndex];
    const pool = destIndex >= 4 ? COMMENTS.great : destIndex >= 2 ? COMMENTS.good : COMMENTS.normal;
    document.getElementById('comment').textContent = pick(pool);
    setTimeout(() => document.getElementById('resultScreen').classList.add('show'), 500);
    sendResultToPortal();
  }

  // ポータルサイトに埋め込まれている場合、結果を親ウィンドウへ送信する（score はランキング用）
  function sendResultToPortal(){
    try{
      window.parent.postMessage({
        type: 'moyamoyaGameResult',
        gameId: 'moyamoya-delivery',
        summary: `スコア ${score.toLocaleString()}（${lines}列出荷・${DESTS[destIndex]}まで）`,
        detail: { score, lines, dest: destIndex }
      }, '*');
    }catch(e){ /* ポータル外で単体表示している場合は何もしない */ }
  }

  window.addEventListener('resize', resize);
  document.getElementById('startBest').textContent = save.best > 0 ? `自己ベスト ${save.best.toLocaleString()}` : '';
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  emptyGrid();
  renderHud();
  // フォント読み込み後にサイズを合わせて描き直す
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(resize);
  resize();
})();
</script>
</body>
</html>
