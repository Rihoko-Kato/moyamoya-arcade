<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FACT ラン</title>
<style>
  :root{
    --sky1:#8ed1f0;
    --sky2:#cdeeff;
    --sun:#ffe066;
    --ground1:#7ec850;
    --ground2:#5fae3b;
    --dirt1:#c99a5b;
    --dirt2:#b6813f;
    --player:#ff9b54;
    --player-dark:#e07a30;
    --wall1:#ffb3c6;
    --wall2:#b3e5ff;
    --wall3:#ffe08a;
    --wall4:#c6f0c2;
    --ink:#3a3a3a;
    --accent:#ff6b6b;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    font-family:"Hiragino Sans","Yu Gothic","Zen Maru Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    color:var(--ink);
  }

  #stage{
    position:relative;
    width:100%; height:100%;
    background:linear-gradient(180deg, var(--sky1), var(--sky2) 70%);
    overflow:hidden;
    transition:background 1.2s ease;
  }
  #stage.shake{ animation:shake .35s ease; }
  @keyframes shake{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-8px,3px); }
    40%{ transform:translate(8px,-3px); }
    60%{ transform:translate(-6px,3px); }
    80%{ transform:translate(6px,-2px); }
  }

  /* ===== 景色（累計距離で変化） ===== */
  #stage.scene-morning{ --sky1:#ffd6c2; --sky2:#fff3d9; --sun:#ffd07a; }
  #stage.scene-day{ --sky1:#8ed1f0; --sky2:#cdeeff; --sun:#ffe066; }
  #stage.scene-evening{ --sky1:#ff9a76; --sky2:#ffd59e; --sun:#ff7b54; --ground1:#8fb850; --ground2:#6f9a3b; }
  #stage.scene-night{ --sky1:#1d2557; --sky2:#3d4a8a; --sun:#fff8d6; --ground1:#4a7a3a; --ground2:#3a6230; --dirt1:#7a5f3d; --dirt2:#6a5030; }
  #stage.scene-space{ --sky1:#05051a; --sky2:#1a1040; --sun:#fff8d6; --ground1:#b8b8c8; --ground2:#9a9ab0; --dirt1:#8a8aa0; --dirt2:#7a7a90; }
  #stage.scene-night #sun, #stage.scene-space #sun{
    box-shadow:0 0 0 8px rgba(255,248,214,.15), 0 0 30px rgba(255,248,214,.4);
    background:radial-gradient(circle at 65% 35%, transparent 38%, var(--sun) 40%);
  }
  #stage.scene-night .cloud{ opacity:.25; }
  #stage.scene-space .cloud{ display:none; }

  #nightStars{ position:absolute; inset:0; z-index:0; opacity:0; transition:opacity 1.2s ease; pointer-events:none; }
  #stage.scene-night #nightStars, #stage.scene-space #nightStars{ opacity:1; }
  .nstar{ position:absolute; background:#fff; border-radius:50%; animation:twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.3;} 50%{opacity:1;} }

  /* 太陽 */
  #sun{
    position:absolute; top:8%; right:12%;
    width:70px; height:70px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6c9, var(--sun));
    box-shadow:0 0 0 10px rgba(255,224,102,.35), 0 0 40px rgba(255,224,102,.5);
    z-index:1;
  }

  /* 雲（CSSアニメでゆったり流れる） */
  .cloud{
    position:absolute;
    background:#fff;
    border-radius:50px;
    opacity:.9;
    z-index:1;
  }
  .cloud::before, .cloud::after{
    content:"";
    position:absolute;
    background:#fff;
    border-radius:50%;
  }
  #cloud1{ width:90px; height:32px; top:14%; left:-120px; animation:cloudMove 16s linear infinite; }
  #cloud1::before{ width:46px; height:46px; top:-22px; left:10px; }
  #cloud1::after{ width:34px; height:34px; top:-14px; left:44px; }
  #cloud2{ width:70px; height:26px; top:26%; left:-160px; animation:cloudMove 22s linear infinite; animation-delay:-6s; }
  #cloud2::before{ width:36px; height:36px; top:-18px; left:8px; }
  #cloud2::after{ width:26px; height:26px; top:-10px; left:36px; }
  #cloud3{ width:60px; height:22px; top:8%; left:-100px; animation:cloudMove 19s linear infinite; animation-delay:-12s; }
  #cloud3::before{ width:30px; height:30px; top:-14px; left:6px; }
  #cloud3::after{ width:22px; height:22px; top:-8px; left:30px; }
  @keyframes cloudMove{
    from{ transform:translateX(0); }
    to{ transform:translateX(calc(100vw + 260px)); }
  }
  #stage.crashed .cloud{ animation-play-state:paused; }

  /* 地面 */
  #ground{
    position:absolute; left:0; right:0; bottom:0;
    height:92px;
    background:
      linear-gradient(180deg, var(--ground1) 0 14px, var(--dirt1) 14px 100%);
    z-index:2;
    border-top:4px solid var(--ground2);
  }
  #groundStripes{
    position:absolute; inset:14px 0 0 0;
    background-image:repeating-linear-gradient(90deg, var(--dirt2) 0 26px, transparent 26px 52px);
    background-size:52px 100%;
  }

  /* プレイヤー */
  #player{
    position:absolute;
    left:70px;
    bottom:92px;
    width:44px; height:44px;
    background:linear-gradient(160deg, #ffcf94, var(--player));
    border:3px solid var(--player-dark);
    border-radius:12px;
    z-index:5;
    will-change:transform;
  }
  #player .face{
    position:absolute; inset:0;
  }
  #player .eye{
    position:absolute; top:13px; width:6px; height:7px; background:var(--ink); border-radius:50%;
  }
  #player .eye.l{ left:10px; }
  #player .eye.r{ left:24px; }
  #player .mouth{
    position:absolute; left:12px; top:24px; width:16px; height:8px;
    border-bottom:3px solid var(--ink); border-radius:0 0 10px 10px;
  }
  /* 頭の芽（挑戦回数で育つ） */
  #sprout{
    position:absolute; left:50%; top:-24px;
    transform:translateX(-50%);
    font-size:20px; line-height:1;
    pointer-events:none;
  }
  #player.running{ animation:runBob .3s ease-in-out infinite; }
  @keyframes runBob{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-3px) rotate(-2deg); }
  }
  #player.stumble{ animation:stumble .5s ease; }
  @keyframes stumble{
    0%{ transform:rotate(0deg); }
    30%{ transform:rotate(28deg) translateY(-4px); }
    70%{ transform:rotate(-8deg); }
    100%{ transform:rotate(0deg); }
  }
  #player.crashed{
    animation:none;
    transform:rotate(90deg) translateY(4px);
    transition:transform .3s ease;
  }

  /* プレイヤーの影（高さに応じて縮小・薄くなる＝浮遊感） */
  #playerShadow{
    position:absolute;
    left:70px;
    bottom:90px;
    width:40px; height:12px;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.35), transparent 75%);
    border-radius:50%;
    z-index:4;
    transform-origin:center;
    pointer-events:none;
  }

  /* 砂ぼこり（ジャンプ・着地の反動演出） */
  .dust{
    position:absolute;
    width:8px; height:8px;
    border-radius:50%;
    background:rgba(255,255,255,.85);
    z-index:6;
    pointer-events:none;
    animation:dustPuff .5s ease-out forwards;
  }
  @keyframes dustPuff{
    0%{ opacity:.9; transform:translate(0,0) scale(1); }
    100%{ opacity:0; transform:translate(var(--dx), var(--dy)) scale(1.8); }
  }

  /* 空中のモーション線（飛んでる感を強調） */
  .jumpTrail{
    position:absolute;
    width:26px; height:10px;
    border-radius:6px;
    background:rgba(255,255,255,.55);
    z-index:4;
    pointer-events:none;
    animation:trailFade .4s ease-out forwards;
  }
  @keyframes trailFade{
    0%{ opacity:.7; transform:scaleX(1); }
    100%{ opacity:0; transform:scaleX(.3) translateX(-14px); }
  }

  /* ジャンプ中の表情（目を見開く） */
  #player.airborne .eye{ height:9px; top:11px; }
  #player.airborne .mouth{ width:12px; height:10px; border-radius:50%; border:3px solid var(--ink); border-bottom:none; top:23px; }

  /* ===== 道中のもの（小石・☆） ===== */
  .rock{
    position:absolute;
    bottom:92px;
    z-index:4;
    background:linear-gradient(160deg,#b9b1a6,#8c8378);
    border:2px solid #6f675d;
    border-radius:50% 50% 30% 30% / 70% 70% 30% 30%;
    pointer-events:none;
  }
  .rock.kicked{ transition:transform .6s ease-out, opacity .6s ease-out; opacity:0; }
  .star{
    position:absolute;
    z-index:4;
    width:28px; height:28px;
    font-size:26px; line-height:28px; text-align:center;
    color:#ffd23f;
    text-shadow:0 0 8px rgba(255,210,63,.8), 0 2px 0 #e0a800;
    animation:starFloat 1.2s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes starFloat{ 0%,100%{ margin-bottom:0; } 50%{ margin-bottom:5px; } }
  .star.got{ animation:starGot .45s ease-out forwards; }
  @keyframes starGot{ to{ transform:translateY(-40px) scale(1.6); opacity:0; } }

  .floatMsg{
    position:absolute;
    z-index:12;
    font-size:13px; font-weight:800;
    color:#4a4a4a;
    background:#ffffffd0;
    padding:3px 10px; border-radius:12px;
    pointer-events:none;
    white-space:nowrap;
    animation:floatUp .9s ease-out forwards;
  }
  @keyframes floatUp{ 0%{ opacity:0; transform:translateY(0); } 20%{ opacity:1; } 100%{ opacity:0; transform:translateY(-34px); } }

  #wall{
    position:absolute;
    bottom:92px;
    width:76px;
    height:100vh;
    z-index:4;
    background:repeating-linear-gradient(
      180deg,
      var(--wall1) 0 34px,
      var(--wall2) 34px 68px,
      var(--wall3) 68px 102px,
      var(--wall4) 102px 136px
    );
    border-left:4px solid #fff8;
    border-right:4px solid #0002;
    border-radius:6px;
    box-shadow:0 0 0 3px #ffffffaa inset;
  }
  #wall.rare{
    background:linear-gradient(180deg,#ffe9a8,#ffd0f0,#c8e7ff,#d6ffd0,#ffe9a8);
    background-size:100% 300px;
    animation:rareShine 2s linear infinite;
    box-shadow:0 0 0 3px #ffffffcc inset, 0 0 24px rgba(255,220,120,.9);
  }
  @keyframes rareShine{ to{ background-position:0 300px; } }
  #wallLabel{
    position:absolute;
    left:50%; bottom:16px;
    transform:translateX(-50%);
    writing-mode:vertical-rl;
    font-size:17px; font-weight:900; letter-spacing:3px;
    color:#ffffff;
    text-shadow:0 1px 0 rgba(0,0,0,.25), 0 0 6px rgba(0,0,0,.2);
    white-space:nowrap;
  }

  /* FACTテキスト */
  #factText{
    position:absolute;
    left:50%; top:38%;
    transform:translate(-50%,-50%) scale(0);
    z-index:20;
    font-size:0;
    font-weight:900;
    letter-spacing:6px;
    pointer-events:none;
  }
  #factText span{
    display:inline-block;
    font-size:min(20vw, 110px);
    background:linear-gradient(135deg,#ff8ba7,#ffd36e,#8fe3a3,#7ec8f0);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 6px 0 rgba(0,0,0,.08);
  }
  #factText.pop{
    animation:factPop .6s cubic-bezier(.3,1.7,.4,1) forwards;
  }
  @keyframes factPop{
    0%{ transform:translate(-50%,-50%) scale(0) rotate(-8deg); }
    60%{ transform:translate(-50%,-50%) scale(1.15) rotate(3deg); }
    100%{ transform:translate(-50%,-50%) scale(1) rotate(0deg); }
  }
  #factSub{
    position:absolute;
    left:50%; top:54%;
    transform:translate(-50%,0);
    z-index:20;
    font-size:14px;
    font-weight:700;
    color:#5a5a5a;
    background:#ffffffcc;
    padding:6px 16px;
    border-radius:20px;
    opacity:0;
    white-space:nowrap;
  }
  #factSub.show{ animation:factSubIn .4s ease forwards .4s; }
  @keyframes factSubIn{ from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);} }

  /* 紙吹雪 */
  .confetti{
    position:absolute;
    width:9px; height:14px;
    z-index:15;
    border-radius:2px;
    animation:confettiFall 1.4s ease-out forwards;
  }
  @keyframes confettiFall{
    0%{ opacity:1; transform:translate(0,0) rotate(0deg); }
    100%{ opacity:0; transform:translate(var(--cx), var(--cy)) rotate(var(--cr)); }
  }

  /* HUD */
  #hud{
    position:absolute; top:14px; left:14px; z-index:10;
    background:#ffffffaa; padding:8px 14px; border-radius:16px;
    font-size:13px; font-weight:700; color:#4a4a4a;
  }
  #hudTotal{
    position:absolute; top:14px; right:14px; z-index:10;
    background:#ffffff88; padding:6px 12px; border-radius:14px;
    font-size:11px; font-weight:700; color:#5a5a5a;
  }
  #hudTotal:empty{ display:none; }

  /* タップ案内 */
  #tapHint{
    position:absolute; bottom:110px; left:50%; transform:translateX(-50%);
    z-index:10; font-size:12px; font-weight:700; color:#4a4a4a;
    background:#ffffffb0; padding:6px 14px; border-radius:14px;
    animation:hintFade 2.2s ease forwards;
    pointer-events:none;
    white-space:nowrap;
  }
  @keyframes hintFade{ 0%{opacity:1;} 80%{opacity:1;} 100%{opacity:0;} }

  /* リザルト画面 */
  #resultScreen{
    position:fixed; inset:0;
    background:rgba(255,255,255,.6);
    backdrop-filter:blur(2px);
    display:none;
    align-items:center; justify-content:center; flex-direction:column;
    z-index:50; text-align:center; padding:14px;
    overflow-y:auto;
  }
  #resultScreen.show{ display:flex; }
  #resultCard{
    background:#fffdf6;
    border:3px solid #ffe08a;
    border-radius:24px;
    padding:20px 22px 18px;
    width:100%;
    max-width:360px;
    margin:auto;
    box-shadow:0 20px 40px rgba(0,0,0,.15);
    animation:cardPop .5s cubic-bezier(.3,1.6,.4,1);
  }
  @keyframes cardPop{
    0%{ transform:scale(.7) translateY(20px); opacity:0; }
    100%{ transform:scale(1) translateY(0); opacity:1; }
  }
  #resultCard .flatReport{
    font-size:12.5px; color:#8a8a8a; font-weight:700;
    background:#f0f0f0; border-radius:12px; padding:7px 14px;
    display:inline-block; margin-bottom:12px;
  }
  #resultCard h2{
    font-size:17px; margin:0 0 10px; color:#4a4a4a;
  }
  #introLine{
    font-size:12.5px; color:#6a6a6a; font-weight:700;
    margin:-2px 0 12px; line-height:1.6;
  }
  .factRow{
    display:flex; align-items:center; gap:10px;
    background:linear-gradient(135deg,#fff3d6,#e8f7ff);
    border-radius:14px;
    padding:9px 14px;
    margin-bottom:8px;
    text-align:left;
  }
  .factRow.event{ background:#f3f0ff; }
  .factRow .icon{ font-size:20px; }
  .factRow .txt{ font-size:13.5px; font-weight:700; color:#4a4a4a; line-height:1.5; }
  .factRow .txt b{ color:var(--accent); font-size:15px; }

  /* 累計・あしあと */
  #totalBox{
    margin-top:12px;
    padding-top:10px;
    border-top:2px dashed #f0e2b8;
  }
  #totalLine{ font-size:12px; color:#6a6a6a; font-weight:700; }
  #totalLine b{ color:#4a4a4a; }
  #footprints{
    display:flex; align-items:flex-end; justify-content:center; gap:3px;
    height:40px; margin:8px 0 2px;
  }
  .fp{ width:8px; min-height:3px; border-radius:3px 3px 1px 1px; background:#e8dcc0; }
  .fp.now{ background:var(--accent); }
  #footprintsLabel{ font-size:10.5px; color:#9a9a9a; }

  #retryBtn{
    margin-top:12px;
    padding:12px 30px; border:none; border-radius:28px;
    background:linear-gradient(160deg,#ffb3c6,#ff8ba7);
    color:#fff; font-weight:800; font-size:15px; letter-spacing:1px;
    box-shadow:0 6px 0 #e0728f, 0 10px 16px rgba(0,0,0,.15);
    cursor:pointer;
  }
  #retryBtn:active{ transform:translateY(4px); box-shadow:0 2px 0 #e0728f; }
</style>
</head>
<body>

<div id="stage">
  <div id="nightStars"></div>
  <div id="sun"></div>
  <div class="cloud" id="cloud1"></div>
  <div class="cloud" id="cloud2"></div>
  <div class="cloud" id="cloud3"></div>

  <div id="hud">🏃 0m</div>
  <div id="hudTotal"></div>
  <div id="tapHint">タップ（またはスペースキー）でジャンプ！</div>

  <div id="wall"><div id="wallLabel"></div></div>

  <div id="playerShadow"></div>
  <div id="player" class="running">
    <div id="sprout"></div>
    <div class="face">
      <div class="eye l"></div>
      <div class="eye r"></div>
      <div class="mouth"></div>
    </div>
  </div>

  <div id="ground"><div id="groundStripes"></div></div>

  <div id="factText" class="mincho"><span>FACT</span></div>
  <div id="factSub"></div>
</div>

<div id="resultScreen">
  <div id="resultCard">
    <div class="flatReport" id="flatReport"></div>
    <h2>行動の記録</h2>
    <div id="introLine"></div>
    <div id="factRows"></div>
    <div id="totalBox">
      <div id="totalLine"></div>
      <div id="footprints"></div>
      <div id="footprintsLabel"></div>
    </div>
    <button id="retryBtn">もう一度走る</button>
  </div>
</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const player = document.getElementById('player');
  const playerShadow = document.getElementById('playerShadow');
  const sprout = document.getElementById('sprout');
  const wall = document.getElementById('wall');
  const wallLabel = document.getElementById('wallLabel');
  const groundStripes = document.getElementById('groundStripes');
  const factText = document.getElementById('factText');
  const factSub = document.getElementById('factSub');
  const resultScreen = document.getElementById('resultScreen');
  const flatReport = document.getElementById('flatReport');
  const introLine = document.getElementById('introLine');
  const factRows = document.getElementById('factRows');
  const totalLine = document.getElementById('totalLine');
  const footprints = document.getElementById('footprints');
  const footprintsLabel = document.getElementById('footprintsLabel');
  const retryBtn = document.getElementById('retryBtn');
  const tapHint = document.getElementById('tapHint');
  const hud = document.getElementById('hud');
  const hudTotal = document.getElementById('hudTotal');
  const nightStars = document.getElementById('nightStars');

  const SPEED = 230;          // px/秒（ワールドのスクロール速度）
  const GRAVITY = 1900;       // px/秒^2（少し低くして滞空時間を伸ばす）
  const JUMP_VELOCITY = -840; // px/秒（高く跳ぶ）
  const MAX_HEIGHT_REF = 240; // 影の縮小・伸縮演出の基準高さ
  const PLAYER_X = 70;
  const PLAYER_W = 44;
  const PLAYER_H = 44;
  const PX_PER_M = 23;        // 23px = 1m として距離を表示

  /* =========================================================
     壁に書かれる言葉（壁図鑑）
     ========================================================= */
  const WALL_LABELS = ['理想','完璧','あの人の実力','締め切り','みんなの期待','昨日の後悔','正解','いつもの自分','向いてない気がする','もっと早くやれば'];
  const RARE_WALL_LABELS = ['月曜日','おふとん','宇宙の果て','なんかでかい'];
  const RARE_RATE = 0.07;

  /* =========================================================
     累計記録（この端末に保存）
     ========================================================= */
  const STATS_KEY = 'factRun_stats_v1';
  function defaultStats(){
    return { runs:0, dist:0, time:0, jumps:0, stars:0, stumbles:0, walls:{}, history:[] };
  }
  function loadStats(){
    try{
      const raw = localStorage.getItem(STATS_KEY);
      return raw ? Object.assign(defaultStats(), JSON.parse(raw)) : defaultStats();
    }catch(e){ return defaultStats(); }
  }
  function saveStats(s){
    try{ localStorage.setItem(STATS_KEY, JSON.stringify(s)); }catch(e){ /* 保存できない環境では今回分だけ */ }
  }
  let stats = loadStats();

  // 景色：累計距離（m）で変わる
  const SCENES = [
    { id:'morning', name:'朝',   from:0 },
    { id:'day',     name:'昼',   from:300 },
    { id:'evening', name:'夕方', from:900 },
    { id:'night',   name:'夜',   from:1800 },
    { id:'space',   name:'宇宙', from:3500 }
  ];
  function sceneFor(dist){
    let s = SCENES[0];
    SCENES.forEach(sc => { if(dist >= sc.from) s = sc; });
    return s;
  }

  // 頭の芽：挑戦回数で育つ
  const SPROUTS = [
    { from:3,  icon:'🌱', name:'芽が出た' },
    { from:8,  icon:'🌿', name:'葉っぱが増えた' },
    { from:15, icon:'🌷', name:'つぼみがついた' },
    { from:30, icon:'🌻', name:'花が咲いた' }
  ];
  function sproutFor(runs){
    let s = null;
    SPROUTS.forEach(sp => { if(runs >= sp.from) s = sp; });
    return s;
  }

  function applyProgressLook(){
    const sc = sceneFor(stats.dist);
    SCENES.forEach(x => stage.classList.remove('scene-' + x.id));
    stage.classList.add('scene-' + sc.id);
    const sp = sproutFor(stats.runs);
    sprout.textContent = sp ? sp.icon : '';
    hudTotal.textContent = stats.runs > 0 ? `これまで ${Math.round(stats.dist)}m` : '';
  }

  function createNightStars(){
    for(let i=0;i<40;i++){
      const s = document.createElement('div');
      s.className = 'nstar';
      const size = rand(1,2.4);
      s.style.width = size+'px';
      s.style.height = size+'px';
      s.style.left = rand(0,100) + '%';
      s.style.top = rand(0,65) + '%';
      s.style.animationDelay = rand(0,2.4) + 's';
      nightStars.appendChild(s);
    }
  }

  /* =========================================================
     ラン状態
     ========================================================= */
  let cameraX = 0;
  let wallWorldX = 0;
  let wallText = '';
  let wallIsRare = false;
  let playerOffsetY = 0; // 地面からの高さ（正の値＝上）
  let vy = 0;
  let grounded = true;
  let jumpCount = 0;
  let starCount = 0;
  let stumbleCount = 0;
  let elapsed = 0;
  let airStart = 0;
  let maxAir = 0;
  let speedFactor = 1;
  let crashed = false;
  let lastTs = null;
  let rafId = null;
  let trailTimer = 0;
  let objects = [];

  function rand(min,max){ return min + Math.random()*(max-min); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  // 道中の小石と☆を配置する（壁の手前まで）
  function placeObjects(){
    objects.forEach(o => o.el.remove());
    objects = [];
    let x = Math.max(stage.clientWidth, SPEED * 2.5);
    const end = wallWorldX - SPEED * 1.4;
    while(x < end){
      const roll = Math.random();
      if(roll < 0.5){
        addRock(x);
      } else if(roll < 0.75){
        addStar(x, rand(90, 160)); // ジャンプしないと届かない☆
      } else if(roll < 0.9){
        addStar(x, 6);             // 走っていれば拾える☆
      } else {
        addRock(x);                // 小石の上に☆
        addStar(x - 4, rand(100, 150));
      }
      x += rand(SPEED * 1.2, SPEED * 2.4);
    }
  }
  function addRock(x){
    const w = rand(24, 34), h = rand(18, 28);
    const el = document.createElement('div');
    el.className = 'rock';
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.left = x + 'px';
    stage.appendChild(el);
    objects.push({ type:'rock', x, y:0, w, h, el, done:false });
  }
  function addStar(x, y){
    const el = document.createElement('div');
    el.className = 'star';
    el.textContent = '★';
    el.style.bottom = (92 + y) + 'px';
    el.style.left = x + 'px';
    stage.appendChild(el);
    objects.push({ type:'star', x, y, w:28, h:28, el, done:false });
  }

  function initRun(){
    cameraX = 0;
    wallWorldX = SPEED * rand(8, 20); // 毎回ちがう距離で、必ず出現する壁
    wallIsRare = Math.random() < RARE_RATE;
    wallText = wallIsRare ? pick(RARE_WALL_LABELS) : pick(WALL_LABELS);
    wallLabel.textContent = wallText;
    wall.classList.toggle('rare', wallIsRare);
    wall.style.left = (wallWorldX) + 'px';

    playerOffsetY = 0;
    vy = 0;
    grounded = true;
    jumpCount = 0;
    starCount = 0;
    stumbleCount = 0;
    elapsed = 0;
    maxAir = 0;
    speedFactor = 1;
    crashed = false;
    lastTs = null;
    trailTimer = 0;

    stage.classList.remove('crashed');
    player.classList.remove('crashed','airborne','stumble');
    player.classList.add('running');
    player.style.transition = '';
    player.style.transform = '';
    playerShadow.style.transform = 'scale(1,1)';
    playerShadow.style.opacity = '0.35';
    factText.classList.remove('pop');
    factText.style.transform = 'translate(-50%,-50%) scale(0)';
    factSub.classList.remove('show');
    factSub.style.opacity = '0';
    resultScreen.classList.remove('show');
    hud.textContent = '🏃 0m';
    tapHint.style.animation = 'none';
    void tapHint.offsetWidth;
    tapHint.style.animation = '';

    document.querySelectorAll('.confetti, .floatMsg').forEach(c => c.remove());
    applyProgressLook();
    placeObjects();

    if(rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function spawnDust(count){
    const rect = player.getBoundingClientRect();
    const fx = rect.left + rect.width/2;
    const fy = rect.bottom - 4;
    for(let i=0;i<count;i++){
      const d = document.createElement('div');
      d.className = 'dust';
      d.style.left = fx + 'px';
      d.style.top = fy + 'px';
      const angle = rand(Math.PI*0.15, Math.PI*0.85);
      const dist = rand(16, 40);
      d.style.setProperty('--dx', (Math.cos(angle)*dist*-1) + 'px');
      d.style.setProperty('--dy', (-Math.sin(angle)*dist*0.4) + 'px');
      stage.appendChild(d);
      setTimeout(() => d.remove(), 520);
    }
  }

  function spawnTrail(){
    const rect = player.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const t = document.createElement('div');
    t.className = 'jumpTrail';
    t.style.left = (rect.left - stageRect.left - 4) + 'px';
    t.style.top = (rect.top - stageRect.top + rect.height/2 - 5) + 'px';
    stage.appendChild(t);
    setTimeout(() => t.remove(), 420);
  }

  function spawnFloatMsg(text){
    const rect = player.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const m = document.createElement('div');
    m.className = 'floatMsg';
    m.textContent = text;
    m.style.left = (rect.left - stageRect.left) + 'px';
    m.style.top = (rect.top - stageRect.top - 30) + 'px';
    stage.appendChild(m);
    setTimeout(() => m.remove(), 900);
  }

  function doJump(){
    if(crashed) return;
    if(grounded){
      vy = JUMP_VELOCITY;
      grounded = false;
      jumpCount++;
      airStart = elapsed;
      spawnDust(9);
      player.classList.remove('running','stumble');
    }
  }

  // 小石につまずく：ゲームは終わらず、少しだけ遅くなる
  function stumble(rock){
    rock.done = true;
    stumbleCount++;
    speedFactor = 0.35;
    rock.el.classList.add('kicked');
    rock.el.style.transform = `translate(${rand(60,120)}px, -20px) rotate(${rand(120,300)}deg)`;
    player.classList.remove('running','stumble');
    void player.offsetWidth;
    player.classList.add('stumble');
    setTimeout(() => {
      player.classList.remove('stumble');
      if(grounded && !crashed) player.classList.add('running');
    }, 500);
    spawnDust(6);
    spawnFloatMsg(pick(['つまずいた','おっと','ころん']));
  }

  function collectStar(star){
    star.done = true;
    starCount++;
    star.el.classList.add('got');
    setTimeout(() => star.el.remove(), 450);
  }

  function updateObjects(){
    objects.forEach(o => {
      const sx = o.x - cameraX;
      if(!o.el.classList.contains('kicked')) o.el.style.left = sx + 'px';
      if(o.done) return;
      const overlapX = sx < PLAYER_X + PLAYER_W - 6 && sx + o.w > PLAYER_X + 6;
      if(!overlapX) return;
      if(o.type === 'rock'){
        if(playerOffsetY < o.h - 4) stumble(o);
      } else {
        const overlapY = playerOffsetY < o.y + o.h && playerOffsetY + PLAYER_H > o.y;
        if(overlapY) collectStar(o);
      }
    });
  }

  function loop(ts){
    if(lastTs === null) lastTs = ts;
    const dt = Math.min(0.032, (ts - lastTs)/1000);
    lastTs = ts;

    if(!crashed){
      elapsed += dt;
      speedFactor = Math.min(1, speedFactor + dt * 0.8);
      cameraX += SPEED * speedFactor * dt;

      // プレイヤーの上下運動
      vy += GRAVITY * dt;
      playerOffsetY -= vy * dt;
      if(playerOffsetY <= 0){
        playerOffsetY = 0;
        vy = 0;
        if(!grounded){
          grounded = true;
          maxAir = Math.max(maxAir, elapsed - airStart);
          spawnDust(10);
          player.classList.remove('airborne');
          player.style.transform = 'translateY(0) scale(1.28, 0.72)';
          requestAnimationFrame(() => {
            player.style.transition = 'transform .16s cubic-bezier(.3,1.6,.4,1)';
            player.style.transform = 'translateY(0) scale(1,1)';
            setTimeout(() => {
              player.style.transition = '';
              player.style.transform = '';
              if(!crashed) player.classList.add('running');
            }, 170);
          });
        }
      } else {
        player.classList.add('airborne');

        // 伸縮（上昇中は縦に伸び、落下中は少し潰れる）でジャンプの勢いを強調
        const vyNorm = Math.max(-1, Math.min(1, -vy / 900));
        const scaleY = 1 + vyNorm * 0.30;
        const scaleX = 1 - vyNorm * 0.20;
        const tilt = vyNorm * 10; // 上昇中は少し反り、落下中は前のめりに

        player.style.transform =
          `translateY(${-playerOffsetY}px) rotate(${-tilt}deg) scale(${scaleX}, ${scaleY})`;

        // 影：高さが増すほど小さく・薄くなる＝浮いている感を強調
        const heightRatio = Math.min(1, playerOffsetY / MAX_HEIGHT_REF);
        playerShadow.style.transform = `scale(${1 - heightRatio*0.65}, ${1 - heightRatio*0.65})`;
        playerShadow.style.opacity = (0.35 - heightRatio*0.28).toFixed(2);

        // モーション線を一定間隔で放出
        trailTimer += dt;
        if(trailTimer > 0.07){
          trailTimer = 0;
          spawnTrail();
        }
      }

      if(grounded){
        playerShadow.style.transform = 'scale(1,1)';
        playerShadow.style.opacity = '0.35';
      }

      updateObjects();

      // 壁の位置更新
      const wallScreenX = wallWorldX - cameraX;
      wall.style.left = wallScreenX + 'px';

      // 地面の縞模様スクロール
      groundStripes.style.backgroundPositionX = (-cameraX) + 'px';

      hud.textContent = `🏃 ${Math.round(cameraX / PX_PER_M)}m`;

      // 衝突判定（縦位置に関わらず、横に重なったら必ずヒット＝絶対回避不能）
      if(wallScreenX <= PLAYER_X + PLAYER_W){
        triggerCrash();
      }
    }

    rafId = requestAnimationFrame(loop);
  }

  function spawnConfetti(){
    const colors = ['#ff8ba7','#ffd36e','#8fe3a3','#7ec8f0','#c9a8f0'];
    const originX = window.innerWidth/2;
    const originY = window.innerHeight * 0.38;
    for(let i=0;i<28;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.left = originX + 'px';
      c.style.top = originY + 'px';
      const angle = rand(0, Math.PI*2);
      const dist = rand(80, 260);
      c.style.setProperty('--cx', Math.cos(angle)*dist + 'px');
      c.style.setProperty('--cy', (Math.sin(angle)*dist - rand(20,80)) + 'px');
      c.style.setProperty('--cr', rand(-360,360) + 'deg');
      stage.appendChild(c);
      setTimeout(() => c.remove(), 1450);
    }
  }

  function triggerCrash(){
    if(crashed) return;
    crashed = true;

    player.classList.remove('running','stumble');
    player.classList.add('crashed');
    stage.classList.add('crashed');

    stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
    hud.textContent = '💥 到達';

    spawnConfetti();

    // 結果は徹底してフラットに（グレースケール）
    factSub.textContent = `「${wallText}」の壁にぶつかった（事実）`;
    factText.classList.add('pop');
    factSub.classList.add('show');

    const run = recordRun();

    setTimeout(() => {
      renderResult(run);
      resultScreen.classList.add('show');
      sendResultToPortal(run);
    }, 1300);
  }

  /* =========================================================
     記録の保存
     ========================================================= */
  function recordRun(){
    const run = {
      time: elapsed,
      dist: cameraX / PX_PER_M,
      jumps: jumpCount,
      stars: starCount,
      stumbles: stumbleCount,
      rocks: objects.filter(o => o.type === 'rock').length,
      maxAir: maxAir,
      wall: wallText,
      rare: wallIsRare
    };
    const before = {
      scene: sceneFor(stats.dist),
      sprout: sproutFor(stats.runs),
      newWall: !stats.walls[wallText]
    };

    stats.runs += 1;
    stats.dist += run.dist;
    stats.time += run.time;
    stats.jumps += run.jumps;
    stats.stars += run.stars;
    stats.stumbles += run.stumbles;
    stats.walls[wallText] = true;
    stats.history.push(Math.round(run.dist));
    if(stats.history.length > 20) stats.history = stats.history.slice(-20);
    saveStats(stats);

    const afterScene = sceneFor(stats.dist);
    const afterSprout = sproutFor(stats.runs);
    run.events = [];
    if(afterScene.id !== before.scene.id){
      run.events.push({ icon:'🌄', text:`景色が「${afterScene.name}」に変わった` });
    }
    if(afterSprout && afterSprout !== before.sprout){
      run.events.push({ icon:afterSprout.icon, text:`頭に${afterSprout.name}` });
    }
    if(before.newWall){
      const seen = Object.keys(stats.walls).length;
      const total = WALL_LABELS.length + RARE_WALL_LABELS.length;
      run.events.push({ icon: wallIsRare ? '🌈' : '🧱', text:`はじめて見る壁だった（壁図鑑 ${seen} / ${total}）` });
    }
    return run;
  }

  /* =========================================================
     結果画面：その回のデータから「見てたよ」の言葉を組み立てる
     （評価語は使わず、具体的な行動の事実だけを言う）
     ========================================================= */
  function buildLines(run){
    const t = run.time.toFixed(1);
    const d = Math.round(run.dist);
    const n = (v) => `<b>${v}</b>`;

    const main = pick([
      { icon:'⏱️', text:`${n(t)} 秒、走り続けてたね` },
      { icon:'👣', text:`${n(d)} m、前に進んでた` },
      { icon:'⏱️', text:`${n(t)} 秒間、足を止めなかった` },
      { icon:'👣', text:`壁のところまで ${n(d)} m 走ってきたね` }
    ]);

    const extras = [];
    if(run.stumbles > 0){
      extras.push(pick([
        { icon:'🪨', text:`${n(run.stumbles)} 回つまずいて、${n(run.stumbles)} 回とも走り続けてた` },
        { icon:'🪨', text:`小石に ${n(run.stumbles)} 回つまずいても、そのまま前を向いてた` }
      ]));
    } else if(run.rocks > 0){
      extras.push(pick([
        { icon:'🪨', text:`小石を全部よけて走ってた` },
        { icon:'🪨', text:`一度もつまずかずに走ってた` }
      ]));
    }
    if(run.stars > 0){
      extras.push(pick([
        { icon:'⭐', text:`道ばたの☆に ${n(run.stars)} 回気づいてた` },
        { icon:'⭐', text:`☆を ${n(run.stars)} 個拾ってた` }
      ]));
    }
    if(run.jumps > 0){
      extras.push(pick([
        { icon:'🦘', text:`${n(run.jumps)} 回、跳んでみてたね` },
        { icon:'🦘', text:`ジャンプを ${n(run.jumps)} 回ためしてた` }
      ]));
    } else {
      extras.push({ icon:'🦘', text:`一度も跳ばずに、まっすぐ走ってたね` });
    }
    if(run.maxAir >= 0.8){
      extras.push({ icon:'☁️', text:`いちばん長く浮いてたのは ${n(run.maxAir.toFixed(1))} 秒` });
    }

    // 毎回ちがう組み合わせになるよう、行動の行は2つだけランダムに選ぶ
    return [main].concat(shuffle(extras).slice(0, 2));
  }

  function renderResult(run){
    flatReport.textContent = `「${run.wall}」の壁にぶつかった（事実）`;

    // 意図が伝わるよう、最初の1回だけ一言そえる。2回目以降は事実だけ
    if(stats.runs === 1){
      introLine.textContent = '壁は越えられない。でも、走った分は消えない。';
      introLine.style.display = 'block';
    } else {
      introLine.textContent = '';
      introLine.style.display = 'none';
    }

    factRows.innerHTML = '';
    buildLines(run).forEach(line => factRows.appendChild(makeRow(line, false)));
    run.events.slice(0, 2).forEach(ev => factRows.appendChild(makeRow(ev, true)));

    totalLine.innerHTML = `これまで <b>${stats.runs}</b> 回走って、合計 <b>${Math.round(stats.dist)}</b> m`;

    footprints.innerHTML = '';
    const hist = stats.history;
    const maxD = Math.max(1, ...hist);
    hist.forEach((d, i) => {
      const bar = document.createElement('div');
      bar.className = 'fp' + (i === hist.length - 1 ? ' now' : '');
      bar.style.height = Math.max(3, d / maxD * 40) + 'px';
      bar.title = d + 'm';
      footprints.appendChild(bar);
    });
    footprintsLabel.textContent = `あしあと（最近 ${hist.length} 回）`;
  }

  function makeRow(line, isEvent){
    const row = document.createElement('div');
    row.className = 'factRow' + (isEvent ? ' event' : '');
    const icon = document.createElement('div');
    icon.className = 'icon';
    icon.textContent = line.icon;
    const txt = document.createElement('div');
    txt.className = 'txt';
    txt.innerHTML = line.text; // 数値以外はすべて固定文なので安全
    row.appendChild(icon);
    row.appendChild(txt);
    return row;
  }

  // ポータルサイトに埋め込まれている場合、結果を親ウィンドウへ送信する
  function sendResultToPortal(run){
    try{
      window.parent.postMessage({
        type: 'moyamoyaGameResult',
        gameId: 'fact-run',
        summary: `${run.time.toFixed(1)}秒・${Math.round(run.dist)}m走った（累計${Math.round(stats.dist)}m／${stats.runs}回目）`,
        detail: {
          time: Number(run.time.toFixed(1)),
          dist: Math.round(run.dist),
          jumps: run.jumps,
          stars: run.stars,
          stumbles: run.stumbles,
          wall: run.wall,
          totalDist: Math.round(stats.dist),
          runs: stats.runs
        }
      }, '*');
    }catch(e){ /* ポータル外で単体表示している場合は何もしない */ }
  }

  function onTap(e){
    if(e.target.closest('#resultScreen')) return;
    doJump();
  }

  stage.addEventListener('pointerdown', onTap);
  window.addEventListener('keydown', (e) => {
    if(e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      if(resultScreen.classList.contains('show')) return;
      doJump();
    }
  });
  retryBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    initRun();
  });

  createNightStars();
  initRun();
})();
</script>
</body>
</html>
