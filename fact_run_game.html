<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FACT ラン</title>
<style>
  :root{
    --sky1:#8ed1f0;
    --sky2:#cdeeff;
    --sun:#ffe066;
    --ground1:#7ec850;
    --ground2:#5fae3b;
    --dirt1:#c99a5b;
    --dirt2:#b6813f;
    --player:#ff9b54;
    --player-dark:#e07a30;
    --wall1:#ffb3c6;
    --wall2:#b3e5ff;
    --wall3:#ffe08a;
    --wall4:#c6f0c2;
    --ink:#3a3a3a;
    --accent:#ff6b6b;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    font-family:"Hiragino Sans","Yu Gothic","Zen Maru Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    color:var(--ink);
  }

  #stage{
    position:relative;
    width:100%; height:100%;
    background:linear-gradient(180deg, var(--sky1), var(--sky2) 70%);
    overflow:hidden;
    transition:background 1.2s ease;
  }
  #stage.shake{ animation:shake .35s ease; }
  @keyframes shake{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-8px,3px); }
    40%{ transform:translate(8px,-3px); }
    60%{ transform:translate(-6px,3px); }
    80%{ transform:translate(6px,-2px); }
  }

  /* ===== 景色（累計距離で変化） ===== */
  #stage.scene-morning{ --sky1:#ffd6c2; --sky2:#fff3d9; --sun:#ffd07a; }
  #stage.scene-day{ --sky1:#8ed1f0; --sky2:#cdeeff; --sun:#ffe066; }
  #stage.scene-evening{ --sky1:#ff9a76; --sky2:#ffd59e; --sun:#ff7b54; --ground1:#8fb850; --ground2:#6f9a3b; }
  #stage.scene-night{ --sky1:#1d2557; --sky2:#3d4a8a; --sun:#fff8d6; --ground1:#4a7a3a; --ground2:#3a6230; --dirt1:#7a5f3d; --dirt2:#6a5030; }
  #stage.scene-space{ --sky1:#05051a; --sky2:#1a1040; --sun:#fff8d6; --ground1:#b8b8c8; --ground2:#9a9ab0; --dirt1:#8a8aa0; --dirt2:#7a7a90; }
  #stage.scene-night #sun, #stage.scene-space #sun{
    box-shadow:0 0 0 8px rgba(255,248,214,.15), 0 0 30px rgba(255,248,214,.4);
    background:radial-gradient(circle at 65% 35%, transparent 38%, var(--sun) 40%);
  }
  #stage.scene-night .cloud{ opacity:.25; }
  #stage.scene-space .cloud{ display:none; }

  #nightStars{ position:absolute; inset:0; z-index:0; opacity:0; transition:opacity 1.2s ease; pointer-events:none; }
  #stage.scene-night #nightStars, #stage.scene-space #nightStars{ opacity:1; }
  .nstar{ position:absolute; background:#fff; border-radius:50%; animation:twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.3;} 50%{opacity:1;} }

  /* 太陽 */
  #sun{
    position:absolute; top:8%; right:12%;
    width:70px; height:70px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6c9, var(--sun));
    box-shadow:0 0 0 10px rgba(255,224,102,.35), 0 0 40px rgba(255,224,102,.5);
    z-index:1;
  }

  /* 雲（CSSアニメでゆったり流れる） */
  .cloud{
    position:absolute;
    background:#fff;
    border-radius:50px;
    opacity:.9;
    z-index:1;
  }
  .cloud::before, .cloud::after{
    content:"";
    position:absolute;
    background:#fff;
    border-radius:50%;
  }
  #cloud1{ width:90px; height:32px; top:14%; left:-120px; animation:cloudMove 16s linear infinite; }
  #cloud1::before{ width:46px; height:46px; top:-22px; left:10px; }
  #cloud1::after{ width:34px; height:34px; top:-14px; left:44px; }
  #cloud2{ width:70px; height:26px; top:26%; left:-160px; animation:cloudMove 22s linear infinite; animation-delay:-6s; }
  #cloud2::before{ width:36px; height:36px; top:-18px; left:8px; }
  #cloud2::after{ width:26px; height:26px; top:-10px; left:36px; }
  #cloud3{ width:60px; height:22px; top:8%; left:-100px; animation:cloudMove 19s linear infinite; animation-delay:-12s; }
  #cloud3::before{ width:30px; height:30px; top:-14px; left:6px; }
  #cloud3::after{ width:22px; height:22px; top:-8px; left:30px; }
  @keyframes cloudMove{
    from{ transform:translateX(0); }
    to{ transform:translateX(calc(100vw + 260px)); }
  }
  #stage.crashed .cloud{ animation-play-state:paused; }

  /* 地面 */
  #ground{
    position:absolute; left:0; right:0; bottom:0;
    height:92px;
    background:
      linear-gradient(180deg, var(--ground1) 0 14px, var(--dirt1) 14px 100%);
    z-index:2;
    border-top:4px solid var(--ground2);
  }
  #groundStripes{
    position:absolute; inset:14px 0 0 0;
    background-image:repeating-linear-gradient(90deg, var(--dirt2) 0 26px, transparent 26px 52px);
    background-size:52px 100%;
  }

  /* プレイヤー */
  #player{
    position:absolute;
    left:70px;
    bottom:92px;
    width:44px; height:44px;
    background:linear-gradient(160deg, #ffcf94, var(--player));
    border:3px solid var(--player-dark);
    border-radius:12px;
    z-index:5;
    will-change:transform;
  }
  #player .face{
    position:absolute; inset:0;
  }
  #player .eye{
    position:absolute; top:13px; width:6px; height:7px; background:var(--ink); border-radius:50%;
  }
  #player .eye.l{ left:10px; }
  #player .eye.r{ left:24px; }
  #player .mouth{
    position:absolute; left:12px; top:24px; width:16px; height:8px;
    border-bottom:3px solid var(--ink); border-radius:0 0 10px 10px;
  }
  /* 頭の芽（挑戦回数で育つ） */
  #sprout{
    position:absolute; left:50%; top:-24px;
    transform:translateX(-50%);
    font-size:20px; line-height:1;
    pointer-events:none;
  }
  #player.running{ animation:runBob .3s ease-in-out infinite; }
  @keyframes runBob{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-3px) rotate(-2deg); }
  }
  #player.stumble{ animation:stumble .5s ease; }
  @keyframes stumble{
    0%{ transform:rotate(0deg); }
    30%{ transform:rotate(28deg) translateY(-4px); }
    70%{ transform:rotate(-8deg); }
    100%{ transform:rotate(0deg); }
  }
  #player.crashed{
    animation:none;
    transform:rotate(90deg) translateY(4px);
    transition:transform .3s ease;
  }

  /* プレイヤーの影（高さに応じて縮小・薄くなる＝浮遊感） */
  #playerShadow{
    position:absolute;
    left:70px;
    bottom:90px;
    width:40px; height:12px;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.35), transparent 75%);
    border-radius:50%;
    z-index:4;
    transform-origin:center;
    pointer-events:none;
  }

  /* 砂ぼこり（ジャンプ・着地の反動演出） */
  .dust{
    position:absolute;
    width:8px; height:8px;
    border-radius:50%;
    background:rgba(255,255,255,.85);
    z-index:6;
    pointer-events:none;
    animation:dustPuff .5s ease-out forwards;
  }
  @keyframes dustPuff{
    0%{ opacity:.9; transform:translate(0,0) scale(1); }
    100%{ opacity:0; transform:translate(var(--dx), var(--dy)) scale(1.8); }
  }

  /* 空中のモーション線（飛んでる感を強調） */
  .jumpTrail{
    position:absolute;
    width:26px; height:10px;
    border-radius:6px;
    background:rgba(255,255,255,.55);
    z-index:4;
    pointer-events:none;
    animation:trailFade .4s ease-out forwards;
  }
  @keyframes trailFade{
    0%{ opacity:.7; transform:scaleX(1); }
    100%{ opacity:0; transform:scaleX(.3) translateX(-14px); }
  }

  /* ジャンプ中の表情（目を見開く） */
  #player.airborne .eye{ height:9px; top:11px; }
  #player.airborne .mouth{ width:12px; height:10px; border-radius:50%; border:3px solid var(--ink); border-bottom:none; top:23px; }

  /* ===== 道中のもの（小石・☆） ===== */
  .rock{
    position:absolute;
    bottom:92px;
    z-index:4;
    background:linear-gradient(160deg,#b9b1a6,#8c8378);
    border:2px solid #6f675d;
    border-radius:50% 50% 30% 30% / 70% 70% 30% 30%;
    pointer-events:none;
  }
  .rock.kicked{ transition:transform .6s ease-out, opacity .6s ease-out; opacity:0; }
  .star{
    position:absolute;
    z-index:4;
    width:28px; height:28px;
    font-size:26px; line-height:28px; text-align:center;
    color:#ffd23f;
    text-shadow:0 0 8px rgba(255,210,63,.8), 0 2px 0 #e0a800;
    animation:starFloat 1.2s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes starFloat{ 0%,100%{ margin-bottom:0; } 50%{ margin-bottom:5px; } }
  .star.got{ animation:starGot .45s ease-out forwards; }
  @keyframes starGot{ to{ transform:translateY(-40px) scale(1.6); opacity:0; } }

  .floatMsg{
    position:absolute;
    z-index:12;
    font-size:13px; font-weight:800;
    color:#4a4a4a;
    background:#ffffffd0;
    padding:3px 10px; border-radius:12px;
    pointer-events:none;
    white-space:nowrap;
    animation:floatUp .9s ease-out forwards;
  }
  @keyframes floatUp{ 0%{ opacity:0; transform:translateY(0); } 20%{ opacity:1; } 100%{ opacity:0; transform:translateY(-34px); } }

  #wall{
    position:absolute;
    bottom:92px;
    width:76px;
    height:100vh;
    z-index:4;
    background:repeating-linear-gradient(
      180deg,
      var(--wall1) 0 34px,
      var(--wall2) 34px 68px,
      var(--wall3) 68px 102px,
      var(--wall4) 102px 136px
    );
    border-left:4px solid #fff8;
    border-right:4px solid #0002;
    border-radius:6px;
    box-shadow:0 0 0 3px #ffffffaa inset;
  }
  #wall.rare{
    background:linear-gradient(180deg,#ffe9a8,#ffd0f0,#c8e7ff,#d6ffd0,#ffe9a8);
    background-size:100% 300px;
    animation:rareShine 2s linear infinite;
    box-shadow:0 0 0 3px #ffffffcc inset, 0 0 24px rgba(255,220,120,.9);
  }
  @keyframes rareShine{ to{ background-position:0 300px; } }
  #wallLabel{
    position:absolute;
    left:50%; bottom:16px;
    transform:translateX(-50%);
    writing-mode:vertical-rl;
    font-size:17px; font-weight:900; letter-spacing:3px;
    color:#ffffff;
    text-shadow:0 1px 0 rgba(0,0,0,.25), 0 0 6px rgba(0,0,0,.2);
    white-space:nowrap;
  }

  /* FACTテキスト */
  #factText{
    position:absolute;
    left:50%; top:38%;
    transform:translate(-50%,-50%) scale(0);
    z-index:20;
    font-size:0;
    font-weight:900;
    letter-spacing:6px;
    pointer-events:none;
  }
  #factText span{
    display:inline-block;
    font-size:min(20vw, 110px);
    background:linear-gradient(135deg,#ff8ba7,#ffd36e,#8fe3a3,#7ec8f0);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 6px 0 rgba(0,0,0,.08);
  }
  #factText.pop{
    animation:factPop .6s cubic-bezier(.3,1.7,.4,1) forwards;
  }
  @keyframes factPop{
    0%{ transform:translate(-50%,-50%) scale(0) rotate(-8deg); }
    60%{ transform:translate(-50%,-50%) scale(1.15) rotate(3deg); }
    100%{ transform:translate(-50%,-50%) scale(1) rotate(0deg); }
  }
  #factSub{
    position:absolute;
    left:50%; top:54%;
    transform:translate(-50%,0);
    z-index:20;
    font-size:14px;
    font-weight:700;
    color:#5a5a5a;
    background:#ffffffcc;
    padding:6px 16px;
    border-radius:20px;
    opacity:0;
    white-space:nowrap;
  }
  #factSub.show{ animation:factSubIn .4s ease forwards .4s; }
  @keyframes factSubIn{ from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);} }

  /* 紙吹雪 */
  .confetti{
    position:absolute;
    width:9px; height:14px;
    z-index:15;
    border-radius:2px;
    animation:confettiFall 1.4s ease-out forwards;
  }
  @keyframes confettiFall{
    0%{ opacity:1; transform:translate(0,0) rotate(0deg); }
    100%{ opacity:0; transform:translate(var(--cx), var(--cy)) rotate(var(--cr)); }
  }

  /* HUD */
  #hud{
    position:absolute; top:14px; left:14px; z-index:10;
    background:#ffffffaa; padding:8px 14px; border-radius:16px;
    font-size:13px; font-weight:700; color:#4a4a4a;
  }
  #hudTotal{
    position:absolute; top:14px; right:14px; z-index:10;
    background:#ffffff88; padding:6px 12px; border-radius:14px;
    font-size:11px; font-weight:700; color:#5a5a5a;
  }
  #hudTotal:empty{ display:none; }

  /* タップ案内 */
  #tapHint{
    position:absolute; bottom:110px; left:50%; transform:translateX(-50%);
    z-index:10; font-size:12px; font-weight:700; color:#4a4a4a;
    background:#ffffffb0; padding:6px 14px; border-radius:14px;
    animation:hintFade 2.2s ease forwards;
    pointer-events:none;
    white-space:nowrap;
  }
  @keyframes hintFade{ 0%{opacity:1;} 80%{opacity:1;} 100%{opacity:0;} }

  /* ===== HUD（アーケード版） ===== */
  #hudBar{
    position:absolute; top:10px; left:12px; right:12px; z-index:10;
    display:flex; justify-content:space-between; align-items:center;
    font-weight:800; color:#3a3a3a; pointer-events:none;
  }
  #stage.scene-night #hudBar, #stage.scene-space #hudBar{ color:#f2f2ff; }
  #scoreBox{ font-size:20px; font-variant-numeric:tabular-nums; background:#ffffff99; padding:4px 12px; border-radius:14px; }
  #scoreBox small{ display:block; font-size:9.5px; opacity:.7; }
  #stageBox{ font-size:13px; background:#ffffff99; padding:4px 12px; border-radius:14px; text-align:center; }
  #stageBox small{ display:block; font-size:9.5px; opacity:.7; }
  #stage.scene-night #scoreBox, #stage.scene-night #stageBox,
  #stage.scene-space #scoreBox, #stage.scene-space #stageBox{ background:#00000055; }
  #lives{ font-size:18px; letter-spacing:2px; background:#ffffff99; padding:3px 10px; border-radius:14px; }
  #lives .lost{ opacity:.2; filter:grayscale(1); }
  #progress{
    position:absolute; top:56px; left:12px; right:12px; height:5px; z-index:10;
    background:#00000018; border-radius:3px; overflow:hidden;
  }
  #progressIn{ height:100%; width:0; background:linear-gradient(90deg,#ffb3c6,#ffd36e); }

  /* 浮いているモヤ雲（当たるとハートが減る） */
  .moya{
    position:absolute; z-index:4;
    width:46px; height:30px;
    border-radius:50%;
    background:radial-gradient(circle at 40% 40%, #a99bc8, #6f5f96);
    box-shadow:14px -6px 0 -4px #8a7ab0, -12px -4px 0 -6px #8a7ab0;
    pointer-events:none;
    opacity:.92;
  }
  .rock.tall{ background:linear-gradient(160deg,#a8a096,#7a7268); }
  #player.hurt{ animation:blink .12s linear 8; }
  @keyframes blink{ 50%{ opacity:.25; } }

  .pts{
    position:absolute; z-index:12; pointer-events:none;
    font-size:14px; font-weight:900; color:#ff8c2e;
    text-shadow:0 1px 0 #fff, 0 0 6px #fff;
    animation:ptsUp .8s ease forwards; white-space:nowrap;
  }
  @keyframes ptsUp{ 0%{ opacity:0; transform:translateY(0); } 20%{ opacity:1; } 100%{ opacity:0; transform:translateY(-40px); } }

  #clearBanner{
    position:absolute; left:50%; top:66%; transform:translate(-50%,0);
    z-index:21; font-size:15px; font-weight:900; color:#5a5a5a;
    background:#ffffffd8; padding:6px 16px; border-radius:16px;
    opacity:0; white-space:nowrap; pointer-events:none;
  }
  #clearBanner.show{ animation:factSubIn .4s ease forwards .5s; }

  /* ===== はじまり・結果 ===== */
  .overlay{
    position:fixed; inset:0; z-index:50;
    background:rgba(255,255,255,.7); backdrop-filter:blur(2px);
    display:none; flex-direction:column; align-items:center;
    padding:16px; overflow-y:auto; text-align:center;
  }
  .overlay.show{ display:flex; }
  .card{
    margin:auto 0; width:100%; max-width:340px;
    background:#fffdf6; border:3px solid #ffe08a; border-radius:24px;
    padding:20px 18px;
    box-shadow:0 20px 40px rgba(0,0,0,.15);
  }
  .title{ font-size:22px; font-weight:900; color:#4a4a4a; letter-spacing:2px; }
  .howto{ text-align:left; font-size:12.5px; line-height:1.85; background:#fff3d6; border-radius:12px; padding:10px 12px; margin:12px 0; color:#4a4a4a; }
  .best{ font-size:12px; color:#8a8a8a; margin-bottom:12px; }
  .mainBtn{
    padding:12px 32px; border:none; border-radius:28px;
    background:linear-gradient(160deg,#ffb3c6,#ff8ba7);
    color:#fff; font-weight:900; font-size:16px; font-family:inherit;
    box-shadow:0 6px 0 #e0728f; cursor:pointer;
  }
  .mainBtn:active{ transform:translateY(4px); box-shadow:0 2px 0 #e0728f; }
  #finalScore{ font-size:44px; font-weight:900; color:#ff6b6b; line-height:1.15; font-variant-numeric:tabular-nums; }
  #newBest{ display:inline-block; margin:4px 0; font-size:12px; font-weight:900; letter-spacing:2px; color:#fff; background:#ff8ba7; padding:3px 12px; border-radius:12px; }
  #bestLine{ font-size:12px; color:#8a8a8a; margin-bottom:10px; }
  .stats{ display:flex; gap:6px; justify-content:center; margin-bottom:10px; }
  .stat{ background:linear-gradient(135deg,#fff3d6,#e8f7ff); border-radius:12px; padding:7px 8px; min-width:76px; }
  .stat .n{ font-size:18px; font-weight:900; color:#4a4a4a; }
  .stat .l{ font-size:10px; color:#8a8a8a; }
  #comment{ font-size:13px; color:#4a4a4a; background:#f6f6f6; border-radius:12px; padding:7px 10px; margin-bottom:14px; }
</style>
</head>
<body>

<div id="stage">
  <div id="nightStars"></div>
  <div id="sun"></div>
  <div class="cloud" id="cloud1"></div>
  <div class="cloud" id="cloud2"></div>
  <div class="cloud" id="cloud3"></div>

  <div id="hudBar">
    <div id="scoreBox"><small>SCORE</small><span id="scoreVal">0</span></div>
    <div id="stageBox"><small>STAGE</small><span id="stageVal">1</span></div>
    <div id="lives"></div>
  </div>
  <div id="progress"><div id="progressIn"></div></div>

  <div id="wall"><div id="wallLabel"></div></div>

  <div id="playerShadow"></div>
  <div id="player" class="running">
    <div class="face">
      <div class="eye l"></div>
      <div class="eye r"></div>
      <div class="mouth"></div>
    </div>
  </div>

  <div id="ground"><div id="groundStripes"></div></div>

  <div id="factText"><span>FACT</span></div>
  <div id="factSub"></div>
  <div id="clearBanner"></div>
</div>

<div id="startScreen" class="overlay show">
  <div class="card">
    <div class="title">🏃 FACT ラン</div>
    <div class="howto">
      タップ（スペースキー）でジャンプ。空中でもう1回跳べる。<br>
      🪨 小石と ☁️ モヤ雲に当たると ❤ が減る。☆ を集めよう。<br>
      ステージの最後には、ぜったい越えられない壁がある。<br>
      ぶつかったらステージクリア。次はもっと速くなる。
    </div>
    <div class="best" id="startBest"></div>
    <button class="mainBtn" id="startBtn">走りだす</button>
  </div>
</div>

<div id="resultScreen" class="overlay">
  <div class="card">
    <div class="title">おつかれさま</div>
    <div id="finalScore">0</div>
    <div id="newBest">NEW BEST!</div>
    <div id="bestLine"></div>
    <div class="stats">
      <div class="stat"><div class="n" id="stStage">0</div><div class="l">クリアした壁</div></div>
      <div class="stat"><div class="n" id="stDist">0</div><div class="l">走った距離</div></div>
      <div class="stat"><div class="n" id="stStars">0</div><div class="l">☆</div></div>
    </div>
    <div id="comment"></div>
    <button class="mainBtn" id="retryBtn">もう一度走る</button>
  </div>
</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const player = document.getElementById('player');
  const playerShadow = document.getElementById('playerShadow');
  const wall = document.getElementById('wall');
  const wallLabel = document.getElementById('wallLabel');
  const groundStripes = document.getElementById('groundStripes');
  const factText = document.getElementById('factText');
  const factSub = document.getElementById('factSub');
  const clearBanner = document.getElementById('clearBanner');
  const nightStars = document.getElementById('nightStars');

  const BASE_SPEED = 240;      // px/秒
  const GRAVITY = 1900;
  const JUMP_VELOCITY = -800;
  const DOUBLE_JUMP_VELOCITY = -680;
  const MAX_HEIGHT_REF = 240;
  const PLAYER_X = 70;
  const PLAYER_W = 44;
  const PLAYER_H = 44;
  const PX_PER_M = 23;
  const MAX_LIVES = 3;
  const STAGE_SECONDS = 16;    // 1ステージの長さ（その速さで走ったときの秒数）

  const WALL_LABELS = ['理想','完璧','あの人の実力','締め切り','みんなの期待','昨日の後悔','正解','いつもの自分','向いてない気がする','もっと早くやれば'];
  const SCENES = ['morning','day','evening','night','space'];
  const COMMENTS = {
    great: ['壁を何枚もくぐってきたね','その足、止まらないね','もうランナーの顔だ'],
    good:  ['いい走りだった','2段ジャンプが板についてきた','☆がよく見えてたね'],
    normal:['次はもっと遠くまで','まずはウォーミングアップ','走りだしたら、こっちのもの']
  };

  const SAVE_KEY = 'factRunArcade_v1';
  function loadSave(){
    try{ return Object.assign({ best:0, bestStage:0 }, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); }
    catch(e){ return { best:0, bestStage:0 }; }
  }
  function writeSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
  let save = loadSave();

  function rand(a,b){ return a + Math.random()*(b-a); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  (function createNightStars(){
    for(let i=0;i<40;i++){
      const s = document.createElement('div');
      s.className = 'nstar';
      const z = rand(1,2.4);
      s.style.width = z+'px'; s.style.height = z+'px';
      s.style.left = rand(0,100) + '%'; s.style.top = rand(0,65) + '%';
      s.style.animationDelay = rand(0,2.4) + 's';
      nightStars.appendChild(s);
    }
  })();

  /* ===== 状態 ===== */
  let running = false, betweenStages = false;
  let stageNo = 1, speed = BASE_SPEED;
  let cameraX = 0, stageStartX = 0, wallWorldX = 0;
  let playerOffsetY = 0, vy = 0, grounded = true, jumpsLeft = 2;
  let lives = MAX_LIVES, invuln = 0, speedFactor = 1;
  let score = 0, stars = 0, totalDist = 0, cleared = 0;
  let objects = [];
  let lastTs = null, rafId = null, trailTimer = 0;

  function renderHud(){
    document.getElementById('scoreVal').textContent = Math.floor(score).toLocaleString();
    document.getElementById('stageVal').textContent = stageNo;
    const lv = document.getElementById('lives');
    lv.innerHTML = '';
    for(let i=0;i<MAX_LIVES;i++){
      const s = document.createElement('span');
      s.textContent = '❤'; s.style.color = '#ff5a7a';
      if(i >= lives) s.className = 'lost';
      lv.appendChild(s);
    }
    const len = wallWorldX - stageStartX;
    document.getElementById('progressIn').style.width = Math.min(100, (cameraX - stageStartX) / len * 100) + '%';
  }

  /* ===== ステージ ===== */
  function setupStage(){
    speed = BASE_SPEED * (1 + (stageNo - 1) * 0.12);
    stageStartX = cameraX;
    wallWorldX = cameraX + speed * STAGE_SECONDS;
    wallLabel.textContent = pick(WALL_LABELS);
    wall.style.left = (wallWorldX - cameraX) + 'px';
    SCENES.forEach(s => stage.classList.remove('scene-' + s));
    stage.classList.add('scene-' + SCENES[(stageNo - 1) % SCENES.length]);
    placeObjects();
    factText.classList.remove('pop');
    factText.style.transform = 'translate(-50%,-50%) scale(0)';
    factSub.classList.remove('show'); factSub.style.opacity = '0';
    clearBanner.classList.remove('show'); clearBanner.style.opacity = '0';
    stage.classList.remove('crashed');
    player.classList.remove('crashed');
    player.classList.add('running');
    player.style.transform = '';
    betweenStages = false;
    renderHud();
  }

  // 障害物と☆を配置（ステージが進むほど密に）
  function placeObjects(){
    objects.forEach(o => o.el.remove());
    objects = [];
    const w = stage.clientWidth;
    let x = cameraX + Math.max(w, speed * 2.2);
    const end = wallWorldX - speed * 1.5;
    const gapMin = Math.max(0.75, 1.3 - (stageNo - 1) * 0.08), gapMax = Math.max(1.3, 2.3 - (stageNo - 1) * 0.12);
    while(x < end){
      const r = Math.random();
      if(r < 0.38) addRock(x, false);
      else if(r < 0.52 && stageNo >= 2) addRock(x, true);
      else if(r < 0.68 && stageNo >= 2) addMoya(x, rand(70, 120));
      else if(r < 0.86) addStar(x, rand(90, 180));
      else { addRock(x, false); addStar(x, rand(110, 160)); }
      x += rand(speed * gapMin, speed * gapMax);
    }
  }
  function addRock(x, tall){
    const w = tall ? rand(26, 32) : rand(24, 34), h = tall ? rand(48, 60) : rand(18, 28);
    const el = document.createElement('div');
    el.className = 'rock' + (tall ? ' tall' : '');
    el.style.width = w + 'px'; el.style.height = h + 'px';
    el.style.left = (x - cameraX) + 'px';
    stage.appendChild(el);
    objects.push({ type:'rock', x, y:0, w, h, el, done:false });
  }
  function addMoya(x, y){
    const el = document.createElement('div');
    el.className = 'moya';
    el.style.bottom = (92 + y) + 'px';
    el.style.left = (x - cameraX) + 'px';
    stage.appendChild(el);
    objects.push({ type:'moya', x, y, w:46, h:30, el, done:false });
  }
  function addStar(x, y){
    const el = document.createElement('div');
    el.className = 'star';
    el.textContent = '★';
    el.style.bottom = (92 + y) + 'px';
    el.style.left = (x - cameraX) + 'px';
    stage.appendChild(el);
    objects.push({ type:'star', x, y, w:28, h:28, el, done:false });
  }

  /* ===== 操作 ===== */
  function jump(){
    if(!running || betweenStages) return;
    if(jumpsLeft <= 0) return;
    vy = grounded ? JUMP_VELOCITY : DOUBLE_JUMP_VELOCITY;
    grounded = false;
    jumpsLeft--;
    spawnDust(jumpsLeft === 1 ? 9 : 5);
    player.classList.remove('running','stumble');
  }

  function hit(o){
    o.done = true;
    if(invuln > 0) return;
    lives--;
    invuln = 1.2;
    speedFactor = 0.5;
    player.classList.remove('hurt'); void player.offsetWidth; player.classList.add('hurt');
    stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
    if(o.type === 'rock'){
      o.el.classList.add('kicked');
      o.el.style.transform = `translate(${rand(60,120)}px, -20px) rotate(${rand(120,300)}deg)`;
    } else {
      o.el.style.transition = 'opacity .3s'; o.el.style.opacity = '0';
    }
    if(navigator.vibrate) navigator.vibrate([30,40,30]);
    renderHud();
    if(lives <= 0) setTimeout(gameOver, 400);
  }

  function collectStar(o){
    o.done = true;
    stars++;
    score += 50;
    o.el.classList.add('got');
    setTimeout(() => o.el.remove(), 450);
    showPts(o.x - cameraX, 92 + o.y, '+50');
  }

  function showPts(x, bottom, text){
    const p = document.createElement('div');
    p.className = 'pts';
    p.textContent = text;
    p.style.left = x + 'px';
    p.style.bottom = (bottom + 30) + 'px';
    stage.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }

  function spawnDust(count){
    const rect = player.getBoundingClientRect();
    for(let i=0;i<count;i++){
      const d = document.createElement('div');
      d.className = 'dust';
      d.style.left = (rect.left + rect.width/2) + 'px';
      d.style.top = (rect.bottom - 4) + 'px';
      const a = rand(Math.PI*0.15, Math.PI*0.85), dist = rand(16, 40);
      d.style.setProperty('--dx', (-Math.cos(a)*dist) + 'px');
      d.style.setProperty('--dy', (-Math.sin(a)*dist*0.4) + 'px');
      stage.appendChild(d);
      setTimeout(() => d.remove(), 520);
    }
  }
  function spawnTrail(){
    const rect = player.getBoundingClientRect(), s = stage.getBoundingClientRect();
    const t = document.createElement('div');
    t.className = 'jumpTrail';
    t.style.left = (rect.left - s.left - 4) + 'px';
    t.style.top = (rect.top - s.top + rect.height/2 - 5) + 'px';
    stage.appendChild(t);
    setTimeout(() => t.remove(), 420);
  }

  /* ===== ループ ===== */
  function loop(ts){
    if(!running) return;
    if(lastTs === null) lastTs = ts;
    const dt = Math.min(0.032, (ts - lastTs) / 1000);
    lastTs = ts;

    if(!betweenStages){
      invuln = Math.max(0, invuln - dt);
      speedFactor = Math.min(1, speedFactor + dt * 0.9);
      const step = speed * speedFactor * dt;
      cameraX += step;
      totalDist += step;
      score += step / PX_PER_M;   // 1m = 1点

      vy += GRAVITY * dt;
      playerOffsetY -= vy * dt;
      if(playerOffsetY <= 0){
        playerOffsetY = 0; vy = 0;
        if(!grounded){
          grounded = true; jumpsLeft = 2;
          spawnDust(8);
          player.classList.remove('airborne');
          player.style.transform = '';
          player.classList.add('running');
        }
        playerShadow.style.transform = 'scale(1,1)';
        playerShadow.style.opacity = '0.35';
      } else {
        player.classList.add('airborne');
        const vyNorm = Math.max(-1, Math.min(1, -vy / 900));
        player.style.transform = `translateY(${-playerOffsetY}px) rotate(${-vyNorm*10}deg) scale(${1 - vyNorm*0.2}, ${1 + vyNorm*0.3})`;
        const hr = Math.min(1, playerOffsetY / MAX_HEIGHT_REF);
        playerShadow.style.transform = `scale(${1 - hr*0.65}, ${1 - hr*0.65})`;
        playerShadow.style.opacity = (0.35 - hr*0.28).toFixed(2);
        trailTimer += dt;
        if(trailTimer > 0.07){ trailTimer = 0; spawnTrail(); }
      }

      objects.forEach(o => {
        const sx = o.x - cameraX;
        if(!o.el.classList.contains('kicked')) o.el.style.left = sx + 'px';
        if(o.done) return;
        const overlapX = sx < PLAYER_X + PLAYER_W - 8 && sx + o.w > PLAYER_X + 8;
        if(!overlapX) return;
        if(o.type === 'rock'){
          if(playerOffsetY < o.h - 4) hit(o);
        } else {
          const overlapY = playerOffsetY < o.y + o.h - 4 && playerOffsetY + PLAYER_H > o.y + 4;
          if(overlapY) o.type === 'star' ? collectStar(o) : hit(o);
        }
      });

      const wallScreenX = wallWorldX - cameraX;
      wall.style.left = wallScreenX + 'px';
      groundStripes.style.backgroundPositionX = (-cameraX) + 'px';
      if(wallScreenX <= PLAYER_X + PLAYER_W && lives > 0) reachWall();
      renderHud();
    }
    rafId = requestAnimationFrame(loop);
  }

  // 壁にぶつかったら、ステージクリア
  function reachWall(){
    betweenStages = true;
    cleared++;
    const bonus = 300 * stageNo;
    score += bonus;
    player.classList.remove('running');
    player.classList.add('crashed');
    stage.classList.add('crashed');
    stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
    factSub.textContent = `「${wallLabel.textContent}」の壁`;
    factText.classList.add('pop');
    factSub.classList.add('show');
    clearBanner.textContent = `STAGE ${stageNo} CLEAR　+${bonus}`;
    clearBanner.classList.add('show');
    renderHud();
    setTimeout(() => {
      if(!running) return;
      stageNo++;
      playerOffsetY = 0; vy = 0; grounded = true; jumpsLeft = 2;
      setupStage();
    }, 1800);
  }

  function startGame(){
    document.getElementById('startScreen').classList.remove('show');
    document.getElementById('resultScreen').classList.remove('show');
    stageNo = 1; cameraX = 0; score = 0; stars = 0; totalDist = 0; cleared = 0;
    lives = MAX_LIVES; invuln = 0; speedFactor = 1;
    playerOffsetY = 0; vy = 0; grounded = true; jumpsLeft = 2;
    document.querySelectorAll('.confetti, .pts, .rock, .star, .moya').forEach(e => e.remove());
    objects = [];
    setupStage();
    running = true;
    lastTs = null;
    if(rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function gameOver(){
    if(!running) return;
    running = false;
    cancelAnimationFrame(rafId);
    player.classList.remove('running');
    const final = Math.floor(score);
    const isBest = final > save.best;
    if(isBest) save.best = final;
    save.bestStage = Math.max(save.bestStage, cleared);
    writeSave();
    document.getElementById('finalScore').textContent = final.toLocaleString();
    document.getElementById('newBest').style.display = isBest && final > 0 ? 'inline-block' : 'none';
    document.getElementById('bestLine').textContent = `自己ベスト ${save.best.toLocaleString()}`;
    document.getElementById('stStage').textContent = cleared;
    document.getElementById('stDist').textContent = Math.round(totalDist / PX_PER_M) + 'm';
    document.getElementById('stStars').textContent = stars;
    const pool = cleared >= 4 ? COMMENTS.great : cleared >= 2 ? COMMENTS.good : COMMENTS.normal;
    document.getElementById('comment').textContent = pick(pool);
    setTimeout(() => document.getElementById('resultScreen').classList.add('show'), 500);
    sendResultToPortal(final);
  }

  // ポータルサイトに埋め込まれている場合、結果を親ウィンドウへ送信する（score はランキング用）
  function sendResultToPortal(final){
    try{
      window.parent.postMessage({
        type: 'moyamoyaGameResult',
        gameId: 'fact-run',
        summary: `スコア ${final.toLocaleString()}（壁${cleared}枚・${Math.round(totalDist / PX_PER_M)}m）`,
        detail: { score: final, stages: cleared, dist: Math.round(totalDist / PX_PER_M), stars }
      }, '*');
    }catch(e){ /* ポータル外で単体表示している場合は何もしない */ }
  }

  stage.addEventListener('pointerdown', e => { if(!e.target.closest('.overlay')) jump(); });
  window.addEventListener('keydown', e => {
    if(e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); jump(); }
  });
  document.getElementById('startBest').textContent = save.best > 0 ? `自己ベスト ${save.best.toLocaleString()}` : '';
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  stage.classList.add('scene-morning');
  renderHud();
})();
</script>
</body>
</html>
