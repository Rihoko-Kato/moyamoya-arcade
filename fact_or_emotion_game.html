<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>事実と感情の仕分け</title>
<style>
  :root{
    --bg1:#12151c;
    --bg2:#1b2029;
    --fact-color:#2fbfa3;      /* 事実:青緑 */
    --fact-color-dim:#1d6f60;
    --emotion-color:#e2566b;  /* 感情:赤 */
    --emotion-color-dim:#8a2e3a;
    --card-bg:#242a35;
    --text-main:#eef1f5;
    --text-sub:#9aa3b2;
    --accent:#f4c95d;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--text-main);
    overflow:hidden;
    touch-action:none;
    -webkit-user-select:none;user-select:none;
  }
  #app{
    position:relative;
    width:100%;
    height:100%;
    max-width:480px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:18px 16px 22px;
  }

  /* ヘッダー */
  header{
    width:100%;
    text-align:center;
    padding-top:6px;
  }
  header h1{
    font-size:16px;
    letter-spacing:2px;
    color:var(--text-sub);
    font-weight:500;
    margin:0 0 10px;
  }
  #progressWrap{
    width:100%;
    height:8px;
    background:#0007;
    border-radius:6px;
    overflow:hidden;
  }
  #progressBar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--fact-color),var(--accent));
    transition:width .35s ease;
  }
  #counter{
    margin-top:6px;
    font-size:12px;
    color:var(--text-sub);
  }

  /* ゾーン表示（左右仕分け先） */
  .zoneLabels{
    width:100%;
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--text-sub);
    padding:0 6px;
    margin-top:2px;
  }
  .zoneLabels span{ opacity:.8; }
  .zoneLabels .left{ color:var(--emotion-color); }
  .zoneLabels .right{ color:var(--fact-color); }

  /* カードエリア */
  #cardStage{
    position:relative;
    width:100%;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:260px;
  }

  .card{
    position:absolute;
    width:88%;
    max-width:340px;
    min-height:200px;
    background:var(--card-bg);
    border-radius:22px;
    box-shadow:0 12px 30px rgba(0,0,0,.45);
    border:2px solid #3a4150;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 22px;
    text-align:center;
    font-size:22px;
    line-height:1.6;
    font-weight:600;
    cursor:grab;
    will-change:transform;
    transition:transform .25s ease, opacity .25s ease, box-shadow .2s ease, border-color .2s ease;
    touch-action:none;
  }
  .card.grabbing{ cursor:grabbing; transition:none; }
  .card .hint{
    position:absolute;
    top:14px;
    font-size:12px;
    padding:4px 10px;
    border-radius:20px;
    font-weight:700;
    letter-spacing:2px;
    opacity:0;
    transition:opacity .15s ease;
  }
  .hint.factHint{ right:14px; color:var(--fact-color); border:1px solid var(--fact-color); }
  .hint.emoHint{ left:14px; color:var(--emotion-color); border:1px solid var(--emotion-color); }

  /* 正誤フラッシュ */
  .card.correct-fact{
    border-color:var(--fact-color);
    box-shadow:0 0 0 6px var(--fact-color-dim), 0 12px 30px rgba(0,0,0,.45);
  }
  .card.correct-emotion{
    border-color:var(--emotion-color);
    box-shadow:0 0 0 6px var(--emotion-color-dim), 0 12px 30px rgba(0,0,0,.45);
  }
  .card.wrong{
    animation: shake .4s ease;
    border-color:#ff3b3b;
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0) rotate(0); }
    20%{ transform:translateX(-10px) rotate(-2deg); }
    40%{ transform:translateX(10px) rotate(2deg); }
    60%{ transform:translateX(-8px) rotate(-1.5deg); }
    80%{ transform:translateX(8px) rotate(1.5deg); }
  }

  /* 仕分け先アイコン（背景に薄く表示） */
  #bgIcons{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    pointer-events:none;
    padding:0 8px;
    z-index:0;
  }
  #bgIcons .icon{
    font-size:44px;
    opacity:.15;
  }

  /* フローティングテキスト（受け止めた／捨てた） */
  .floatText{
    position:absolute;
    top:40%;
    font-size:15px;
    font-weight:700;
    padding:8px 16px;
    border-radius:20px;
    pointer-events:none;
    opacity:0;
    z-index:5;
  }

  /* ボタン */
  #controls{
    width:100%;
    display:flex;
    gap:14px;
    margin-top:10px;
  }
  .actionBtn{
    flex:1;
    padding:18px 8px;
    border:none;
    border-radius:18px;
    font-size:16px;
    font-weight:700;
    letter-spacing:1px;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    -webkit-tap-highlight-color:transparent;
    box-shadow:0 6px 14px rgba(0,0,0,.35);
    transition:transform .08s ease, filter .1s ease;
  }
  .actionBtn:active{ transform:scale(.94); filter:brightness(1.15); }
  .actionBtn .sub{ font-size:11px; font-weight:400; opacity:.85; }
  #trashBtn{ background:linear-gradient(135deg,var(--emotion-color),#a83349); }
  #factBtn{ background:linear-gradient(135deg,var(--fact-color),#1c8f79); }

  #splitBtn{
    flex:0 0 86px;
    background:linear-gradient(135deg,#6a7385,#4a5263);
  }
  #controls.noSplit #splitBtn{ display:none; }
  .actionBtn{ cursor:pointer; font-family:inherit; }

  /* 混ざったカード（事実＋気持ち） */
  .card .mixHint{
    position:absolute; bottom:12px; left:0; right:0;
    font-size:11px; color:var(--text-sub); font-weight:500; letter-spacing:1px;
  }
  .piece{
    position:absolute;
    width:44%;
    min-height:120px;
    background:var(--card-bg);
    border-radius:16px;
    border:2px solid #3a4150;
    display:flex; align-items:center; justify-content:center;
    padding:16px 12px;
    text-align:center;
    font-size:16px; line-height:1.5; font-weight:600;
    box-shadow:0 10px 24px rgba(0,0,0,.45);
    transition:transform .6s cubic-bezier(.3,.7,.3,1), opacity .6s ease;
    z-index:4;
  }
  .piece.fact{ border-color:var(--fact-color); color:#dff7f1; }
  .piece.emo{ border-color:var(--emotion-color); color:#ffe1e6; }
  .snip{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    font-size:40px; z-index:6; pointer-events:none;
    animation:snip .5s ease forwards;
  }
  @keyframes snip{
    0%{ transform:translate(-120%,-50%) rotate(-20deg); opacity:0; }
    40%{ opacity:1; }
    100%{ transform:translate(40%,-50%) rotate(10deg); opacity:0; }
  }

  /* 考え直しのヒント */
  #hintBox{
    position:absolute;
    left:50%; bottom:6px;
    transform:translateX(-50%);
    width:92%; max-width:360px;
    background:#0b0e14ee;
    border:1px solid var(--accent);
    color:#f6e7bf;
    font-size:12.5px; line-height:1.6;
    padding:8px 12px; border-radius:12px;
    z-index:7;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
  }
  #hintBox.show{ opacity:1; }

  /* はじまり・結果画面 共通 */
  .overlay{
    position:fixed; inset:0;
    background:rgba(10,12,18,.95);
    display:none; flex-direction:column; align-items:center;
    z-index:50; padding:16px;
    overflow-y:auto;
    touch-action:pan-y;
  }
  .overlay.show{ display:flex; }
  .overlayInner{ margin:auto 0; width:100%; max-width:380px; text-align:center; }
  .overlay h2{
    font-size:20px; margin:0 0 6px;
    background:linear-gradient(90deg,var(--fact-color),var(--accent));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .overlay .sub{ font-size:12.5px; color:var(--text-sub); line-height:1.7; margin-bottom:14px; }

  .sceneGrid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
  .sceneBtn{
    padding:12px 8px; border-radius:14px;
    border:1.5px solid #3a4150; background:var(--card-bg); color:var(--text-main);
    font-size:13.5px; font-weight:700; font-family:inherit; cursor:pointer;
    position:relative;
  }
  .sceneBtn .stamp{ position:absolute; top:4px; right:6px; font-size:11px; color:var(--fact-color); }
  .sceneBtn.wide{ grid-column:1 / -1; }
  .sceneBtn.own{ border-color:var(--accent); color:var(--accent); }

  #ownArea{ display:none; text-align:left; }
  #ownArea.show{ display:block; }
  #ownInput{
    width:100%; min-height:120px; resize:vertical;
    padding:10px 12px; border-radius:12px;
    border:1.5px solid #3a4150; background:#0e1118; color:var(--text-main);
    font-size:14px; font-family:inherit; line-height:1.7; outline:none;
    -webkit-user-select:text; user-select:text;
  }
  #ownInput:focus{ border-color:var(--accent); }
  #ownNote{ font-size:11px; color:var(--text-sub); margin:6px 0 12px; line-height:1.6; }

  .mainBtn{
    padding:13px 32px; border:none; border-radius:30px;
    background:linear-gradient(135deg,var(--accent),#e0a93a);
    color:#1a1a1a; font-weight:800; font-size:15px; font-family:inherit;
    box-shadow:0 6px 16px rgba(0,0,0,.4); cursor:pointer;
  }
  .ghostBtn{
    padding:12px 22px; border:1px solid #4a5263; border-radius:30px;
    background:none; color:var(--text-main); font-weight:700; font-size:13.5px; font-family:inherit; cursor:pointer;
  }
  .btnRow{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }

  .flatReport{
    display:inline-block;
    font-size:12.5px; color:#b8bfcc; font-weight:700;
    background:#ffffff12; border-radius:12px; padding:6px 14px; margin-bottom:10px;
  }
  #introLine{ font-size:12.5px; color:var(--accent); font-weight:700; margin:0 0 10px; line-height:1.7; }
  .listBox{
    text-align:left; border-radius:12px; padding:10px 12px; margin-bottom:8px;
  }
  .listBox h3{ font-size:12px; margin:0 0 4px; }
  .listBox ul{ margin:0; padding-left:18px; font-size:13px; line-height:1.75; }
  #factBox{ background:#2fbfa318; border:1px solid #2fbfa355; }
  #factBox h3{ color:var(--fact-color); }
  #emoBox{ background:#e2566b10; border:1px solid #e2566b33; }
  #emoBox h3{ color:var(--emotion-color); }
  #emoBox ul{ color:#8a8f9a; text-decoration:line-through; text-decoration-color:#e2566b88; }
  .factRow{
    display:flex; align-items:center; gap:10px;
    background:var(--card-bg); border-radius:12px;
    padding:8px 12px; margin-bottom:6px; text-align:left;
  }
  .factRow .icon{ font-size:17px; }
  .factRow .txt{ font-size:13px; font-weight:700; line-height:1.5; }
  .factRow .txt b{ color:var(--accent); font-size:14.5px; }
  .factRow.event{ border:1px solid var(--accent); }
  #totalLine{ font-size:11.5px; color:var(--text-sub); margin-top:8px; }

  /* 初回説明トースト */
  #tutorial{
    position:absolute;
    bottom:130px;
    left:50%;
    transform:translateX(-50%);
    background:#000a;
    padding:10px 18px;
    border-radius:20px;
    font-size:12px;
    color:var(--text-sub);
    white-space:nowrap;
    animation:fadeInOut 4.5s ease forwards;
    z-index:6;
  }
  @keyframes fadeInOut{
    0%{opacity:0;} 10%{opacity:1;} 80%{opacity:1;} 100%{opacity:0;}
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1 id="sceneTitle">今日の振り返り</h1>
    <div id="progressWrap"><div id="progressBar"></div></div>
    <div id="counter">0 / 0</div>
    <div class="zoneLabels">
      <span class="left">← 気持ち：手放す</span>
      <span class="right">事実：受け止める →</span>
    </div>
  </header>

  <div id="cardStage">
    <div id="bgIcons">
      <div class="icon">🗑️</div>
      <div class="icon">📥</div>
    </div>
    <div id="hintBox"></div>
  </div>

  <div id="controls">
    <button class="actionBtn" id="trashBtn">
      <span>気持ち</span>
      <span class="sub">手放す</span>
    </button>
    <button class="actionBtn" id="splitBtn">
      <span>✂</span>
      <span class="sub">切り分ける</span>
    </button>
    <button class="actionBtn" id="factBtn">
      <span>事実</span>
      <span class="sub">受け止める</span>
    </button>
  </div>
</div>

<div id="startScreen" class="overlay show">
  <div class="overlayInner">
    <h2>事実と感情の仕分け</h2>
    <div class="sub">起きた「事実」と、そこにくっついた「気持ち」を分けてみよう。<br>混ざっているカードは ✂ で切り分けられる。</div>
    <div id="sceneArea">
      <div class="sceneGrid" id="sceneGrid"></div>
    </div>
    <div id="ownArea">
      <textarea id="ownInput" maxlength="400" placeholder="今日あったこと・思ったことを、1行に1つずつ&#10;例）&#10;発表の順番が最後だった&#10;うまく話せなくて恥ずかしかった"></textarea>
      <div id="ownNote">1行が1枚のカードになります（最大10枚）。ここに正解はありません。自分で仕分けてみてください。<br>書いた内容はこの画面の中だけで使われ、どこにも保存・送信されません。</div>
      <div class="btnRow">
        <button class="ghostBtn" id="ownBack">もどる</button>
        <button class="mainBtn" id="ownStart">仕分けはじめる</button>
      </div>
    </div>
  </div>
</div>

<div id="clearScreen" class="overlay">
  <div class="overlayInner">
    <h2>振り返り、完了。</h2>
    <div class="flatReport" id="flatReport"></div>
    <div id="introLine"></div>
    <div class="listBox" id="factBox">
      <h3>📥 事実だけで読むと、こんな日</h3>
      <ul id="factList"></ul>
    </div>
    <div class="listBox" id="emoBox">
      <h3>🗑️ 手放した気持ち</h3>
      <ul id="emoList"></ul>
    </div>
    <div id="factRows"></div>
    <div id="totalLine"></div>
    <div class="btnRow">
      <button class="mainBtn" id="retryBtn">別のシーンで</button>
    </div>
  </div>
</div>

<script>
(function(){
  /* =========================================================
     シーン（研究の「しんどいシーン」から）
     fact：事実 / emo：気持ち・解釈 / mix：事実と気持ちが混ざったもの
     ========================================================= */
  const SCENES = [
    { id:'baito', name:'バイトのこと',
      fact:['今日は客数がいつもより多かった','シフト中、レジ対応に入った','新人スタッフが2人同時に入っていた','電話が閉店間際に3件鳴った','閉店作業が予定より15分遅れた','後輩が1人で品出しをしていた'],
      emo:['先輩なのに情けない','自分はダメな人間だ','みんなに嫌われたかも','なんで自分だけ要領が悪いんだろう','もう顔を合わせられない'],
      mix:[
        { fact:'後輩のフォローに入れなかった', emo:'最悪の先輩だ' },
        { fact:'店長に声をかけられた', emo:'きっと怒ってる' },
        { fact:'注文を1つ間違えた', emo:'いつもこうだ' }
      ] },
    { id:'seisaku', name:'制作のこと',
      fact:['作業に3時間かけた','新しい技法を1つ試した','締め切りは金曜','色の調整が残っている','試作を2回作り直した','友達に途中経過を見せた'],
      emo:['この程度にしかできない','センスがない','時間をかけても意味がない','人に見せるのが恥ずかしい','いつも無計画だ'],
      mix:[
        { fact:'思っていた形にならなかった', emo:'才能がない' },
        { fact:'友達が上手な作品を出した', emo:'私はだめだ' },
        { fact:'予定より進まなかった', emo:'また中途半端' }
      ] },
    { id:'mensetsu', name:'面接・発表のこと',
      fact:['面接は20分だった','質問に3つ答えた','隣の人は留学の話をしていた','発表は8分で終わった','結果は来週わかる','準備に2日かけた'],
      emo:['胸を張れる経験がない','みんな賢そうだった','自分には何もない','絶対落ちた','どうしてもっと頑張れなかったんだろう'],
      mix:[
        { fact:'最初の質問で言葉に詰まった', emo:'もう終わった' },
        { fact:'声が少し震えた', emo:'恥ずかしい' },
        { fact:'面接官がメモを取らなかった', emo:'興味なかったんだ' }
      ] },
    { id:'kazoku', name:'家族・親しい人のこと',
      fact:['夕飯のときに母と話した','「別にいい」と返事をした','部屋に戻ってドアを閉めた','週末に会う約束がある','LINEの返信は2時間後だった','ありがとうと言わなかった'],
      emo:['可愛げがない自分が嫌だ','嫌われたかもしれない','素直になれない自分が嫌い','私ってほんと子どもだ','成長してない'],
      mix:[
        { fact:'強い口調で言い返した', emo:'最低だ' },
        { fact:'返信が遅かった', emo:'怒ってるに違いない' },
        { fact:'感謝を伝えられなかった', emo:'冷たい人間だ' }
      ] }
  ];

  // 考え直しのヒント（「ミス」とは言わない）
  const HINTS = {
    factToEmo: ['ちょっと待って。これはカメラに映る「出来事」かも。手放さなくて大丈夫。','誰が見ても同じように言えること？それなら事実かも。'],
    emoToFact: ['これはカメラには映らない、心の中の声かも。','ほかの人が見たら、別の言い方になりそう？それなら気持ちかも。'],
    mixWhole:  ['出来事と気持ちが、くっついているみたい。✂ で切り分けてみて。','前半と後半で、性質がちがうかも。✂ を使ってみて。'],
    pureSplit: ['これはもう切り分けられないみたい。事実と気持ち、どっちかな？']
  };

  /* 累計（書いた内容は保存しない） */
  const SAVE_KEY = 'factEmotion_v1';
  function loadSave(){
    try{ return Object.assign({ plays:0, cards:0, splits:0, scenes:{}, own:0 }, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); }
    catch(e){ return { plays:0, cards:0, splits:0, scenes:{}, own:0 }; }
  }
  function writeSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
  let save = loadSave();

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  /* =========================================================
     状態
     ========================================================= */
  let mode = 'scene';      // 'scene' | 'own'
  let scene = null;
  let deck = [];
  let index = 0;
  let acceptedFacts = [];
  let releasedEmos = [];
  let rethinks = 0;
  let splits = 0;
  let currentCardEl = null;
  let dragging = false;
  let startX = 0, startY = 0, curX = 0, curY = 0;
  let locked = false;

  const stage = document.getElementById('cardStage');
  const progressBar = document.getElementById('progressBar');
  const counterEl = document.getElementById('counter');
  const controls = document.getElementById('controls');
  const hintBox = document.getElementById('hintBox');
  const startScreen = document.getElementById('startScreen');
  const clearScreen = document.getElementById('clearScreen');

  function vibrate(pattern){ if(navigator.vibrate) navigator.vibrate(pattern); }

  /* ===== はじまり画面 ===== */
  function renderSceneGrid(){
    const grid = document.getElementById('sceneGrid');
    grid.innerHTML = '';
    SCENES.forEach(s => {
      const b = document.createElement('button');
      b.className = 'sceneBtn';
      b.textContent = s.name;
      if(save.scenes[s.id]){
        const st = document.createElement('span');
        st.className = 'stamp';
        st.textContent = '✓' + (save.scenes[s.id] > 1 ? save.scenes[s.id] : '');
        b.appendChild(st);
      }
      b.addEventListener('click', () => startScene(s));
      grid.appendChild(b);
    });
    const r = document.createElement('button');
    r.className = 'sceneBtn wide';
    r.textContent = '🎲 おまかせ';
    r.addEventListener('click', () => startScene(pick(SCENES)));
    grid.appendChild(r);
    const own = document.createElement('button');
    own.className = 'sceneBtn wide own';
    own.textContent = '✍️ 自分の今日で仕分ける';
    own.addEventListener('click', () => {
      document.getElementById('sceneArea').style.display = 'none';
      document.getElementById('ownArea').classList.add('show');
      document.getElementById('ownInput').focus();
    });
    grid.appendChild(own);
  }

  function showStart(){
    clearScreen.classList.remove('show');
    document.getElementById('sceneArea').style.display = '';
    document.getElementById('ownArea').classList.remove('show');
    renderSceneGrid();
    startScreen.classList.add('show');
  }

  function resetRun(){
    index = 0;
    acceptedFacts = [];
    releasedEmos = [];
    rethinks = 0;
    splits = 0;
    if(currentCardEl){ currentCardEl.remove(); currentCardEl = null; }
    stage.querySelectorAll('.piece, .floatText, .snip').forEach(e => e.remove());
    hideHint();
  }

  function startScene(s){
    mode = 'scene';
    scene = s;
    resetRun();
    // 毎回ちがうカードの組み合わせ：事実4・気持ち4・混ざり3
    deck = shuffle([
      ...shuffle(s.fact).slice(0,4).map(t => ({ type:'fact', text:t })),
      ...shuffle(s.emo).slice(0,4).map(t => ({ type:'emo', text:t })),
      ...shuffle(s.mix).slice(0,3).map(m => ({ type:'mix', fact:m.fact, emo:m.emo, text:`${m.fact}。${m.emo}` }))
    ]);
    document.getElementById('sceneTitle').textContent = s.name;
    controls.classList.remove('noSplit');
    startScreen.classList.remove('show');
    updateProgress();
    renderCard();
    showTutorialOnce('カードをスワイプ、またはボタンで仕分けよう。混ざっていたら ✂');
  }

  function startOwn(){
    const lines = document.getElementById('ownInput').value
      .split('\n').map(s => s.trim()).filter(Boolean).slice(0, 10);
    if(lines.length === 0){ document.getElementById('ownInput').focus(); return; }
    mode = 'own';
    scene = null;
    resetRun();
    deck = lines.map(t => ({ type:'own', text:t }));
    document.getElementById('sceneTitle').textContent = '自分の今日';
    controls.classList.add('noSplit');
    startScreen.classList.remove('show');
    updateProgress();
    renderCard();
    showTutorialOnce('ここに正解はありません。自分で仕分けてみよう');
  }

  /* ===== カード ===== */
  function updateProgress(){
    const total = deck.length;
    progressBar.style.width = (total ? index/total*100 : 0) + '%';
    counterEl.textContent = `${index} / ${total}`;
  }

  function renderCard(){
    if(index >= deck.length){ setTimeout(finishGame, 500); return; }
    if(currentCardEl) currentCardEl.remove();
    const data = deck[index];
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="hint emoHint">気持ち</div><div class="hint factHint">事実</div><div class="cardText"></div>`;
    card.querySelector('.cardText').textContent = data.text;
    stage.appendChild(card);
    currentCardEl = card;
    attachDrag(card);
    locked = false;
  }

  function attachDrag(card){
    card.addEventListener('pointerdown', onDown);
    function onDown(e){
      if(locked) return;
      dragging = true;
      card.classList.add('grabbing');
      startX = e.clientX; startY = e.clientY;
      card.setPointerCapture(e.pointerId);
      card.addEventListener('pointermove', onMove);
      card.addEventListener('pointerup', onUp);
      card.addEventListener('pointercancel', onUp);
    }
    function onMove(e){
      if(!dragging) return;
      curX = e.clientX - startX;
      curY = e.clientY - startY;
      card.style.transform = `translate(${curX}px, ${curY}px) rotate(${curX * 0.05}deg)`;
      const factHint = card.querySelector('.factHint');
      const emoHint = card.querySelector('.emoHint');
      const th = 40;
      factHint.style.opacity = curX > th ? Math.min(1, (curX-th)/60) : 0;
      emoHint.style.opacity = curX < -th ? Math.min(1, (-curX-th)/60) : 0;
    }
    function onUp(){
      if(!dragging) return;
      dragging = false;
      card.classList.remove('grabbing');
      card.removeEventListener('pointermove', onMove);
      card.removeEventListener('pointerup', onUp);
      card.removeEventListener('pointercancel', onUp);
      const SW = 110;
      if(curX > SW) judge('fact');
      else if(curX < -SW) judge('emo');
      else if(curY > SW && mode === 'scene') judge('split'); // 下にスワイプでも切り分け
      else resetCardPos(card);
      curX = 0; curY = 0;
    }
  }

  function resetCardPos(card){
    card.style.transform = 'translate(0,0) rotate(0)';
    card.querySelector('.factHint').style.opacity = 0;
    card.querySelector('.emoHint').style.opacity = 0;
  }

  function showHint(text){
    hintBox.textContent = text;
    hintBox.classList.add('show');
  }
  function hideHint(){ hintBox.classList.remove('show'); }

  function judge(choice){
    if(locked || !currentCardEl) return;
    const card = currentCardEl;
    const data = deck[index];
    locked = true;

    // 自分の今日モード：正解はないので、選んだとおりに受け取る
    if(data.type === 'own'){
      if(choice === 'fact'){ acceptedFacts.push(data.text); flyOut(card, 1); }
      else { releasedEmos.push(data.text); flyOut(card, -1); }
      return next();
    }

    let hint = null;
    if(data.type === 'fact' && choice !== 'fact') hint = choice === 'split' ? pick(HINTS.pureSplit) : pick(HINTS.factToEmo);
    else if(data.type === 'emo' && choice !== 'emo') hint = choice === 'split' ? pick(HINTS.pureSplit) : pick(HINTS.emoToFact);
    else if(data.type === 'mix' && choice !== 'split') hint = pick(HINTS.mixWhole);

    if(hint){
      // ちがう方に入れたときは、ヒントを出して考え直してもらう（減点はしない）
      rethinks++;
      vibrate([20,30,20]);
      card.classList.add('wrong');
      showHint(hint);
      setTimeout(() => {
        card.classList.remove('wrong');
        resetCardPos(card);
        locked = false;
      }, 420);
      return;
    }

    hideHint();
    vibrate(15);
    if(data.type === 'mix'){
      splits++;
      splitCard(card, data);
      acceptedFacts.push(data.fact);
      releasedEmos.push(data.emo);
      setTimeout(next, 900);
      return;
    }
    if(choice === 'fact'){
      acceptedFacts.push(data.text);
      card.classList.add('correct-fact');
      flyOut(card, 1);
      showFloatText('受け止めた', 'var(--fact-color)', true);
    } else {
      releasedEmos.push(data.text);
      card.classList.add('correct-emotion');
      flyOut(card, -1);
      showFloatText('手放した', 'var(--emotion-color)', false);
    }
    next();
  }

  function next(){
    setTimeout(() => {
      index++;
      updateProgress();
      renderCard();
    }, 380);
  }

  // ✂ 事実と気持ちを、2枚に切り離す
  function splitCard(card, data){
    const r = card.getBoundingClientRect();
    const s = stage.getBoundingClientRect();
    card.remove();
    currentCardEl = null;
    const snip = document.createElement('div');
    snip.className = 'snip';
    snip.textContent = '✂';
    stage.appendChild(snip);
    setTimeout(() => snip.remove(), 520);

    const mk = (cls, text, dx) => {
      const p = document.createElement('div');
      p.className = 'piece ' + cls;
      p.textContent = text;
      p.style.left = (r.left - s.left + r.width/2 + dx) + 'px';
      p.style.top = (r.top - s.top + r.height/2) + 'px';
      p.style.transform = 'translate(-50%,-50%)';
      stage.appendChild(p);
      return p;
    };
    const fp = mk('fact', data.fact, r.width * 0.24);
    const ep = mk('emo', data.emo, -r.width * 0.24);
    setTimeout(() => {
      fp.style.transform = 'translate(-50%,-50%) translateX(40px) rotate(4deg)';
      ep.style.transform = 'translate(-50%,-50%) translateX(-40px) rotate(-4deg)';
    }, 120);
    setTimeout(() => {
      fp.style.transform = 'translate(-50%,-50%) translateX(700px) rotate(20deg)';
      fp.style.opacity = '0';
      ep.style.transform = 'translate(-50%,-50%) translateX(-700px) rotate(-20deg)';
      ep.style.opacity = '0';
      showFloatText('切り分けた', 'var(--accent)', true);
    }, 520);
    setTimeout(() => { fp.remove(); ep.remove(); }, 1200);
  }

  function flyOut(card, dir){
    card.style.transition = 'transform .38s ease, opacity .38s ease';
    card.style.transform = `translate(${dir * 700}px, -40px) rotate(${dir*30}deg)`;
    card.style.opacity = '0';
  }

  function showFloatText(text, color, isFact){
    const el = document.createElement('div');
    el.className = 'floatText';
    el.textContent = text;
    el.style.color = color;
    el.style.background = 'rgba(0,0,0,.35)';
    el.style.border = `1px solid ${color}`;
    el.style.left = isFact ? '58%' : '10%';
    stage.appendChild(el);
    requestAnimationFrame(() => {
      el.style.transition = 'opacity .5s ease, transform .5s ease';
      el.style.opacity = '1';
      el.style.transform = 'translateY(-20px)';
    });
    setTimeout(() => {
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 400);
    }, 500);
  }

  document.getElementById('trashBtn').addEventListener('click', () => judge('emo'));
  document.getElementById('factBtn').addEventListener('click', () => judge('fact'));
  document.getElementById('splitBtn').addEventListener('click', () => { if(mode === 'scene') judge('split'); });
  window.addEventListener('keydown', (e) => {
    if(startScreen.classList.contains('show') || clearScreen.classList.contains('show')) return;
    if(e.key === 'ArrowLeft') judge('emo');
    else if(e.key === 'ArrowRight') judge('fact');
    else if(e.key === 'ArrowDown' && mode === 'scene') judge('split');
  });

  /* ===== 結果 ===== */
  function finishGame(){
    save.plays++;
    save.cards += deck.length;
    save.splits += splits;
    if(mode === 'scene') save.scenes[scene.id] = (save.scenes[scene.id] || 0) + 1;
    else save.own++;
    writeSave();

    document.getElementById('flatReport').textContent = `${deck.length}枚を仕分けた（事実）`;
    const intro = document.getElementById('introLine');
    if(save.plays === 1){
      intro.textContent = '気持ちを否定しなくていい。ただ、それが「事実」とは別だと知っておくだけでいい。';
      intro.style.display = 'block';
    } else {
      intro.style.display = 'none';
    }

    const fill = (id, list) => {
      const ul = document.getElementById(id);
      ul.innerHTML = '';
      if(list.length === 0){
        const li = document.createElement('li');
        li.textContent = '（なし）';
        ul.appendChild(li);
      }
      list.forEach(t => {
        const li = document.createElement('li');
        li.textContent = t;
        ul.appendChild(li);
      });
    };
    fill('factList', acceptedFacts);
    fill('emoList', releasedEmos);

    const n = v => `<b>${v}</b>`;
    const rows = [];
    if(mode === 'scene'){
      if(splits > 0) rows.push({ icon:'✂', text:`${n(splits)} 枚を、事実と気持ちに切り分けた` });
      rows.push(rethinks > 0
        ? { icon:'🤔', text:`${n(rethinks)} 回、立ち止まって考え直した` }
        : { icon:'🤔', text:`迷わずに、全部仕分けた` });
      const done = SCENES.filter(s => save.scenes[s.id]).length;
      if(save.scenes[scene.id] === 1){
        rows.push({ icon:'📗', text:`「${scene.name}」をはじめて振り返った（${done} / ${SCENES.length} シーン）`, event:true });
      }
    } else {
      rows.push({ icon:'✍️', text:`自分の言葉で ${n(deck.length)} 枚、書き出した` });
      rows.push({ icon:'📥', text:`そのうち ${n(acceptedFacts.length)} 枚を、事実として受け止めた` });
    }
    const box = document.getElementById('factRows');
    box.innerHTML = '';
    rows.forEach(r => {
      const row = document.createElement('div');
      row.className = 'factRow' + (r.event ? ' event' : '');
      row.innerHTML = `<div class="icon"></div><div class="txt"></div>`;
      row.querySelector('.icon').textContent = r.icon;
      row.querySelector('.txt').innerHTML = r.text; // 数値と固定文・シーン名だけ（自分で書いた内容はここに入れない）
      box.appendChild(row);
    });
    document.getElementById('totalLine').textContent = `これまで ${save.plays} 回 ・ ${save.cards} 枚を仕分けて、${save.splits} 枚を切り分けた`;

    clearScreen.classList.add('show');
    sendResultToPortal();
  }

  // ポータルサイトに埋め込まれている場合、結果を親ウィンドウへ送信する（自分で書いた内容は送らない）
  function sendResultToPortal(){
    try{
      window.parent.postMessage({
        type: 'moyamoyaGameResult',
        gameId: 'fact-emotion',
        summary: mode === 'scene'
          ? `「${scene.name}」の${deck.length}枚を仕分け、${splits}枚を切り分けた`
          : `自分の今日を${deck.length}枚、仕分けた`,
        detail: { mode, scene: scene ? scene.id : null, total: deck.length, facts: acceptedFacts.length, emotions: releasedEmos.length, splits, rethinks, plays: save.plays }
      }, '*');
    }catch(e){ /* ポータル外で単体表示している場合は何もしない */ }
  }

  function showTutorialOnce(text){
    const tip = document.createElement('div');
    tip.id = 'tutorial';
    tip.textContent = text;
    document.getElementById('app').appendChild(tip);
    setTimeout(() => tip.remove(), 4500);
  }

  document.getElementById('retryBtn').addEventListener('click', showStart);
  document.getElementById('ownStart').addEventListener('click', startOwn);
  document.getElementById('ownBack').addEventListener('click', showStart);

  showStart();
})();
</script>
