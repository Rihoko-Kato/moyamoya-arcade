<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>事実と感情の仕分け</title>
<style>
  :root{
    --bg1:#12151c;
    --bg2:#1b2029;
    --fact-color:#2fbfa3;
    --emotion-color:#e2566b;
    --card-bg:#242a35;
    --text-main:#eef1f5;
    --text-sub:#9aa3b2;
    --accent:#f4c95d;
    --gal-pink:#ff7eb6;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--text-main);
    overflow:hidden;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
  }
  #app{
    position:relative;
    width:100%; height:100%;
    max-width:520px;
    margin:0 auto;
    display:flex; flex-direction:column;
  }

  /* ===== HUD ===== */
  #hud{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px 6px;
    font-weight:800;
    z-index:5;
  }
  #scoreBox{ font-size:22px; font-variant-numeric:tabular-nums; letter-spacing:1px; }
  #scoreBox small{ display:block; font-size:10px; color:var(--text-sub); font-weight:600; letter-spacing:0; }
  #comboBox{
    font-size:13px; color:var(--accent); text-align:center; min-width:80px;
    opacity:0; transition:opacity .2s ease;
  }
  #comboBox.on{ opacity:1; }
  #comboBox b{ font-size:22px; display:block; line-height:1; }
  #comboBox.pop b{ animation:comboPop .25s ease; }
  @keyframes comboPop{ 50%{ transform:scale(1.35); } }
  #lives{ font-size:18px; letter-spacing:2px; }
  #lives .lost{ opacity:.2; filter:grayscale(1); }

  /* ===== 落ちてくるエリア ===== */
  #field{
    position:relative;
    flex:1;
    overflow:hidden;
    border-top:1px solid #ffffff10;
    background:
      linear-gradient(90deg, rgba(226,86,107,.07), transparent 22%, transparent 78%, rgba(47,191,163,.07));
  }
  #dangerLine{
    position:absolute; left:0; right:0; bottom:0; height:4px;
    background:linear-gradient(90deg,var(--emotion-color),var(--accent),var(--fact-color));
    opacity:.5;
  }
  .sideTag{
    position:absolute; bottom:14px;
    font-size:30px; opacity:.35; pointer-events:none;
    transition:transform .15s ease;
  }
  .sideTag.l{ left:10px; } .sideTag.r{ right:10px; }
  .sideTag.gulp{ animation:gulp .35s ease; opacity:.8; }
  @keyframes gulp{ 40%{ transform:scale(1.35) rotate(-8deg); } }

  .fcard{
    position:absolute;
    left:50%;
    width:min(74%, 290px);
    transform:translateX(-50%);
    background:var(--card-bg);
    border:2px solid #3a4150;
    border-radius:16px;
    padding:12px 14px;
    text-align:center;
    font-size:15.5px; font-weight:700; line-height:1.5;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
    will-change:top, transform;
  }
  .fcard.active{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(244,201,93,.35), 0 8px 20px rgba(0,0,0,.4);
  }
  .fcard.super{
    border-color:#ffd76a;
    background:linear-gradient(160deg,#3a3320,#242a35);
    box-shadow:0 0 18px rgba(255,215,106,.45), 0 8px 20px rgba(0,0,0,.4);
  }
  .fcard.super::before{ content:"✦ 超事実 ✦"; display:block; font-size:10px; color:#ffd76a; letter-spacing:2px; }
  .fcard.mix .half{ display:block; }
  .fcard.mix .cut{
    display:block; height:0; margin:8px -14px;
    border-top:2px dashed #8a93a5;
    position:relative;
  }
  .fcard.mix .cut::after{
    content:"✂"; position:absolute; left:-2px; top:-12px; font-size:14px; color:#8a93a5;
  }
  /* 外したときは「ぽよん」と戻るだけ（赤くしない） */
  .fcard.boing{ animation:boing .4s cubic-bezier(.3,1.6,.4,1); }
  @keyframes boing{
    0%{ transform:translateX(-50%) scale(1); }
    30%{ transform:translateX(-50%) scale(1.08, .9); }
    60%{ transform:translateX(-50%) scale(.95, 1.05); }
    100%{ transform:translateX(-50%) scale(1); }
  }
  .fcard.fly{ transition:transform .35s ease, opacity .35s ease; opacity:0; }
  .fcard.dropped{ transition:opacity .4s ease; opacity:0; }
  /* 手放したカードは丸めてゴミ箱へシュート */
  .fcard.crumple{
    transition:transform .45s cubic-bezier(.4,-0.3,.6,1), border-radius .2s ease, opacity .45s ease .25s;
    border-radius:50%;
    color:transparent;
    opacity:0;
  }

  /* ✂ で切れた2枚。切り口を点線にして、ふつうのカードとして落ちてくる（色で答えは見せない） */
  .fcard.cutTop{ border-top-style:dashed; border-top-color:#8a93a5; }
  .fcard.cutBottom{ border-bottom-style:dashed; border-bottom-color:#8a93a5; }
  .fcard.split{ animation:split .35s cubic-bezier(.3,1.5,.4,1); }
  @keyframes split{
    0%{ transform:translateX(-50%) scale(.85); opacity:.4; }
    100%{ transform:translateX(-50%) scale(1); opacity:1; }
  }

  .pts{
    position:absolute; pointer-events:none;
    font-weight:900; font-size:17px;
    transform:translate(-50%,-50%);
    animation:ptsUp .7s ease forwards;
    text-shadow:0 2px 6px rgba(0,0,0,.6);
    white-space:nowrap;
  }
  @keyframes ptsUp{
    0%{ opacity:0; transform:translate(-50%,-30%) scale(.7); }
    20%{ opacity:1; transform:translate(-50%,-60%) scale(1.1); }
    100%{ opacity:0; transform:translate(-50%,-160%) scale(1); }
  }
  #speedUp{
    position:absolute; left:50%; top:40%;
    transform:translate(-50%,-50%);
    font-size:20px; font-weight:900; color:var(--accent);
    letter-spacing:4px; opacity:0; pointer-events:none;
  }
  #speedUp.show{ animation:speedShow 1.2s ease; }
  @keyframes speedShow{ 0%,100%{ opacity:0; } 20%,70%{ opacity:1; } }

  /* ===== ギャル（ミカ） ===== */
  #galRow{
    display:flex; align-items:flex-end; gap:8px;
    padding:6px 12px 0;
    min-height:66px;
  }
  .gal{
    position:relative;
    width:56px; height:56px; flex-shrink:0;
  }
  .gal .hair{
    position:absolute; inset:0;
    border-radius:50% 50% 42% 42%;
    background:radial-gradient(circle at 40% 30%, #fff2b0, #f2c94c 60%, #d9a521);
  }
  .gal .hair::before, .gal .hair::after{
    content:""; position:absolute; bottom:-6px; width:16px; height:26px;
    background:linear-gradient(180deg,#f2c94c,#d9a521);
    border-radius:0 0 10px 10px;
  }
  .gal .hair::before{ left:2px; transform:rotate(8deg); }
  .gal .hair::after{ right:2px; transform:rotate(-8deg); }
  .gal .face{
    position:absolute; left:9px; top:13px; width:38px; height:38px;
    border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #fff1e6, #ffd9c2);
  }
  .gal .eye{
    position:absolute; top:15px; width:6px; height:7px; background:#3a2a3a; border-radius:50%;
  }
  .gal .eye.l{ left:9px; } .gal .eye.r{ right:9px; }
  .gal .eye::before{
    content:""; position:absolute; top:-3px; left:-2px; width:10px; height:3px;
    border-top:2px solid #3a2a3a; border-radius:50% 50% 0 0;
  }
  .gal .cheek{ position:absolute; top:23px; width:8px; height:5px; border-radius:50%; background:#ff9ec4; opacity:.8; }
  .gal .cheek.l{ left:4px; } .gal .cheek.r{ right:4px; }
  .gal .mouth{
    position:absolute; left:14px; top:26px; width:10px; height:5px;
    border-bottom:2px solid #c2456e; border-radius:0 0 8px 8px;
  }
  .gal .bang{
    position:absolute; left:8px; top:8px; width:40px; height:14px;
    background:linear-gradient(180deg,#f2c94c,#e8b83a);
    border-radius:20px 20px 6px 30px;
  }
  .gal .peace{ position:absolute; right:-10px; bottom:-4px; font-size:18px; transform:rotate(12deg); }
  .gal.talk{ animation:galBob .35s ease; }
  @keyframes galBob{ 40%{ transform:translateY(-4px) rotate(-3deg); } }
  .gal.tsukkomi{ animation:galTsukkomi .45s ease; }
  @keyframes galTsukkomi{ 20%{ transform:translateX(-4px) rotate(-8deg); } 60%{ transform:translateX(4px) rotate(6deg); } }

  #galBubble{
    position:relative;
    flex:1;
    background:#fff5fa;
    color:#4a2a3a;
    border:2px solid var(--gal-pink);
    border-radius:16px;
    padding:8px 12px;
    font-size:14px; font-weight:800; line-height:1.4;
    min-height:40px;
    margin-bottom:6px;
  }
  #galBubble::before{
    content:""; position:absolute; left:-9px; bottom:12px;
    border-right:9px solid var(--gal-pink);
    border-top:6px solid transparent; border-bottom:6px solid transparent;
  }
  #galBubble .name{ display:block; font-size:10px; color:var(--gal-pink); font-weight:800; letter-spacing:1px; }
  #galBubble.pop{ animation:bubblePop .25s ease; }
  @keyframes bubblePop{ 0%{ transform:scale(.92); } 100%{ transform:scale(1); } }

  /* ===== ボタン ===== */
  #controls{
    display:flex; gap:10px;
    padding:8px 12px calc(12px + env(safe-area-inset-bottom));
  }
  .actionBtn{
    flex:1;
    padding:12px 6px;
    border:none; border-radius:16px;
    font-size:15px; font-weight:800; color:#fff;
    font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    box-shadow:0 5px 0 rgba(0,0,0,.35);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .actionBtn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.35); }
  .actionBtn .sub{ font-size:10.5px; font-weight:500; opacity:.85; }
  #emoBtn{ background:linear-gradient(135deg,var(--emotion-color),#a83349); }
  #cutBtn{ flex:0 0 80px; background:linear-gradient(135deg,#6a7385,#4a5263); }
  #factBtn{ background:linear-gradient(135deg,var(--fact-color),#1c8f79); }

  /* ===== はじまり・結果 ===== */
  .overlay{
    position:fixed; inset:0;
    background:rgba(10,12,18,.94);
    display:none; flex-direction:column; align-items:center;
    z-index:50; padding:16px;
    overflow-y:auto; touch-action:pan-y;
  }
  .overlay.show{ display:flex; }
  .overlayInner{ margin:auto 0; width:100%; max-width:360px; text-align:center; }
  .title{
    font-size:24px; font-weight:900; margin:0 0 4px;
    background:linear-gradient(90deg,var(--emotion-color),var(--accent),var(--fact-color));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .galIntro{ display:flex; align-items:center; gap:10px; justify-content:center; margin:12px 0 4px; }
  .galIntro .say{
    text-align:left; background:#fff5fa; color:#4a2a3a; border:2px solid var(--gal-pink);
    border-radius:14px; padding:8px 12px; font-size:13px; font-weight:800; line-height:1.5;
  }
  .howto{
    text-align:left; font-size:13px; line-height:1.9;
    background:#ffffff0c; border-radius:14px; padding:10px 14px; margin:12px 0;
  }
  .howto .k{ display:inline-block; min-width:64px; font-weight:800; }
  .howto .k.e{ color:var(--emotion-color); }
  .howto .k.f{ color:var(--fact-color); }
  .howto .k.c{ color:#b8bfcc; }
  .best{ font-size:12.5px; color:var(--text-sub); margin-bottom:14px; }
  .mainBtn{
    padding:14px 40px; border:none; border-radius:30px;
    background:linear-gradient(135deg,var(--accent),#e0a93a);
    color:#1a1a1a; font-weight:900; font-size:16px; font-family:inherit;
    box-shadow:0 6px 0 #a87a1e; cursor:pointer;
  }
  .mainBtn:active{ transform:translateY(4px); box-shadow:0 2px 0 #a87a1e; }

  #countdown{
    position:absolute; left:50%; top:40%; transform:translate(-50%,-50%);
    font-size:72px; font-weight:900; color:var(--accent);
    z-index:20; pointer-events:none;
  }

  #finalScore{ font-size:52px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1.1; }
  #newBest{
    display:inline-block; margin:6px 0 2px;
    font-size:12px; font-weight:900; letter-spacing:2px; color:#1a1a1a;
    background:var(--accent); padding:3px 12px; border-radius:12px;
  }
  #bestLine{ font-size:12px; color:var(--text-sub); margin-bottom:12px; }
  .stats{ display:flex; gap:8px; justify-content:center; margin-bottom:12px; }
  .stat{ background:var(--card-bg); border-radius:12px; padding:8px 10px; min-width:84px; }
  .stat .n{ font-size:20px; font-weight:900; }
  .stat .l{ font-size:10.5px; color:var(--text-sub); }
  .resultGal{ display:flex; align-items:center; gap:10px; justify-content:center; margin:4px 0 16px; }
  .resultGal .say{
    text-align:left; background:#fff5fa; color:#4a2a3a; border:2px solid var(--gal-pink);
    border-radius:14px; padding:8px 12px; font-size:13.5px; font-weight:800;
  }
</style>
</head>
<body>

<div id="app">
  <div id="hud">
    <div id="scoreBox"><small>SCORE</small><span id="score">0</span></div>
    <div id="comboBox"><b id="combo">0</b>COMBO</div>
    <div id="lives"></div>
  </div>

  <div id="field">
    <div class="sideTag l" id="trashTag">🗑️</div>
    <div class="sideTag r" id="boxTag">📥</div>
    <div id="speedUp">SPEED UP!</div>
    <div id="dangerLine"></div>
  </div>

  <div id="galRow">
    <div class="gal" id="gal"></div>
    <div id="galBubble"><span class="name">ミカ</span><span id="galText">いっしょに仕分けよ〜</span></div>
  </div>

  <div id="controls">
    <button class="actionBtn" id="emoBtn">← 気持ち<span class="sub">手放す</span></button>
    <button class="actionBtn" id="cutBtn">✂<span class="sub">切る</span></button>
    <button class="actionBtn" id="factBtn">事実 →<span class="sub">受け止める</span></button>
  </div>
</div>

<div id="startScreen" class="overlay show">
  <div class="overlayInner">
    <div class="title">事実と感情の仕分け</div>
    <div class="galIntro">
      <div class="gal galStatic"></div>
      <div class="say">ミカだよ〜！<br>となりで見てるから、どんどん仕分けてこ✌️</div>
    </div>
    <div class="howto">
      落ちてくるカードを、下に着く前に仕分けよう。<br>
      <span class="k e">← 左へ</span>気持ち（手放す）<br>
      <span class="k f">右へ →</span>事実（受け止める）<br>
      <span class="k c">↓ 下へ</span>点線のあるカードは ✂ で切って、2枚にしてから仕分ける<br>
      <span style="font-size:11.5px;color:var(--text-sub)">画面のどこでもスワイプ／ボタン／キーボードの ← → ↓</span>
    </div>
    <div class="best" id="startBest"></div>
    <button class="mainBtn" id="startBtn">スタート</button>
  </div>
</div>

<div id="resultScreen" class="overlay">
  <div class="overlayInner">
    <div class="title">おしまい</div>
    <div id="finalScore">0</div>
    <div id="newBest">NEW BEST!</div>
    <div id="bestLine"></div>
    <div class="stats">
      <div class="stat"><div class="n" id="stSorted">0</div><div class="l">仕分けた枚数</div></div>
      <div class="stat"><div class="n" id="stCombo">0</div><div class="l">最大コンボ</div></div>
      <div class="stat"><div class="n" id="stCut">0</div><div class="l">✂ 切った枚数</div></div>
    </div>
    <div class="resultGal">
      <div class="gal galStatic"></div>
      <div class="say" id="comment"></div>
    </div>
    <button class="mainBtn" id="retryBtn">もう一回</button>
  </div>
</div>

<script>
(function(){
  /* =========================================================
     カード（研究の「しんどいシーン」から）
     ========================================================= */
  const FACTS = [
    '今日は客数がいつもより多かった','シフト中、レジ対応に入った','新人スタッフが2人入っていた','電話が閉店間際に3件鳴った','閉店作業が15分遅れた','後輩が1人で品出しをしていた',
    '作業に3時間かけた','新しい技法を1つ試した','締め切りは金曜','色の調整が残っている','試作を2回作り直した','友達に途中経過を見せた',
    '面接は20分だった','質問に3つ答えた','隣の人は留学の話をしていた','発表は8分で終わった','結果は来週わかる','準備に2日かけた',
    '夕飯のときに母と話した','「別にいい」と返事をした','部屋のドアを閉めた','週末に会う約束がある','返信は2時間後に来た','ありがとうと言わなかった',
    '朝7時に起きた','電車が5分遅れた','課題を半分まで書いた','傘を持って出なかった'
  ];
  // たまに出るレアな「超事実」
  const SUPER_FACTS = ['今日も地球は回っていた','今日も朝は来た','お腹は今日もすいた','空はだいたい上にあった','猫は今日も猫だった'];
  const EMOS = [
    '先輩なのに情けない','自分はダメな人間だ','みんなに嫌われたかも','なんで自分だけ要領が悪いんだろう','もう顔を合わせられない',
    'この程度にしかできない','センスがない','時間をかけても意味がない','人に見せるのが恥ずかしい','いつも無計画だ',
    '胸を張れる経験がない','みんな賢そうだった','自分には何もない','絶対落ちた','もっと頑張れたはずなのに',
    '可愛げがない自分が嫌だ','嫌われたかもしれない','素直になれない自分が嫌い','私ってほんと子どもだ','全然成長してない',
    'どうせうまくいかない','また失敗する気がする'
  ];
  // 大げさすぎる思い込み（笑いどころ）
  const BIG_EMOS = ['全人類に嫌われた','もう人生終了','明日から引きこもるしかない','宇宙一ダメな人間だ'];
  const MIXES = [
    ['後輩のフォローに入れなかった','最悪の先輩だ'],['店長に声をかけられた','きっと怒ってる'],['注文を1つ間違えた','いつもこうだ'],
    ['思っていた形にならなかった','才能がない'],['友達が上手な作品を出した','私はだめだ'],['予定より進まなかった','また中途半端'],
    ['最初の質問で言葉に詰まった','もう終わった'],['声が少し震えた','恥ずかしすぎる'],['面接官がメモを取らなかった','興味なかったんだ'],
    ['強い口調で言い返した','最低だ'],['返信が遅かった','怒ってるに違いない'],['感謝を伝えられなかった','冷たい人間だ']
  ];
  const BIG_MIXES = [
    ['店長に声をかけられた','きっと世界が終わる'],['既読がついて1時間たった','もう絶交された'],
    ['プレゼンで1回噛んだ','一生ネタにされる'],['課題の提出がギリギリだった','教授に存在ごと忘れられる']
  ];

  /* =========================================================
     ミカ（ギャル）のセリフ
     決まり：人を評価しない／ツッコむのは解釈で気持ちではない／外しても責めない／説明しない／短く
     ========================================================= */
  const GAL = {
    fact:      ['それな、ただの事実〜','事実確認おけ👌','はい事実〜受け止め完了','それはそう','ふつうに起きたことね','ログ保存〜📝'],
    emo:       ['それ妄想入ってない？ぽいっ','考えすぎ〜バイバイ👋','その解釈、重すぎ〜','いったん捨て捨て','頭の中の声ね、ぽい','盛りすぎ〜笑'],
    cut:       ['くっついてたの分けたのえぐ','事実と気持ち、別居させといた〜','✂さばき神','いい感じに切れた〜','はい分離〜✂'],
    wrongFact: ['待って、それ事実！カメラ映るやつ！','それ捨てちゃダメなやつ〜笑','いやそれ起きたことじゃん笑','📷に映るやつだって〜'],
    wrongEmo:  ['いやそれ想像じゃん笑','それ事実ってことにしちゃう？笑','カメラには映らないやつ〜','それ頭の中の声だよ〜'],
    wrongMix:  ['それ2個混ざってない？✂いこ','点線あるよ〜✂✂','半分事実で半分妄想〜笑'],
    wrongCut:  ['それはもう切れないって笑','切るとこなくない？笑'],
    big:       ['世界は終わんないって笑','スケールでかすぎ笑','それはさすがに盛ってる〜','ないない笑'],
    super:     ['それはガチ','それは誰が見ても事実〜','壮大な事実きた笑'],
    combo:     ['ノってきたじゃん','連続えぐ','止まんないね〜','リズム最高〜🎶'],
    drop:      ['あ、見送った〜 次次','落ちちゃった〜まいっか次','ドンマイ〜次いこ'],
    speed:     ['速くなってきた〜！','ここからが本番っしょ'],
    start:     ['いっしょに仕分けよ〜','いくよ〜✌️','準備おけ？']
  };
  const RESULT_GAL = {
    great: ['手が勝手に動いてたね笑','その速さ、もう職人','仕分けの達人きた〜','迷いなさすぎて笑った'],
    combo: ['コンボつながると気持ちいいよね〜','リズム乗ってたね🎶','連続仕分け、見てて楽しかった'],
    cut:   ['✂さばき、キレてた','切り分けうますぎ〜','点線、見逃さなかったね'],
    normal:['次はもっといけそうじゃない？','慣れるとどんどん速くなるよ〜','もう1回いこ✌️','いい準備運動だった〜']
  };

  /* 自己ベスト（この端末に保存） */
  const SAVE_KEY = 'factEmotionArcade_v1';
  function loadSave(){
    try{ return Object.assign({ best:0, plays:0 }, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); }
    catch(e){ return { best:0, plays:0 }; }
  }
  function writeSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
  let save = loadSave();

  function rand(a,b){ return a + Math.random()*(b-a); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  const field = document.getElementById('field');
  const scoreEl = document.getElementById('score');
  const comboBox = document.getElementById('comboBox');
  const comboEl = document.getElementById('combo');
  const livesEl = document.getElementById('lives');
  const speedUp = document.getElementById('speedUp');
  const startScreen = document.getElementById('startScreen');
  const resultScreen = document.getElementById('resultScreen');
  const galEl = document.getElementById('gal');
  const galBubble = document.getElementById('galBubble');
  const galText = document.getElementById('galText');
  const trashTag = document.getElementById('trashTag');
  const boxTag = document.getElementById('boxTag');

  const MAX_LIVES = 3;

  /* ===== ミカを描く ===== */
  function drawGal(el){
    el.innerHTML = '<div class="hair"></div><div class="face"><div class="eye l"></div><div class="eye r"></div><div class="cheek l"></div><div class="cheek r"></div><div class="mouth"></div></div><div class="bang"></div><div class="peace">✌️</div>';
  }
  drawGal(galEl);
  document.querySelectorAll('.galStatic').forEach(drawGal);

  let lastLine = '';
  let galLock = 0;   // ツッコミを少しの間ほかのセリフで上書きしない
  function galSay(kind, force){
    const now = performance.now();
    if(!force && now < galLock) return;
    let line = pick(GAL[kind]);
    if(line === lastLine) line = pick(GAL[kind]);
    lastLine = line;
    galText.textContent = line;
    galBubble.classList.remove('pop'); void galBubble.offsetWidth; galBubble.classList.add('pop');
    const tsukkomi = kind.startsWith('wrong') || kind === 'big';
    galEl.classList.remove('talk','tsukkomi'); void galEl.offsetWidth;
    galEl.classList.add(tsukkomi ? 'tsukkomi' : 'talk');
    if(tsukkomi) galLock = now + 1100;
  }

  /* =========================================================
     状態
     ========================================================= */
  let cards = [];
  let running = false;
  let score = 0, combo = 0, maxCombo = 0, lives = MAX_LIVES;
  let sorted = 0, cuts = 0;
  let elapsed = 0, spawnTimer = 0, level = 1;
  let lastTs = null, rafId = null;
  let recent = [];

  function fallSpeed(){ return 46 + elapsed * 1.6; }               // px/秒（だんだん速く）
  function spawnInterval(){ return Math.max(0.85, 2.3 - elapsed * 0.025); }

  function renderLives(){
    livesEl.innerHTML = '';
    for(let i=0;i<MAX_LIVES;i++){
      const s = document.createElement('span');
      s.textContent = '❤';
      s.style.color = '#ff5a7a';
      if(i >= lives) s.className = 'lost';
      livesEl.appendChild(s);
    }
  }
  function renderScore(){ scoreEl.textContent = score.toLocaleString(); }
  function renderCombo(){
    comboEl.textContent = combo;
    comboBox.classList.toggle('on', combo >= 2);
    comboBox.classList.remove('pop'); void comboBox.offsetWidth; comboBox.classList.add('pop');
  }

  /* ===== カード生成 ===== */
  function nextData(){
    // 超事実はまれに
    if(Math.random() < 0.04){
      const t = pick(SUPER_FACTS);
      if(!recent.includes(t)){ recent.push(t); return { type:'fact', super:true, text:t, key:t }; }
    }
    // 混ざりカードは時間とともに少しずつ増える
    const mixRate = Math.min(0.32, 0.12 + elapsed * 0.004);
    for(let tries=0; tries<10; tries++){
      const r = Math.random();
      const big = Math.random() < 0.15;   // ときどき大げさな思い込み
      let d;
      if(r < mixRate){
        const m = big ? pick(BIG_MIXES) : pick(MIXES);
        d = { type:'mix', fact:m[0], emo:m[1], key:m[0] + m[1], big };
      } else if(r < mixRate + (1 - mixRate)/2){
        const t = pick(FACTS); d = { type:'fact', text:t, key:t };
      } else {
        const t = big ? pick(BIG_EMOS) : pick(EMOS); d = { type:'emo', text:t, key:t, big };
      }
      if(!recent.includes(d.key)){
        recent.push(d.key);
        if(recent.length > 12) recent.shift();
        return d;
      }
    }
    return { type:'fact', text:pick(FACTS), key:'' };
  }

  function spawnCard(){
    const d = nextData();
    const el = document.createElement('div');
    el.className = 'fcard' + (d.type === 'mix' ? ' mix' : '') + (d.super ? ' super' : '');
    if(d.type === 'mix'){
      el.innerHTML = '<span class="half"></span><span class="cut"></span><span class="half"></span>';
      const halves = el.querySelectorAll('.half');
      // 事実が上とは限らない
      const factFirst = Math.random() < 0.75;
      halves[0].textContent = factFirst ? d.fact : d.emo;
      halves[1].textContent = factFirst ? d.emo : d.fact;
      d.factFirst = factFirst;
    } else {
      el.appendChild(document.createTextNode(d.text));
    }
    field.appendChild(el);
    const c = { data:d, el, y: -el.offsetHeight - 10, h: el.offsetHeight, done:false };
    el.style.top = c.y + 'px';
    cards.push(c);
    updateActive();
  }

  // ✂ で切れた1枚を、ふつうのカードとして場に出す
  function addPieceCard(d, edgeClass){
    const el = document.createElement('div');
    el.className = 'fcard split ' + edgeClass;
    el.appendChild(document.createTextNode(d.text));
    field.appendChild(el);
    const c = { data:d, el, y:0, h: el.offsetHeight, done:false };
    cards.push(c);
    return c;
  }

  // いちばん下まで来ているカードが操作対象
  function activeCard(){
    let best = null;
    cards.forEach(c => { if(!c.done && (!best || c.y > best.y)) best = c; });
    return best;
  }
  function updateActive(){
    const a = activeCard();
    cards.forEach(c => c.el.classList.toggle('active', c === a));
  }

  /* ===== 操作 ===== */
  function act(choice){
    if(!running) return;
    const c = activeCard();
    if(!c) return;
    const t = c.data.type;
    const ok = (choice === 'fact' && t === 'fact') || (choice === 'emo' && t === 'emo') || (choice === 'cut' && t === 'mix');

    if(!ok){
      // 外したら：赤くせず「ぽよん」と戻り、ミカが笑ってツッコむ。コンボは静かにリセット
      combo = 0;
      renderCombo();
      c.el.classList.remove('boing'); void c.el.offsetWidth; c.el.classList.add('boing');
      if(t === 'mix') galSay('wrongMix', true);
      else if(choice === 'cut') galSay('wrongCut', true);
      else if(t === 'fact') galSay('wrongFact', true);
      else galSay('wrongEmo', true);
      if(navigator.vibrate) navigator.vibrate(15);
      return;
    }

    c.done = true;
    c.el.classList.remove('active');   // 飛んでいく途中のカードは操作対象の枠を外す
    combo++;
    maxCombo = Math.max(maxCombo, combo);
    if(t !== 'mix') sorted++;
    const mult = 1 + Math.floor(combo / 5);
    const base = t === 'mix' ? 150 : c.data.super ? 300 : 100;
    // 下に近いほど少しだけボーナス（ギリギリまで待つ楽しさ）
    const edge = Math.max(0, Math.round((c.y / field.clientHeight) * 20) * 5);
    const gained = (base + edge) * mult;
    score += gained;
    renderScore();
    renderCombo();
    showPts(c, `+${gained}${mult > 1 ? ' ×' + mult : ''}`, t === 'fact' ? 'var(--fact-color)' : t === 'emo' ? 'var(--emotion-color)' : 'var(--accent)');
    if(navigator.vibrate) navigator.vibrate(12);

    // ミカのひとこと
    if(c.data.big && t !== 'mix') galSay('big', true);
    else if(c.data.super) galSay('super', true);
    else if(combo > 0 && combo % 5 === 0) galSay('combo');
    else galSay(t === 'mix' ? 'cut' : t);

    if(t === 'mix'){
      cuts++;
      sliceCard(c);
    } else if(t === 'fact'){
      c.el.classList.add('fly');
      c.el.style.transform = 'translateX(-50%) translateX(420px) rotate(25deg)';
      bump(boxTag);
      setTimeout(() => c.el.remove(), 380);
    } else {
      crumple(c);
    }
    cards = cards.filter(x => x !== c);
    updateActive();
  }

  // 手放したカードは丸めてゴミ箱へシュート
  function crumple(c){
    const fr = field.getBoundingClientRect(), tr = trashTag.getBoundingClientRect(), cr = c.el.getBoundingClientRect();
    const dx = (tr.left + tr.width/2) - (cr.left + cr.width/2);
    const dy = (tr.top + tr.height/2) - (cr.top + cr.height/2);
    c.el.classList.add('crumple');
    c.el.style.transform = `translateX(-50%) translate(${dx}px, ${dy}px) scale(.18) rotate(-540deg)`;
    setTimeout(() => bump(trashTag), 380);
    setTimeout(() => c.el.remove(), 720);
  }
  function bump(tag){
    tag.classList.remove('gulp'); void tag.offsetWidth; tag.classList.add('gulp');
  }

  // ✂ 切ると、事実と気持ちの2枚に分かれて、そのまま落ちてくる。それぞれをあらためて仕分ける
  function sliceCard(c){
    c.el.remove();
    const fact = { type:'fact', text:c.data.fact, key:'' };
    const emo  = { type:'emo',  text:c.data.emo,  key:'', big:c.data.big };
    const top = c.data.factFirst ? fact : emo, bottom = c.data.factFirst ? emo : fact;
    const upper = addPieceCard(top, 'cutBottom');
    const lower = addPieceCard(bottom, 'cutTop');
    // 少しだけ持ち上げて、仕分ける間をつくる
    lower.y = Math.max(0, c.y + c.h - lower.h - 24);
    upper.y = lower.y - upper.h - 10;
    upper.el.style.top = upper.y + 'px';
    lower.el.style.top = lower.y + 'px';
  }

  function showPts(c, text, color){
    const p = document.createElement('div');
    p.className = 'pts';
    p.textContent = text;
    p.style.color = color;
    p.style.left = (field.clientWidth / 2) + 'px';
    p.style.top = Math.max(20, c.y) + 'px';
    field.appendChild(p);
    setTimeout(() => p.remove(), 700);
  }

  // 画面のどこでもスワイプ
  let sx = 0, sy = 0, swiping = false;
  field.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; swiping = true; });
  window.addEventListener('pointerup', e => {
    if(!swiping) return;
    swiping = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
    if(Math.abs(dx) > Math.abs(dy)) act(dx > 0 ? 'fact' : 'emo');
    else if(dy > 0) act('cut');
  });
  document.getElementById('emoBtn').addEventListener('click', () => act('emo'));
  document.getElementById('factBtn').addEventListener('click', () => act('fact'));
  document.getElementById('cutBtn').addEventListener('click', () => act('cut'));
  window.addEventListener('keydown', e => {
    if(e.key === 'ArrowLeft'){ e.preventDefault(); act('emo'); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); act('fact'); }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); act('cut'); }
  });

  /* ===== ループ ===== */
  function loop(ts){
    if(!running) return;
    if(lastTs === null) lastTs = ts;
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    elapsed += dt;

    // 20秒ごとにスピードアップの合図
    const lv = 1 + Math.floor(elapsed / 20);
    if(lv > level){
      level = lv;
      speedUp.classList.remove('show'); void speedUp.offsetWidth; speedUp.classList.add('show');
      galSay('speed');
    }

    spawnTimer -= dt;
    if(spawnTimer <= 0){
      spawnCard();
      spawnTimer = spawnInterval() * rand(0.85, 1.15);
    }

    const v = fallSpeed();
    const floor = field.clientHeight;
    cards.forEach(c => {
      if(c.done) return;
      c.y += v * dt;
      c.el.style.top = c.y + 'px';
      if(c.y + c.h >= floor){
        // 下に着いてしまった
        c.done = true;
        lives--;
        combo = 0;
        renderCombo();
        renderLives();
        c.el.classList.add('dropped');
        setTimeout(() => c.el.remove(), 420);
        galSay('drop', true);
      }
    });
    cards = cards.filter(c => !c.done);
    updateActive();

    if(lives <= 0){ gameOver(); return; }
    rafId = requestAnimationFrame(loop);
  }

  function startGame(){
    startScreen.classList.remove('show');
    resultScreen.classList.remove('show');
    cards.forEach(c => c.el.remove());
    field.querySelectorAll('.piece, .pts, .fcard').forEach(e => e.remove());
    cards = []; recent = [];
    score = 0; combo = 0; maxCombo = 0; lives = MAX_LIVES;
    sorted = 0; cuts = 0; elapsed = 0; spawnTimer = 0; level = 1;
    renderScore(); renderCombo(); renderLives();
    galLock = 0;
    galSay('start', true);

    // 3・2・1
    const cd = document.createElement('div');
    cd.id = 'countdown';
    document.getElementById('app').appendChild(cd);
    let n = 3;
    cd.textContent = n;
    const iv = setInterval(() => {
      n--;
      if(n > 0){ cd.textContent = n; return; }
      clearInterval(iv);
      cd.remove();
      running = true;
      lastTs = null;
      rafId = requestAnimationFrame(loop);
    }, 600);
  }

  function gameOver(){
    running = false;
    cancelAnimationFrame(rafId);
    const isBest = score > save.best;
    save.plays++;
    if(isBest) save.best = score;
    writeSave();

    document.getElementById('finalScore').textContent = score.toLocaleString();
    document.getElementById('newBest').style.display = isBest && score > 0 ? 'inline-block' : 'none';
    document.getElementById('bestLine').textContent = `自己ベスト ${save.best.toLocaleString()}`;
    document.getElementById('stSorted').textContent = sorted;
    document.getElementById('stCombo').textContent = maxCombo;
    document.getElementById('stCut').textContent = cuts;
    let pool = RESULT_GAL.normal;
    if(sorted >= 40) pool = RESULT_GAL.great;
    else if(maxCombo >= 12) pool = RESULT_GAL.combo;
    else if(cuts >= 5) pool = RESULT_GAL.cut;
    document.getElementById('comment').textContent = pick(pool);

    setTimeout(() => resultScreen.classList.add('show'), 500);
    sendResultToPortal();
  }

  // ポータルサイトに埋め込まれている場合、結果を親ウィンドウへ送信する（score は記録用）
  function sendResultToPortal(){
    try{
      window.parent.postMessage({
        type: 'moyamoyaGameResult',
        gameId: 'fact-emotion',
        summary: `スコア ${score.toLocaleString()}（${sorted}枚・最大${maxCombo}コンボ）`,
        detail: { score, sorted, maxCombo, cuts, seconds: Math.round(elapsed) }
      }, '*');
    }catch(e){ /* ポータル外で単体表示している場合は何もしない */ }
  }

  document.getElementById('startBest').textContent = save.best > 0 ? `自己ベスト ${save.best.toLocaleString()}` : '';
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  renderLives();
})();
</script>
</body>
</html>
