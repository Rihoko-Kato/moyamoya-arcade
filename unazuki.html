<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>うなずきロボ</title>
<style>
  :root{
    --bg1:#fdf6f0;
    --bg2:#f3ecf9;
    --header-bg:#eaf4fb;
    --robot-body:#bfe3f0;
    --robot-body-dark:#9cccdf;
    --robot-face:#fdfefe;
    --robot-accent:#ffd6e0;
    --user-bubble:#cdeedd;
    --user-bubble-text:#2f4a3d;
    --bot-bubble:#fff3d6;
    --bot-bubble-text:#5a4a2a;
    --text-main:#5a5a6a;
    --text-sub:#9a95ab;
    --send-btn:#f5b8cf;
    --send-btn-dark:#e491ae;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    font-family:"Hiragino Sans","Yu Gothic","Zen Maru Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:linear-gradient(160deg, var(--bg1), var(--bg2));
    color:var(--text-main);
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }

  #app{
    position:relative;
    width:100%; height:100%;
    max-width:480px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    background:#fffdf9;
    box-shadow:0 0 40px rgba(0,0,0,.06);
  }

  /* ===== ヘッダー：相棒ロボットの大きなアイコン ===== */
  header{
    flex-shrink:0;
    background:var(--header-bg);
    padding:14px 16px 18px;
    text-align:center;
    border-bottom:1px solid #e0eef5;
    position:relative;
    z-index:2;
  }
  header h1{
    font-size:13px;
    letter-spacing:3px;
    color:#7a97a8;
    font-weight:700;
    margin:0 0 10px;
  }

  #robotWrap{
    width:100px; height:100px;
    margin:0 auto;
    perspective:400px;
  }
  #robotIcon{
    position:relative;
    width:100%; height:100%;
    transform-origin:50% 90%;
  }
  #robotIcon.idle{
    animation:idleBreath 3.2s ease-in-out infinite;
  }
  @keyframes idleBreath{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-2px) rotate(0deg); }
  }
  /* 赤べこ風・大げさなうなずきアニメーション */
  #robotIcon.nodding{
    animation:akabekoNod .95s cubic-bezier(.36,.07,.19,.97);
  }
  @keyframes akabekoNod{
    0%{   transform:rotate(0deg)    translateY(0); }
    8%{   transform:rotate(-20deg)  translateY(-8px); }
    18%{  transform:rotate(16deg)   translateY(4px); }
    28%{  transform:rotate(-13deg)  translateY(-5px); }
    38%{  transform:rotate(10deg)   translateY(3px); }
    50%{  transform:rotate(-7deg)   translateY(-2px); }
    62%{  transform:rotate(5deg)    translateY(2px); }
    74%{  transform:rotate(-3deg)   translateY(-1px); }
    86%{  transform:rotate(2deg)    translateY(1px); }
    100%{ transform:rotate(0deg)    translateY(0); }
  }

  /* ロボット本体 */
  .r-antenna{
    position:absolute; left:50%; top:-14px;
    width:4px; height:16px;
    margin-left:-2px;
    background:var(--robot-body-dark);
    border-radius:2px;
  }
  .r-antenna::after{
    content:"";
    position:absolute; left:50%; top:-8px;
    width:12px; height:12px;
    margin-left:-6px;
    background:var(--robot-accent);
    border-radius:50%;
    box-shadow:0 0 8px rgba(255,214,224,.8);
  }
  .r-head{
    position:absolute; left:8%; top:6px;
    width:84%; height:82%;
    background:linear-gradient(160deg,#ffffff, var(--robot-body));
    border:4px solid var(--robot-body-dark);
    border-radius:38px 38px 34px 34px;
    box-shadow:0 8px 16px rgba(120,170,190,.3);
  }
  .r-earL, .r-earR{
    position:absolute; top:30%;
    width:12px; height:22px;
    background:var(--robot-body-dark);
    border-radius:6px;
  }
  .r-earL{ left:-8px; }
  .r-earR{ right:-8px; }
  .r-face{
    position:absolute; left:14%; top:26%;
    width:72%; height:46%;
    background:var(--robot-face);
    border-radius:22px;
    box-shadow:inset 0 3px 8px rgba(150,190,210,.25);
  }
  .r-eyeL, .r-eyeR{
    position:absolute; top:34%;
    width:15px; height:15px;
    background:#4a6a78;
    border-radius:50%;
  }
  .r-eyeL::after, .r-eyeR::after{
    content:"";
    position:absolute; top:3px; left:3px;
    width:5px; height:5px;
    background:#fff;
    border-radius:50%;
  }
  .r-eyeL{ left:22%; }
  .r-eyeR{ right:22%; }
  .r-cheekL, .r-cheekR{
    position:absolute; top:58%;
    width:12px; height:8px;
    background:var(--robot-accent);
    border-radius:50%;
    opacity:.8;
  }
  .r-cheekL{ left:14%; }
  .r-cheekR{ right:14%; }
  .r-mouth{
    position:absolute; left:50%; top:68%;
    width:22px; height:10px;
    margin-left:-11px;
    border-bottom:4px solid #4a6a78;
    border-radius:0 0 16px 16px;
  }

  #statusLabel{
    margin-top:8px;
    font-size:11.5px;
    color:#8aa5b5;
    font-weight:700;
    min-height:14px;
  }

  /* ===== チャットエリア ===== */
  #chatArea{
    flex:1;
    overflow-y:auto;
    padding:16px 14px 10px;
    display:flex;
    flex-direction:column;
    gap:10px;
    -webkit-overflow-scrolling:touch;
  }
  .msgRow{
    display:flex;
    max-width:100%;
    animation:msgIn .28s ease;
  }
  @keyframes msgIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .msgRow.user{ justify-content:flex-end; }
  .msgRow.bot{ justify-content:flex-start; }

  .bubble{
    max-width:74%;
    padding:11px 15px;
    border-radius:20px;
    font-size:14.5px;
    line-height:1.6;
    word-break:break-word;
    box-shadow:0 2px 6px rgba(0,0,0,.06);
  }
  .msgRow.user .bubble{
    background:var(--user-bubble);
    color:var(--user-bubble-text);
    border-bottom-right-radius:6px;
  }
  .msgRow.bot .bubble{
    background:var(--bot-bubble);
    color:var(--bot-bubble-text);
    border-bottom-left-radius:6px;
  }

  /* ===== 入力エリア ===== */
  #inputBar{
    flex-shrink:0;
    display:flex;
    gap:8px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:#fffdf9;
    border-top:1px solid #f0e8da;
  }
  #chatInput{
    flex:1;
    min-width:0;
    padding:12px 16px;
    border-radius:22px;
    border:1.5px solid #e8ddc8;
    background:#fffefb;
    font-size:14px;
    color:var(--text-main);
    font-family:inherit;
    outline:none;
  }
  #chatInput:focus{ border-color:var(--send-btn-dark); }
  #sendBtn{
    flex-shrink:0;
    width:48px; height:48px;
    border:none;
    border-radius:50%;
    background:linear-gradient(160deg, var(--send-btn), var(--send-btn-dark));
    color:#fff;
    font-size:18px;
    box-shadow:0 4px 0 #c96e8e, 0 6px 10px rgba(0,0,0,.15);
    transition:transform .07s ease, box-shadow .07s ease;
    display:flex; align-items:center; justify-content:center;
  }
  #sendBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 #c96e8e; }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>そうかそうか、うなずきロボ</h1>
    <div id="robotWrap">
      <div id="robotIcon" class="idle">
        <div class="r-antenna"></div>
        <div class="r-head">
          <div class="r-earL"></div>
          <div class="r-earR"></div>
          <div class="r-face">
            <div class="r-eyeL"></div>
            <div class="r-eyeR"></div>
            <div class="r-cheekL"></div>
            <div class="r-cheekR"></div>
            <div class="r-mouth"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="statusLabel">今日はどんな一日だった？</div>
  </header>

  <div id="chatArea"></div>

  <div id="inputBar">
    <input id="chatInput" type="text" maxlength="200" placeholder="今日あったことを話してみる…" />
    <button id="sendBtn">➤</button>
  </div>
</div>

<script>
(function(){
  const robotIcon = document.getElementById('robotIcon');
  const statusLabel = document.getElementById('statusLabel');
  const chatArea = document.getElementById('chatArea');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');

  // 絶対にアドバイス・評価を含まない、事実だけを受け止める返答
  const replies = [
    "なるほど",
    "確かに",
    "そういう事実があったんだね",
    "受け止めました",
    "（ただ黙って頷く）"
  ];

  const statusIdle = "今日はどんな一日だった？";
  const statusAfter = [
    "うんうん、聞いてるよ",
    "ちゃんと受け取った",
    "そっか、そっか",
    "話してくれてありがとう"
  ];

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function addMessage(text, who){
    const row = document.createElement('div');
    row.className = 'msgRow ' + who;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function nodRobot(){
    robotIcon.classList.remove('idle');
    robotIcon.classList.remove('nodding');
    void robotIcon.offsetWidth; // 強制リフロー：アニメーションを再スタートさせる
    robotIcon.classList.add('nodding');
  }

  function onNodEnd(e){
    if(e.animationName === 'akabekoNod'){
      robotIcon.classList.remove('nodding');
      robotIcon.classList.add('idle');
    }
  }
  robotIcon.addEventListener('animationend', onNodEnd);

  function sendMessage(){
    const text = chatInput.value.trim();
    if(!text) return;
    chatInput.value = '';

    addMessage(text, 'user');
    nodRobot();
    statusLabel.textContent = pick(statusAfter);

    // 少し間を置いてから、評価もアドバイスもしない一言だけ返す
    setTimeout(() => {
      addMessage(pick(replies), 'bot');
      setTimeout(() => { statusLabel.textContent = statusIdle; }, 1800);
    }, 480);
  }

  sendBtn.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') sendMessage();
  });

  // 最初のひとこと
  setTimeout(() => {
    addMessage('なんでも話していいよ。ここでは何も評価しないから。', 'bot');
  }, 400);
})();
</script>
</body>
</html>
