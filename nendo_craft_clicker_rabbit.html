<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>粘土工作クリッカー（うさぎ）</title>
<style>
  :root{
    --bg1:#f3e6d3;
    --bg2:#e8d4b8;
    --clay:#c97b56;
    --clay-dark:#a15a3a;
    --clay-light:#e6a880;
    --board:#8a6248;
    --board-dark:#5f4230;
    --accent:#e08a3c;
    --accent-dark:#c06a24;
    --text-main:#4a352a;
    --text-sub:#8a6f5c;
    --heat-start:#f4c463;
    --heat-end:#d4623f;
    --time-start:#8fd0e0;
    --time-end:#3f8fc4;
    --match-rise-start:#a8d86a;
    --match-rise-end:#5fa83e;
    --match-fall-start:#e8a05a;
    --match-fall-end:#c9583c;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0;padding:0;height:100%;
    font-family:"Hiragino Sans","Yu Gothic","Zen Maru Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(circle at 20% 15%, #fff3de 0%, transparent 45%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--text-main);
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }

  #app{
    position:relative;
    width:100%;
    height:100%;
    max-width:520px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px 18px 22px;
  }
  #app.shake{ animation:appShake .35s ease; }
  @keyframes appShake{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-6px,2px); }
    40%{ transform:translate(6px,-2px); }
    60%{ transform:translate(-4px,2px); }
    80%{ transform:translate(4px,-1px); }
  }

  header{ width:100%; text-align:center; }
  header h1{
    font-size:16px;
    letter-spacing:2px;
    color:var(--text-sub);
    font-weight:700;
    margin:2px 0 12px;
  }
  header h1::before{ content:"🐰 "; }

  /* 3軸ゲージ共通 */
  #gaugesWrap{ width:100%; display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .gaugeRow{ width:100%; }
  .gaugeLabel{
    display:flex; justify-content:space-between;
    font-size:11px; color:var(--text-sub); font-weight:700; margin-bottom:3px;
  }
  .gaugeLabel .val{ font-variant-numeric:tabular-nums; }
  .gaugeOuter{
    width:100%; height:16px;
    background:#00000014;
    border-radius:12px;
    overflow:hidden;
    border:2px solid #d8bd94;
    position:relative;
  }
  .gaugeInner{
    height:100%; width:0%;
    transition:width .2s ease, background .3s ease;
    position:relative;
  }
  .gaugeInner::after{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(45deg, rgba(255,255,255,.22) 0 7px, transparent 7px 14px);
  }
  #heatBar{ background:linear-gradient(90deg,var(--heat-start),var(--heat-end)); }
  #timeBar{ background:linear-gradient(90deg,var(--time-start),var(--time-end)); }
  #matchBar{ background:linear-gradient(90deg,var(--match-rise-start),var(--match-rise-end)); }
  #matchBar.falling{ background:linear-gradient(90deg,var(--match-fall-start),var(--match-fall-end)); }
  #matchCaption{
    font-size:10.5px; color:var(--text-sub); margin-top:2px; min-height:14px; text-align:right;
  }
  #matchCaption.falling{ color:#c9583c; font-weight:700; }

  /* 作品エリア */
  #boxArea{
    width:100%;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:space-around;
    gap:6px;
    min-height:200px;
  }
  .boxColumn{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .boxColumn .caption{ font-size:12px; color:var(--text-sub); font-weight:700; letter-spacing:1px; }
  .boxStage{ width:150px; height:170px; position:relative; }
  .boxStage::after{
    content:"";
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    width:120px; height:16px;
    background:var(--board);
    border-radius:50%;
    box-shadow:0 3px 0 var(--board-dark);
    z-index:0;
  }

  .creature{ position:absolute; inset:0; }
  .creature .part{
    position:absolute;
    background:radial-gradient(circle at 35% 28%, var(--clay-light), var(--clay) 55%, var(--clay-dark) 100%);
    box-shadow:0 5px 10px rgba(90,50,20,.25), inset 0 0 0 2px rgba(255,255,255,.12);
    z-index:1;
  }
  .earL{ width:18px; height:48px; left:32px; top:2px; border-radius:50% 50% 40% 40%/60% 60% 30% 30%; z-index:0; }
  .earR{ width:18px; height:48px; left:100px; top:2px; border-radius:50% 50% 40% 40%/60% 60% 30% 30%; z-index:0; }
  .head{ width:66px; height:60px; left:42px; top:42px; border-radius:50%; z-index:3; }
  .body{ width:98px; height:78px; left:26px; top:86px; border-radius:50% 50% 46% 46%/58% 58% 42% 42%; z-index:2; }
  .footL{ width:26px; height:16px; left:30px; top:152px; border-radius:50%; z-index:1; }
  .footR{ width:26px; height:16px; left:94px; top:152px; border-radius:50%; z-index:1; }
  .tail{ width:20px; height:20px; left:112px; top:120px; border-radius:50%; z-index:1; }

  .face{
    position:absolute; left:42px; top:42px; width:66px; height:60px;
    z-index:4; pointer-events:none;
  }
  .eye{ position:absolute; width:5px; height:7px; background:#4a352a; border-radius:50%; top:26px; }
  .eyeL{ left:18px; }
  .eyeR{ left:42px; }
  .nose{ position:absolute; width:8px; height:6px; background:#e0708a; border-radius:50%; left:29px; top:33px; }

  #realCreature.falling-wobble .part,
  #realCreature.falling-wobble .face{
    animation: crumbleWobble 1.6s ease-in-out infinite;
  }
  @keyframes crumbleWobble{
    0%,100%{ filter:brightness(1); }
    50%{ filter:brightness(.96); }
  }

  /* ボタン */
  #actionBtn{
    margin-top:12px;
    width:100%; max-width:340px;
    padding:19px 10px;
    border:none; border-radius:20px;
    background:linear-gradient(160deg,var(--accent),var(--accent-dark));
    color:#fff8ec;
    font-size:17px; font-weight:700; letter-spacing:1px;
    box-shadow:0 8px 0 #9c5019, 0 12px 18px rgba(0,0,0,.25);
    transition:transform .07s ease, box-shadow .07s ease, opacity .3s ease;
    -webkit-tap-highlight-color:transparent;
    line-height:1.5;
  }
  #actionBtn:active{ transform:translateY(6px); box-shadow:0 2px 0 #9c5019, 0 4px 8px rgba(0,0,0,.25); }
  #actionBtn:disabled{ opacity:.45; }
  #btnSub{ display:block; font-size:11px; font-weight:400; opacity:.85; margin-top:2px; }
  #btnSub.critical{ color:#fff1c9; font-weight:700; opacity:1; }

  .pop{
    position:absolute; font-size:15px; font-weight:700; color:var(--accent-dark);
    pointer-events:none; animation:popUp .7s ease forwards; z-index:10; white-space:nowrap;
  }
  .pop.critical{ color:#d4623f; font-size:19px; }
  @keyframes popUp{
    0%{ opacity:0; transform:translateY(0) scale(.7); }
    15%{ opacity:1; transform:translateY(-6px) scale(1.05); }
    100%{ opacity:0; transform:translateY(-46px) scale(1); }
  }

  .crumb{
    position:absolute; border-radius:50%; pointer-events:none;
    animation:crumbFall .8s ease-out forwards; z-index:9;
  }
  @keyframes crumbFall{
    0%{ opacity:1; transform:translate(0,0) rotate(0deg); }
    100%{ opacity:0; transform:translate(var(--dx), 60px) rotate(180deg); }
  }

  /* リザルト画面 */
  #resultScreen{
    position:fixed; inset:0;
    background:rgba(60,40,25,.92);
    display:none; align-items:center; justify-content:center; flex-direction:column;
    z-index:50; text-align:center; padding:26px;
  }
  #resultScreen.show{ display:flex; }
  #rankBadge{
    font-size:70px; font-weight:900; color:#ffd76a;
    text-shadow:0 0 20px rgba(255,215,106,.6), 0 6px 0 #9c5019;
    line-height:1; margin-bottom:6px;
    animation:rankPop .5s cubic-bezier(.3,1.6,.4,1);
  }
  @keyframes rankPop{
    0%{ transform:scale(0) rotate(-15deg); opacity:0; }
    70%{ transform:scale(1.15) rotate(4deg); opacity:1; }
    100%{ transform:scale(1) rotate(0); }
  }
  #resultScreen h2{ font-size:22px; color:#fff3de; margin:4px 0 14px; }
  #resultScreen p{ font-size:14px; line-height:2; color:#f0dcc0; max-width:340px; margin:0 0 20px; }
  #resultScreen p strong{ color:#ffd76a; }
  #statsRow{ display:flex; gap:14px; margin-bottom:24px; flex-wrap:wrap; justify-content:center; }
  .statBox{
    background:#00000030; border:1px solid #ffffff22; border-radius:14px;
    padding:11px 16px; min-width:88px;
  }
  .statBox .num{ font-size:20px; font-weight:700; color:#ffd76a; }
  .statBox .label{ font-size:10.5px; color:#e8d3b5; margin-top:2px; }
  .statBox.dim .num{ color:#cbb499; font-size:18px; }
  .statBox.dim .label{ color:#b89e84; }
  #retryBtn{
    padding:14px 36px; border:none; border-radius:30px;
    background:linear-gradient(160deg,#ffd76a,#e0a93a);
    color:#4a2f10; font-weight:700; font-size:15px;
    box-shadow:0 6px 0 #a97c1e, 0 10px 16px rgba(0,0,0,.35);
  }
  #retryBtn:active{ transform:translateY(4px); box-shadow:0 2px 0 #a97c1e; }
</style>
</head>
<body>

<div id="app">
  <header><h1>粘土工作クリッカー</h1></header>

  <div id="gaugesWrap">
    <div class="gaugeRow">
      <div class="gaugeLabel"><span>🔥 熱量ゲージ</span><span class="val" id="heatVal">0%</span></div>
      <div class="gaugeOuter"><div class="gaugeInner" id="heatBar"></div></div>
    </div>
    <div class="gaugeRow">
      <div class="gaugeLabel"><span>⏱ 制限時間</span><span class="val" id="timeVal">20秒</span></div>
      <div class="gaugeOuter"><div class="gaugeInner" id="timeBar" style="width:100%"></div></div>
    </div>
    <div class="gaugeRow">
      <div class="gaugeLabel"><span>🎯 理想との一致度</span><span class="val" id="matchVal">20%</span></div>
      <div class="gaugeOuter"><div class="gaugeInner" id="matchBar"></div></div>
      <div id="matchCaption">少しずつ理想に近づいている…</div>
    </div>
  </div>

  <div id="boxArea">
    <div class="boxColumn">
      <div class="caption">理想のうさぎ</div>
      <div class="boxStage">
        <div class="creature" id="idealCreature">
          <div class="part earL"></div>
          <div class="part earR"></div>
          <div class="part body"></div>
          <div class="part tail"></div>
          <div class="part footL"></div>
          <div class="part footR"></div>
          <div class="part head"></div>
          <div class="face">
            <div class="eye eyeL"></div>
            <div class="eye eyeR"></div>
            <div class="nose"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="boxColumn">
      <div class="caption">現実のうさぎ</div>
      <div class="boxStage">
        <div class="creature" id="realCreature">
          <div class="part earL" data-part="earL"></div>
          <div class="part earR" data-part="earR"></div>
          <div class="part body" data-part="body"></div>
          <div class="part tail" data-part="tail"></div>
          <div class="part footL" data-part="footL"></div>
          <div class="part footR" data-part="footR"></div>
          <div class="part head" data-part="head"></div>
          <div class="face" data-part="face">
            <div class="eye eyeL"></div>
            <div class="eye eyeR"></div>
            <div class="nose"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button id="actionBtn">
    作業を進める
    <span id="btnSub">粘土をこねている…</span>
  </button>
</div>

<div id="resultScreen">
  <div id="rankBadge">S</div>
  <h2>Sランク認定！</h2>
  <p>
    出来上がりの形なんて、誰も見ていない。<br>
    <strong>最後まで試行錯誤したその熱量</strong>こそが、<br>
    この制作でいちばん価値のあるものだ。<br>
    諦めずに手を動かし続けた、その事実が偉い。
  </p>
  <div id="statsRow">
    <div class="statBox">
      <div class="num" id="heatResult">0%</div>
      <div class="label">最終熱量</div>
    </div>
    <div class="statBox">
      <div class="num" id="clickNum">0</div>
      <div class="label">作業回数</div>
    </div>
    <div class="statBox dim">
      <div class="num" id="matchResult">0%</div>
      <div class="label">一致度（気にしない）</div>
    </div>
  </div>
  <button id="retryBtn">また作る</button>
</div>

<script>
(function(){
  const heatBar = document.getElementById('heatBar');
  const heatVal = document.getElementById('heatVal');
  const timeBar = document.getElementById('timeBar');
  const timeVal = document.getElementById('timeVal');
  const matchBar = document.getElementById('matchBar');
  const matchVal = document.getElementById('matchVal');
  const matchCaption = document.getElementById('matchCaption');
  const realCreature = document.getElementById('realCreature');
  const actionBtn = document.getElementById('actionBtn');
  const btnSub = document.getElementById('btnSub');
  const resultScreen = document.getElementById('resultScreen');
  const heatResultEl = document.getElementById('heatResult');
  const clickNumEl = document.getElementById('clickNum');
  const matchResultEl = document.getElementById('matchResult');
  const retryBtn = document.getElementById('retryBtn');
  const app = document.getElementById('app');

  const TIME_LIMIT = 20; // 秒
  const MATCH_FLOOR = 20; // 一致度の下限（ここより下にはいかない）

  const processTexts = [
    "粘土をこねくり回した！","3時間やり続けた！","水加減を調整した！","指の力加減を変えてみた！",
    "ヘラを新調した！","表面のなめらかさを研究した！","先輩の作業を見学した！","崩れた部分を作り直した！",
    "耳の角度を微調整した！","乾燥時間を見直した！","同じ工程を10回繰り返した！","参考動画を見返した！",
    "深呼吸してもう一度挑戦した！","手が疲れても続けた！","諦めずにこね直した！","気合を入れ直した！",
    "勢い余って押しすぎた！","利き手を変えてみた！","作業リズムを変えてみた！","無心になって手を動かした！"
  ];
  const criticalTexts = ["会心の一撃！！","謎のゾーンに入った！！","手が止まらない！！","限界突破の集中力！！"];

  const parts = ['earL','earR','head','body','tail','footL','footR','face'];

  function rand(min, max){ return min + Math.random() * (max - min); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
  function lerp(a,b,t){ return a + (b-a) * t; }

  // ===== 「まだ形のない粘土の塊」としての初期状態（ゲーム開始ごとに少しブレる） =====
  function getBlobState(part){
    const j = () => rand(-4,4);
    switch(part){
      case 'earL':  return { rx:34+j(),  ry:84+j(),  rot:-70+rand(-10,10), sx:0.32, sy:0.30, rad:null };
      case 'earR':  return { rx:-34+j(), ry:84+j(),  rot:70+rand(-10,10),  sx:0.32, sy:0.30, rad:null };
      case 'head':  return { rx:0+j(),   ry:38+j(),  rot:10+rand(-8,8),    sx:0.75, sy:0.68,
                              radArr:[50,50,46,54,55,45,55,45] };
      case 'body':  return { rx:0+j(),   ry:-14+j(), rot:-6+rand(-8,8),    sx:1.12, sy:0.86,
                              radArr:[58,42,55,45,46,58,42,54] };
      case 'tail':  return { rx:-47+j(), ry:-5+j(),  rot:40+rand(-10,10),  sx:0.5, sy:0.5, rad:null };
      case 'footL': return { rx:32+j(),  ry:-35+j(), rot:25+rand(-10,10),  sx:0.5, sy:0.6, rad:null };
      case 'footR': return { rx:-32+j(), ry:-35+j(), rot:-25+rand(-10,10), sx:0.5, sy:0.6, rad:null };
      case 'face':  return { rx:0+j(),   ry:38+j(),  rot:0, sx:0.3, sy:0.3, rad:null };
      default: return { rx:0, ry:0, rot:0, sx:1, sy:1, rad:null };
    }
  }
  // 理想（うさぎそのもの）＝ CSSのベース位置と一致する「変形なし」状態
  const idealHeadRad = [50,50,50,50,50,50,50,50];
  const idealBodyRad = [50,50,46,46,58,58,42,42];
  function getIdealState(part){
    if(part==='head') return { rx:0, ry:0, rot:0, sx:1, sy:1, radArr:idealHeadRad };
    if(part==='body') return { rx:0, ry:0, rot:0, sx:1, sy:1, radArr:idealBodyRad };
    return { rx:0, ry:0, rot:0, sx:1, sy:1, rad:null };
  }

  let blobState = {};
  let idealState = {};
  function initShapeStates(){
    parts.forEach(p => {
      blobState[p] = getBlobState(p);
      idealState[p] = getIdealState(p);
    });
  }
  initShapeStates();

  function radArrToString(arr){
    return `${arr[0]}% ${arr[1]}% ${arr[2]}% ${arr[3]}% / ${arr[4]}% ${arr[5]}% ${arr[6]}% ${arr[7]}%`;
  }

  // t: 0(塊) 〜 最大でも0.88程度(理想側) の間で形状を補間する
  function renderCreatureShape(t, wobble){
    parts.forEach(p => {
      const b = blobState[p];
      const i = idealState[p];
      const n = wobble ? rand(-1,1) * (1-t) * 3 : 0;
      const rx = lerp(b.rx, i.rx, t) + n;
      const ry = lerp(b.ry, i.ry, t) + n*0.8;
      const rot = lerp(b.rot, i.rot, t) + n*1.2;
      const sx = lerp(b.sx, i.sx, t);
      const sy = lerp(b.sy, i.sy, t);
      const el = realCreature.querySelector(`[data-part="${p}"]`);
      if(!el) return;
      el.style.transform = `translate(${rx}px, ${ry}px) rotate(${rot}deg) scale(${sx}, ${sy})`;
      if(b.radArr && i.radArr){
        const arr = b.radArr.map((v,idx) => lerp(v, i.radArr[idx], t) + (wobble ? rand(-1,1)*(1-t)*4 : 0));
        el.style.borderRadius = radArrToString(arr);
      }
    });
  }

  // ===== ゲーム状態 =====
  let heat = 0;
  let match = 0;
  let peakTarget = 0;
  let phase = 'rising'; // 'rising' -> 'falling'
  let clickCount = 0;
  let timeLeft = TIME_LIMIT;
  let timerId = null;
  let ended = false;

  function initRunState(){
    heat = 0;
    match = rand(16, 24);       // 塊の状態にも一応「らしさ」が少し宿っている
    peakTarget = rand(82, 88);  // 85%前後、100%には絶対に届かない上限
    phase = 'rising';
    clickCount = 0;
    timeLeft = TIME_LIMIT;
    ended = false;
  }
  initRunState();

  function updateHeatUI(){
    heat = clamp(heat, 0, 100);
    heatBar.style.width = heat + '%';
    heatVal.textContent = Math.round(heat) + '%';
  }
  function updateMatchUI(){
    match = clamp(match, 18, 100);
    matchBar.style.width = match + '%';
    matchVal.textContent = Math.round(match) + '%';
    if(phase === 'falling'){
      matchBar.classList.add('falling');
      matchCaption.classList.add('falling');
      matchCaption.textContent = '力を入れすぎて、少しずつ崩れてきている…';
    } else {
      matchBar.classList.remove('falling');
      matchCaption.classList.remove('falling');
      matchCaption.textContent = '少しずつ理想に近づいている…';
    }
  }
  function updateTimeUI(){
    const ratio = clamp(timeLeft / TIME_LIMIT, 0, 1);
    timeBar.style.width = (ratio*100) + '%';
    timeVal.textContent = Math.max(0, Math.ceil(timeLeft)) + '秒';
  }

  updateHeatUI();
  updateMatchUI();
  updateTimeUI();
  renderCreatureShape(match/100, false);

  function stepMatch(){
    if(phase === 'rising'){
      const remainRatio = 1 - (match / peakTarget);
      let step = rand(3, 7) * Math.max(0.15, remainRatio);
      match = match + step;
      if(match >= peakTarget){
        match = peakTarget;
        phase = 'falling';
        spawnPop('もう限界かも…！', true);
      }
    } else {
      // 崩れフェーズ：一方的に加速度的に下がるのではなく、ランダムに上下させる
      // （わずかに下がりやすいバイアスは残しつつ、たまに持ち直すこともある）
      const step = rand(-3.5, 5);
      match = match - step;
      match = clamp(match, MATCH_FLOOR, peakTarget - 1);
    }
    updateMatchUI();
  }

  function spawnPop(text, critical){
    const rect = actionBtn.getBoundingClientRect();
    const appRect = app.getBoundingClientRect();
    const pop = document.createElement('div');
    pop.className = 'pop' + (critical ? ' critical' : '');
    pop.textContent = text;
    pop.style.left = (rect.left - appRect.left + rect.width/2 - 30 + (Math.random()*40-20)) + 'px';
    pop.style.top = (rect.top - appRect.top - 6) + 'px';
    app.appendChild(pop);
    setTimeout(() => pop.remove(), 700);
  }

  function spawnCrumbs(count){
    const stageRect = realCreature.getBoundingClientRect();
    const appRect = app.getBoundingClientRect();
    const colors = ['#c97b56','#a15a3a','#e6a880','#8a6248'];
    for(let i=0;i<count;i++){
      const c = document.createElement('div');
      c.className = 'crumb';
      const size = 3 + Math.random()*6;
      c.style.width = size+'px';
      c.style.height = size+'px';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.left = (stageRect.left - appRect.left + stageRect.width/2 + (Math.random()*70-35)) + 'px';
      c.style.top = (stageRect.top - appRect.top + stageRect.height/2 + (Math.random()*40-20)) + 'px';
      c.style.setProperty('--dx', (Math.random()*70-35)+'px');
      app.appendChild(c);
      setTimeout(() => c.remove(), 800);
    }
  }

  function onClick(){
    if(ended) return;
    clickCount++;

    // 熱量：毎回ばらつきつつ着実に上昇（クリア条件ではなく純粋な指標）
    let step;
    const roll = Math.random();
    if(roll < 0.1) step = rand(1, 3);
    else if(roll < 0.85) step = rand(3, 7);
    else step = rand(8, 14);
    heat = clamp(heat + step, 0, 100);
    updateHeatUI();

    // 一致度：85%前後まで上がり、その後は必ず崩れていく
    stepMatch();

    // 見た目を一致度に応じて再描画
    renderCreatureShape(match/100, true);
    if(phase === 'falling'){
      realCreature.classList.add('falling-wobble');
    }

    // 演出
    const crumbCount = 3 + Math.floor(Math.random()*5);
    spawnCrumbs(crumbCount);

    const isCritical = Math.random() < 0.14;
    if(isCritical){
      const t = pick(criticalTexts);
      spawnPop(t, true);
      btnSub.textContent = t;
      btnSub.classList.add('critical');
      app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake');
    } else {
      spawnPop('+熱量!', false);
      btnSub.textContent = pick(processTexts);
      btnSub.classList.remove('critical');
    }

    actionBtn.style.transform = 'scale(.97)';
    setTimeout(() => { actionBtn.style.transform = ''; }, 90);
  }

  function tickTimer(){
    if(ended) return;
    timeLeft -= 0.1;
    updateTimeUI();
    if(timeLeft <= 0){
      timeLeft = 0;
      updateTimeUI();
      endGame();
    }
  }

  function endGame(){
    ended = true;
    clearInterval(timerId);
    actionBtn.disabled = true;
    setTimeout(finishGame, 350);
  }

  function finishGame(){
    heatResultEl.textContent = Math.round(heat) + '%';
    clickNumEl.textContent = clickCount;
    matchResultEl.textContent = Math.round(match) + '%';
    resultScreen.classList.add('show');
    sendResultToPortal();
  }

  // ポータルサイトに埋め込まれている場合、結果を親ウィンドウへ送信する
  function sendResultToPortal(){
    try{
      window.parent.postMessage({
        type: 'moyamoyaGameResult',
        gameId: 'clay-rabbit',
        summary: `熱量${Math.round(heat)}% / 一致度${Math.round(match)}%（${clickCount}回作業）`,
        detail: { heat: Math.round(heat), match: Math.round(match), clicks: clickCount }
      }, '*');
    }catch(e){ /* ポータル外で単体表示している場合は何もしない */ }
  }

  function resetGame(){
    clearInterval(timerId);
    initRunState();
    initShapeStates();
    updateHeatUI();
    updateMatchUI();
    updateTimeUI();
    renderCreatureShape(match/100, false);
    realCreature.classList.remove('falling-wobble');
    btnSub.textContent = '粘土をこねている…';
    btnSub.classList.remove('critical');
    resultScreen.classList.remove('show');
    actionBtn.disabled = false;
    timerId = setInterval(tickTimer, 100);
  }

  actionBtn.addEventListener('click', onClick);
  retryBtn.addEventListener('click', resetGame);

  timerId = setInterval(tickTimer, 100);
})();
</script>
</body>
</html>
