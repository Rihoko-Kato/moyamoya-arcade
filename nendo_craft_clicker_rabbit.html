<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>粘土工作クリッカー（うさぎ）</title>
<style>
  :root{
    --bg1:#f3e6d3;
    --bg2:#e8d4b8;
    --clay:#c97b56;
    --clay-dark:#a15a3a;
    --clay-light:#e6a880;
    --board:#8a6248;
    --board-dark:#5f4230;
    --accent:#e08a3c;
    --accent-dark:#c06a24;
    --text-main:#4a352a;
    --text-sub:#8a6f5c;
    --heat-start:#f4c463;
    --heat-end:#d4623f;
    --match-rise-start:#a8d86a;
    --match-rise-end:#5fa83e;
    --match-fall-start:#c9a8f0;
    --match-fall-end:#9a7ad8;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0;padding:0;height:100%;
    font-family:"Hiragino Sans","Yu Gothic","Zen Maru Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(circle at 20% 15%, #fff3de 0%, transparent 45%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--text-main);
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }

  #app{
    position:relative;
    width:100%;
    height:100%;
    max-width:520px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:12px 16px 16px;
  }
  #app.shake{ animation:appShake .35s ease; }
  @keyframes appShake{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-6px,2px); }
    40%{ transform:translate(6px,-2px); }
    60%{ transform:translate(-4px,2px); }
    80%{ transform:translate(4px,-1px); }
  }

  header{
    width:100%;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin-bottom:8px;
  }
  header h1{
    font-size:14px;
    letter-spacing:1px;
    color:var(--text-sub);
    font-weight:700;
    margin:0;
    white-space:nowrap;
  }
  header h1::before{ content:"🐰 "; }
  #headRight{ display:flex; align-items:center; gap:8px; }
  #timeVal{
    font-size:13px; font-weight:800; color:var(--text-main);
    background:#ffffff80; padding:4px 10px; border-radius:12px;
    font-variant-numeric:tabular-nums;
  }
  .smallBtn{
    border:2px solid #d8bd94; background:#fff8ec; color:var(--text-main);
    border-radius:14px; padding:4px 10px; font-size:12px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }

  /* 粘土の色えらび */
  #colorRow{
    width:100%;
    display:flex; align-items:center; gap:6px;
    font-size:11px; color:var(--text-sub); font-weight:700;
    margin-bottom:8px;
    min-height:24px;
  }
  .swatch{
    width:22px; height:22px; border-radius:50%;
    border:2px solid #ffffffaa;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
    cursor:pointer;
  }
  .swatch.selected{ outline:3px solid var(--accent); outline-offset:1px; }
  #colorRow.locked .swatch{ cursor:default; opacity:.6; }
  #colorName{ margin-left:2px; }

  /* ゲージ */
  #gaugesWrap{ width:100%; display:flex; flex-direction:column; gap:6px; margin-bottom:6px; }
  .gaugeRow{ width:100%; }
  .gaugeLabel{
    display:flex; justify-content:space-between;
    font-size:11px; color:var(--text-sub); font-weight:700; margin-bottom:3px;
  }
  .gaugeLabel .val{ font-variant-numeric:tabular-nums; }
  .gaugeOuter{
    width:100%; height:14px;
    background:#00000014;
    border-radius:12px;
    overflow:hidden;
    border:2px solid #d8bd94;
    position:relative;
  }
  .gaugeInner{
    height:100%; width:0%;
    transition:width .2s ease, background .3s ease;
    position:relative;
  }
  .gaugeInner::after{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(45deg, rgba(255,255,255,.22) 0 7px, transparent 7px 14px);
  }
  #heatBar{ background:linear-gradient(90deg,var(--heat-start),var(--heat-end)); }
  #matchBar{ background:linear-gradient(90deg,var(--match-rise-start),var(--match-rise-end)); }
  #matchBar.quirky{ background:linear-gradient(90deg,var(--match-fall-start),var(--match-fall-end)); }
  #matchCaption{
    font-size:10.5px; color:var(--text-sub); margin-top:2px; min-height:14px; text-align:right;
  }
  #matchCaption.quirky{ color:#8a5fc8; font-weight:700; }

  /* 作品エリア */
  #boxArea{
    width:100%;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:space-around;
    gap:6px;
    min-height:180px;
  }
  .boxColumn{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .boxColumn .caption{ font-size:12px; color:var(--text-sub); font-weight:700; letter-spacing:1px; }
  .boxStage{ width:150px; height:170px; position:relative; }
  .boxStage::after{
    content:"";
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    width:120px; height:16px;
    background:var(--board);
    border-radius:50%;
    box-shadow:0 3px 0 var(--board-dark);
    z-index:0;
  }

  .creature{ position:absolute; inset:0; }
  .creature .part{
    position:absolute;
    background:radial-gradient(circle at 35% 28%, var(--clay-light), var(--clay) 55%, var(--clay-dark) 100%);
    box-shadow:0 5px 10px rgba(90,50,20,.25), inset 0 0 0 2px rgba(255,255,255,.12);
    z-index:1;
  }
  .earL{ width:18px; height:48px; left:32px; top:2px; border-radius:50% 50% 40% 40%/60% 60% 30% 30%; z-index:0; }
  .earR{ width:18px; height:48px; left:100px; top:2px; border-radius:50% 50% 40% 40%/60% 60% 30% 30%; z-index:0; }
  .head{ width:66px; height:60px; left:42px; top:42px; border-radius:50%; z-index:3; }
  .body{ width:98px; height:78px; left:26px; top:86px; border-radius:50% 50% 46% 46%/58% 58% 42% 42%; z-index:2; }
  .footL{ width:26px; height:16px; left:30px; top:152px; border-radius:50%; z-index:1; }
  .footR{ width:26px; height:16px; left:94px; top:152px; border-radius:50%; z-index:1; }
  .tail{ width:22px; height:22px; left:117px; top:114px; border-radius:50%; z-index:1; }
  .creature .part.earL, .creature .part.earR{ z-index:0; }
  .creature .part.head{ z-index:3; }
  .creature .part.body{ z-index:2; }
  .creature .part.tail{ z-index:2; } /* からだより手前に出して、しっぽの個性が見えるように */

  .face{
    position:absolute; left:42px; top:42px; width:66px; height:60px;
    z-index:4; pointer-events:none;
  }
  .eye{ position:absolute; width:5px; height:7px; background:#4a352a; border-radius:50%; top:26px; }
  .eyeL{ left:18px; }
  .eyeR{ left:42px; }
  .nose{ position:absolute; width:8px; height:6px; background:#e0708a; border-radius:50%; left:29px; top:33px; }

  /* こねる場所ボタン */
  #partBtns{
    width:100%; max-width:400px;
    display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;
    margin-top:8px;
  }
  .partBtn{
    position:relative;
    padding:12px 4px 10px;
    border:none; border-radius:16px;
    background:linear-gradient(160deg,var(--accent),var(--accent-dark));
    color:#fff8ec;
    font-size:15px; font-weight:800; letter-spacing:1px;
    font-family:inherit;
    box-shadow:0 6px 0 #9c5019, 0 9px 14px rgba(0,0,0,.22);
    transition:transform .07s ease, box-shadow .07s ease, opacity .3s ease;
    -webkit-tap-highlight-color:transparent;
    cursor:pointer;
    line-height:1.3;
  }
  .partBtn .cnt{ display:block; font-size:10px; font-weight:600; opacity:.85; }
  .partBtn:active{ transform:translateY(5px); box-shadow:0 1px 0 #9c5019, 0 3px 6px rgba(0,0,0,.25); }
  .partBtn:disabled{ opacity:.45; }
  #statusLine{
    margin-top:8px; min-height:16px;
    font-size:11.5px; color:var(--text-sub); font-weight:700; text-align:center;
  }
  #statusLine.critical{ color:#d4623f; }

  .pop{
    position:absolute; font-size:15px; font-weight:700; color:var(--accent-dark);
    pointer-events:none; animation:popUp .7s ease forwards; z-index:10; white-space:nowrap;
  }
  .pop.critical{ color:#d4623f; font-size:18px; }
  .pop.quirk{ color:#8a5fc8; }
  @keyframes popUp{
    0%{ opacity:0; transform:translateY(0) scale(.7); }
    15%{ opacity:1; transform:translateY(-6px) scale(1.05); }
    100%{ opacity:0; transform:translateY(-46px) scale(1); }
  }

  .crumb{
    position:absolute; border-radius:50%; pointer-events:none;
    animation:crumbFall .8s ease-out forwards; z-index:9;
  }
  @keyframes crumbFall{
    0%{ opacity:1; transform:translate(0,0) rotate(0deg); }
    100%{ opacity:0; transform:translate(var(--dx), 60px) rotate(180deg); }
  }

  /* リザルト画面・図鑑 共通 */
  .overlay{
    position:fixed; inset:0;
    background:rgba(60,40,25,.94);
    display:none; flex-direction:column; align-items:center;
    z-index:50; text-align:center; padding:16px;
    overflow-y:auto;
  }
  .overlay.show{ display:flex; }
  .overlayInner{ margin:auto 0; width:100%; max-width:380px; }

  #resultScreen .flatReport{
    display:inline-block;
    font-size:12px; color:#cbb499; font-weight:700;
    background:#00000030; border-radius:12px; padding:6px 12px;
    margin-bottom:6px;
  }
  #resultStage{
    width:150px; height:170px; position:relative;
    margin:0 auto 4px;
    animation:rabbitPop .5s cubic-bezier(.3,1.6,.4,1);
  }
  @keyframes rabbitPop{
    0%{ transform:scale(.5); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }
  #resultStage::after{
    content:"";
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    width:120px; height:16px;
    background:var(--board); border-radius:50%;
    box-shadow:0 3px 0 var(--board-dark);
    z-index:0;
  }
  #rabbitNo{ font-size:11px; color:#cbb499; font-weight:700; letter-spacing:1px; }
  #rabbitName{ font-size:17px; color:#fff3de; font-weight:800; margin:2px 0 8px; line-height:1.5; }
  #introLine{ font-size:12.5px; color:#ffd76a; font-weight:700; margin:0 0 10px; }
  .factRow{
    display:flex; align-items:center; gap:10px;
    background:#ffffff14; border:1px solid #ffffff1c;
    border-radius:12px;
    padding:8px 12px;
    margin-bottom:6px;
    text-align:left;
  }
  .factRow.event{ background:#c9a8f022; border-color:#c9a8f055; }
  .factRow .icon{ font-size:18px; }
  .factRow .txt{ font-size:13px; font-weight:700; color:#f0dcc0; line-height:1.5; }
  .factRow .txt b{ color:#ffd76a; font-size:14.5px; }
  #totalLine{ font-size:11.5px; color:#cbb499; margin:10px 0 0; font-weight:700; }
  .btnRow{ display:flex; gap:10px; justify-content:center; margin-top:12px; flex-wrap:wrap; }
  .mainBtn{
    padding:12px 26px; border:none; border-radius:30px;
    background:linear-gradient(160deg,#ffd76a,#e0a93a);
    color:#4a2f10; font-weight:800; font-size:14.5px; font-family:inherit;
    box-shadow:0 5px 0 #a97c1e, 0 8px 14px rgba(0,0,0,.35);
    cursor:pointer;
  }
  .mainBtn:active{ transform:translateY(4px); box-shadow:0 1px 0 #a97c1e; }
  .subBtn{
    padding:12px 20px; border:2px solid #ffffff44; border-radius:30px;
    background:transparent; color:#f0dcc0; font-weight:700; font-size:13.5px; font-family:inherit;
    cursor:pointer;
  }

  /* 図鑑 */
  #zukanScreen{ background:#3a2718; }
  #zukanScreen h2{ font-size:18px; color:#fff3de; margin:4px 0 2px; }
  #zukanSub{ font-size:12px; color:#cbb499; margin-bottom:12px; }
  #zukanGrid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:10px;
    width:100%;
  }
  .zCard{
    background:#ffffff10; border:1px solid #ffffff1c; border-radius:14px;
    padding:6px 6px 8px;
  }
  .zStageWrap{ width:84px; height:96px; margin:0 auto; position:relative; overflow:hidden; }
  .zStage{
    width:150px; height:170px; position:absolute; left:0; top:0;
    transform:scale(.56); transform-origin:0 0;
  }
  .zNo{ font-size:10px; color:#cbb499; font-weight:700; }
  .zName{ font-size:10.5px; color:#f0dcc0; font-weight:700; line-height:1.4; }
  #zukanEmpty{ font-size:13px; color:#cbb499; padding:30px 0; }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>粘土工作クリッカー</h1>
    <div id="headRight">
      <span id="timeVal">⏱ 20秒</span>
      <button class="smallBtn" id="zukanBtn">📖 図鑑</button>
    </div>
  </header>

  <div id="colorRow"></div>

  <div id="gaugesWrap">
    <div class="gaugeRow">
      <div class="gaugeLabel"><span>🔥 熱量</span><span class="val" id="heatVal">0%</span></div>
      <div class="gaugeOuter"><div class="gaugeInner" id="heatBar"></div></div>
    </div>
    <div class="gaugeRow">
      <div class="gaugeLabel"><span>🎯 理想との一致度</span><span class="val" id="matchVal">20%</span></div>
      <div class="gaugeOuter"><div class="gaugeInner" id="matchBar"></div></div>
      <div id="matchCaption">好きなところから、こねてみよう</div>
    </div>
  </div>

  <div id="boxArea">
    <div class="boxColumn">
      <div class="caption">理想のうさぎ</div>
      <div class="boxStage"><div class="creature" id="idealCreature"></div></div>
    </div>
    <div class="boxColumn">
      <div class="caption">いま作ってるうさぎ</div>
      <div class="boxStage"><div class="creature" id="realCreature"></div></div>
    </div>
  </div>

  <div id="partBtns">
    <button class="partBtn" data-group="ears">耳<span class="cnt" id="cnt-ears">0</span></button>
    <button class="partBtn" data-group="head">顔<span class="cnt" id="cnt-head">0</span></button>
    <button class="partBtn" data-group="body">からだ<span class="cnt" id="cnt-body">0</span></button>
    <button class="partBtn" data-group="tail">しっぽ<span class="cnt" id="cnt-tail">0</span></button>
  </div>
  <div id="statusLine">こねた瞬間から20秒スタート</div>
</div>

<div id="resultScreen" class="overlay">
  <div class="overlayInner">
    <div class="flatReport" id="flatReport"></div>
    <div id="resultStage"><div class="creature" id="resultCreature"></div></div>
    <div id="rabbitNo"></div>
    <div id="rabbitName"></div>
    <div id="introLine"></div>
    <div id="factRows"></div>
    <div id="totalLine"></div>
    <div class="btnRow">
      <button class="mainBtn" id="retryBtn">また作る</button>
      <button class="subBtn" id="openZukanBtn">📖 図鑑を見る</button>
    </div>
  </div>
</div>

<div id="zukanScreen" class="overlay">
  <div class="overlayInner" style="max-width:480px;">
    <h2>📖 うさぎ図鑑</h2>
    <div id="zukanSub"></div>
    <div id="zukanGrid"></div>
    <div class="btnRow">
      <button class="subBtn" id="closeZukanBtn">とじる</button>
    </div>
  </div>
</div>

<script>
(function(){
  const app = document.getElementById('app');
  const heatBar = document.getElementById('heatBar');
  const heatVal = document.getElementById('heatVal');
  const timeVal = document.getElementById('timeVal');
  const matchBar = document.getElementById('matchBar');
  const matchVal = document.getElementById('matchVal');
  const matchCaption = document.getElementById('matchCaption');
  const idealCreature = document.getElementById('idealCreature');
  const realCreature = document.getElementById('realCreature');
  const resultCreature = document.getElementById('resultCreature');
  const partBtns = document.querySelectorAll('.partBtn');
  const statusLine = document.getElementById('statusLine');
  const colorRow = document.getElementById('colorRow');
  const resultScreen = document.getElementById('resultScreen');
  const flatReport = document.getElementById('flatReport');
  const rabbitNo = document.getElementById('rabbitNo');
  const rabbitName = document.getElementById('rabbitName');
  const introLine = document.getElementById('introLine');
  const factRows = document.getElementById('factRows');
  const totalLine = document.getElementById('totalLine');
  const retryBtn = document.getElementById('retryBtn');
  const zukanScreen = document.getElementById('zukanScreen');
  const zukanSub = document.getElementById('zukanSub');
  const zukanGrid = document.getElementById('zukanGrid');

  const TIME_LIMIT = 20; // 秒

  const PARTS = ['earL','earR','head','body','tail','footL','footR','face'];
  const PART_GROUP = { earL:'ears', earR:'ears', head:'head', face:'head', body:'body', footL:'body', footR:'body', tail:'tail' };
  const GROUPS = ['ears','head','body','tail'];
  const GROUP_NAME = { ears:'耳', head:'顔', body:'からだ', tail:'しっぽ' };
  const GROUP_WEIGHT = { ears:.2, head:.3, body:.35, tail:.15 };

  /* =========================================================
     粘土の色（作った数で増えていく）
     ========================================================= */
  const COLORS = [
    { id:'terracotta', name:'テラコッタ', from:0,  light:'#e6a880', base:'#c97b56', dark:'#a15a3a' },
    { id:'white',      name:'しろ粘土',   from:3,  light:'#ffffff', base:'#eee6dc', dark:'#c4b8a8' },
    { id:'pink',       name:'さくら',     from:8,  light:'#ffdbe4', base:'#f0a6b8', dark:'#c97a8e' },
    { id:'matcha',     name:'抹茶',       from:15, light:'#d8eab4', base:'#a3c27a', dark:'#74924d' },
    { id:'night',      name:'よぞら',     from:25, light:'#9fb0ee', base:'#5566b8', dark:'#323d80' }
  ];
  function colorById(id){ return COLORS.find(c => c.id === id) || COLORS[0]; }
  function unlockedColors(made){ return COLORS.filter(c => made >= c.from); }
  function applyColor(el, color){
    el.style.setProperty('--clay-light', color.light);
    el.style.setProperty('--clay', color.base);
    el.style.setProperty('--clay-dark', color.dark);
  }

  /* =========================================================
     保存データ（この端末だけ）
     ========================================================= */
  const SAVE_KEY = 'clayRabbit_v1';
  const ZUKAN_MAX = 60;
  function defaultSave(){ return { made:0, kneads:0, color:'terracotta', zukan:[] }; }
  function loadSave(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      return raw ? Object.assign(defaultSave(), JSON.parse(raw)) : defaultSave();
    }catch(e){ return defaultSave(); }
  }
  function writeSave(){
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){ /* 保存できない環境では今回分だけ */ }
  }
  let save = loadSave();
  let currentColor = colorById(save.color);

  /* =========================================================
     道具
     ========================================================= */
  function rand(min, max){ return min + Math.random() * (max - min); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
  function lerp(a,b,t){ return a + (b-a) * t; }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  // うさぎのDOMを組み立てる（理想・制作中・結果・図鑑で共通）
  function buildCreature(container){
    container.innerHTML = `
      <div class="part earL" data-part="earL"></div>
      <div class="part earR" data-part="earR"></div>
      <div class="part body" data-part="body"></div>
      <div class="part tail" data-part="tail"></div>
      <div class="part footL" data-part="footL"></div>
      <div class="part footR" data-part="footR"></div>
      <div class="part head" data-part="head"></div>
      <div class="face" data-part="face">
        <div class="eye eyeL"></div>
        <div class="eye eyeR"></div>
        <div class="nose"></div>
      </div>`;
  }
  function applyShape(container, shape){
    PARTS.forEach(p => {
      const el = container.querySelector(`[data-part="${p}"]`);
      if(!el || !shape[p]) return;
      el.style.transform = shape[p].tf;
      if(shape[p].br) el.style.borderRadius = shape[p].br;
    });
  }

  /* =========================================================
     形のモデル
     - 場所ごとに「理想への近さ t」と「個性 quirk」を持つ
     - こねると t が上がる。上限まで来たら、こねるほど個性が出る
     ========================================================= */
  function getBlobState(part){
    const j = () => rand(-4,4);
    switch(part){
      case 'earL':  return { rx:34+j(),  ry:84+j(),  rot:-70+rand(-10,10), sx:0.32, sy:0.30 };
      case 'earR':  return { rx:-34+j(), ry:84+j(),  rot:70+rand(-10,10),  sx:0.32, sy:0.30 };
      case 'head':  return { rx:0+j(),   ry:38+j(),  rot:10+rand(-8,8),    sx:0.75, sy:0.68, radArr:[50,50,46,54,55,45,55,45] };
      case 'body':  return { rx:0+j(),   ry:-14+j(), rot:-6+rand(-8,8),    sx:1.12, sy:0.86, radArr:[58,42,55,45,46,58,42,54] };
      case 'tail':  return { rx:-47+j(), ry:-5+j(),  rot:40+rand(-10,10),  sx:0.5,  sy:0.5 };
      case 'footL': return { rx:32+j(),  ry:-35+j(), rot:25+rand(-10,10),  sx:0.5,  sy:0.6 };
      case 'footR': return { rx:-32+j(), ry:-35+j(), rot:-25+rand(-10,10), sx:0.5,  sy:0.6 };
      case 'face':  return { rx:0+j(),   ry:38+j(),  rot:0, sx:0.3, sy:0.3 };
      default: return { rx:0, ry:0, rot:0, sx:1, sy:1 };
    }
  }
  const idealHeadRad = [50,50,50,50,50,50,50,50];
  const idealBodyRad = [50,50,46,46,58,58,42,42];
  function getIdealState(part){
    if(part==='head') return { rx:0, ry:0, rot:0, sx:1, sy:1, radArr:idealHeadRad };
    if(part==='body') return { rx:0, ry:0, rot:0, sx:1, sy:1, radArr:idealBodyRad };
    return { rx:0, ry:0, rot:0, sx:1, sy:1 };
  }
  function radArrToString(arr){
    return `${arr[0]}% ${arr[1]}% ${arr[2]}% ${arr[3]}% / ${arr[4]}% ${arr[5]}% ${arr[6]}% ${arr[7]}%`;
  }
  const r1 = v => Math.round(v*10)/10;
  const r3 = v => Math.round(v*1000)/1000;

  // 現在の状態から、各パーツのCSS（transform / border-radius）を計算する
  function computeShape(wobble){
    const shape = {};
    PARTS.forEach(p => {
      const g = PART_GROUP[p];
      const t = prog[g], q = quirk[g];
      const b = blobState[p], i = idealState[p];
      const n = wobble ? rand(-1,1) * (1-t) * 3 : 0;
      let rx = lerp(b.rx, i.rx, t) + n;
      let ry = lerp(b.ry, i.ry, t) + n*0.8;
      let rot = lerp(b.rot, i.rot, t) + n*1.2;
      let sx = lerp(b.sx, i.sx, t);
      let sy = lerp(b.sy, i.sy, t);
      if(p === 'footL' || p === 'footR'){
        rot += q.rot * 0.3;
      } else {
        rot += q.rot;
        sx *= (1 + q.sx);
        sy *= (1 + q.sy);
      }
      if(p === 'earL' || p === 'earR') ry -= q.sy * 18;   // 耳は根元から伸びる
      if(p === 'tail'){             // しっぽは小さいので、個性を大きめに見せる
        sx *= (1 + q.sx * 0.8);
        sy *= (1 + q.sy * 0.8);
        rx += q.sx * 10;
        ry -= q.sy * 10;
      }
      const entry = { tf:`translate(${r1(rx)}px, ${r1(ry)}px) rotate(${r1(rot)}deg) scale(${r3(sx)}, ${r3(sy)})` };
      if(b.radArr && i.radArr){
        const arr = b.radArr.map((v,idx) => r1(lerp(v, i.radArr[idx], t) + (wobble ? rand(-1,1)*(1-t)*4 : 0)));
        entry.br = radArrToString(arr);
      }
      shape[p] = entry;
    });
    return shape;
  }

  /* =========================================================
     名前づけ：できた形の特徴から
     ========================================================= */
  const ROUGH = { ears:'耳がまだ粘土っぽい', head:'顔がぼんやりした', body:'からだが塊のままの', tail:'しっぽがどこかにある' };
  const NEAT  = { ears:'耳がぴんとした', head:'まるい顔の', body:'すわりのいい', tail:'しっぽがふわっとした' };
  const QUIRK_WORDS = {
    ears: { rot:'耳がななめの', syP:'耳がながーい', syN:'耳がちんまりした', sxP:'耳がぶあつい', sxN:'耳がほっそりした' },
    head: { rot:'首をかしげた', syP:'顔がたまご形の', syN:'顔がつぶれ気味の', sxP:'顔がまんまるな', sxN:'顔がほっそりした' },
    body: { rot:'ちょっと傾いた', syP:'すらっとした', syN:'どっしりした', sxP:'ずんぐりした', sxN:'スリムな' },
    tail: { rot:'しっぽが上向きの', syP:'しっぽがでかい', syN:'しっぽがひかえめな', sxP:'しっぽがでかい', sxN:'しっぽがちいさい' }
  };
  const PLAIN = ['のんびりした','どこか見覚えのある','ひかえめな','まじめそうな','ぼーっとした'];

  function quirkMag(q){ return Math.abs(q.rot)/25 + Math.abs(q.sy)/0.4 + Math.abs(q.sx)/0.35; }
  function quirkWord(g){
    const q = quirk[g];
    const dims = [
      { k:'rot', v: g === 'tail' ? 0 : Math.abs(q.rot)/25 }, // 丸いしっぽは回転が見えないので除外
      { k: q.sy >= 0 ? 'syP' : 'syN', v:Math.abs(q.sy)/0.4 },
      { k: q.sx >= 0 ? 'sxP' : 'sxN', v:Math.abs(q.sx)/0.35 }
    ].sort((a,b) => b.v - a.v);
    return QUIRK_WORDS[g][dims[0].k];
  }
  function makeName(){
    const feats = [];
    GROUPS.forEach(g => {
      const t = prog[g], m = quirkMag(quirk[g]);
      if(t < 0.45) feats.push({ g, word:ROUGH[g], score:1 - t });
      else if(m >= 0.45) feats.push({ g, word:quirkWord(g), score:0.4 + m });
      else if(t >= 0.75) feats.push({ g, word:NEAT[g], score:0.3 + Math.random()*0.1 });
    });
    feats.sort((a,b) => b.score - a.score);
    const words = [];
    feats.forEach(f => { if(words.length < 2 && !words.includes(f.word)) words.push(f.word); });
    if(words.length === 0) words.push(pick(PLAIN));
    return words.join('、') + 'うさぎ';
  }

  /* =========================================================
     ゲーム状態
     ========================================================= */
  let blobState = {}, idealState = {};
  let prog = {}, peak = {}, quirk = {}, counts = {};
  let heat = 0, clickCount = 0, critCount = 0;
  let timeLeft = TIME_LIMIT;
  let timerId = null;
  let started = false, ended = false;
  let lastGroup = null;

  function initRun(){
    PARTS.forEach(p => { blobState[p] = getBlobState(p); idealState[p] = getIdealState(p); });
    GROUPS.forEach(g => {
      prog[g] = 0;
      peak[g] = rand(0.84, 0.92);   // 100%には絶対に届かない
      quirk[g] = { rot:0, sx:0, sy:0 };
      counts[g] = 0;
      document.getElementById('cnt-' + g).textContent = '0';
    });
    heat = 0; clickCount = 0; critCount = 0;
    timeLeft = TIME_LIMIT;
    started = false; ended = false;
    lastGroup = null;
    clearInterval(timerId);

    partBtns.forEach(b => b.disabled = false);
    statusLine.textContent = 'こねた瞬間から20秒スタート';
    statusLine.classList.remove('critical');
    matchCaption.textContent = '好きなところから、こねてみよう';
    matchCaption.classList.remove('quirky');
    matchBar.classList.remove('quirky');
    resultScreen.classList.remove('show');

    applyColor(realCreature, currentColor);
    applyColor(idealCreature, currentColor);
    renderColorRow();
    updateHeatUI(); updateMatchUI(); updateTimeUI();
    applyShape(realCreature, computeShape(false));
  }

  function overallT(){
    return GROUPS.reduce((s,g) => s + prog[g] * GROUP_WEIGHT[g], 0);
  }
  function matchPercent(){ return Math.round(20 + overallT() * 75); }

  function updateHeatUI(){
    heat = clamp(heat, 0, 100);
    heatBar.style.width = heat + '%';
    heatVal.textContent = Math.round(heat) + '%';
  }
  function updateMatchUI(){
    const m = matchPercent();
    matchBar.style.width = m + '%';
    matchVal.textContent = m + '%';
  }
  function updateTimeUI(){
    timeVal.textContent = `⏱ ${Math.max(0, Math.ceil(timeLeft))}秒`;
  }

  /* 色えらび（こね始める前だけ変えられる） */
  function renderColorRow(){
    const list = unlockedColors(save.made);
    colorRow.innerHTML = '';
    colorRow.classList.toggle('locked', started);
    if(list.length <= 1){
      colorRow.innerHTML = `<span>粘土：${currentColor.name}</span><span style="opacity:.7">（作るほど色が増える）</span>`;
      return;
    }
    const label = document.createElement('span');
    label.textContent = '粘土：';
    colorRow.appendChild(label);
    list.forEach(c => {
      const sw = document.createElement('div');
      sw.className = 'swatch' + (c.id === currentColor.id ? ' selected' : '');
      sw.style.background = `radial-gradient(circle at 35% 30%, ${c.light}, ${c.base} 60%, ${c.dark})`;
      sw.title = c.name;
      sw.addEventListener('click', () => {
        if(started) return;
        currentColor = c;
        save.color = c.id;
        writeSave();
        applyColor(realCreature, c);
        applyColor(idealCreature, c);
        renderColorRow();
      });
      colorRow.appendChild(sw);
    });
    const nm = document.createElement('span');
    nm.id = 'colorName';
    nm.textContent = currentColor.name;
    colorRow.appendChild(nm);
  }

  /* =========================================================
     こねる
     ========================================================= */
  const processTexts = {
    ears: ['耳の角度を微調整した！','耳の付け根をなでた！','耳を指でつまんだ！','耳の厚みを整えた！','耳の先を丸めた！'],
    head: ['ほっぺをふくらませた！','目の位置を考えた！','おでこをなでた！','鼻の高さを調整した！','顔の丸みを整えた！'],
    body: ['おなかをなでた！','背中のカーブを整えた！','足の位置を直した！','座り方を考えた！','全体のバランスを見た！'],
    tail: ['しっぽを丸めた！','しっぽの位置を探した！','しっぽをふわっとさせた！','しっぽをつまんだ！','しっぽの大きさを考えた！'],
    any:  ['深呼吸してもう一度！','水加減を調整した！','手が疲れても続けた！','無心になって手を動かした！','参考動画を思い出した！']
  };
  const criticalTexts = ['会心の一撃！！','謎のゾーンに入った！！','手が止まらない！！','限界突破の集中力！！'];

  function startTimer(){
    started = true;
    renderColorRow();
    timerId = setInterval(() => {
      if(ended) return;
      timeLeft -= 0.1;
      updateTimeUI();
      if(timeLeft <= 0){
        timeLeft = 0;
        updateTimeUI();
        endGame();
      }
    }, 100);
  }

  function knead(g, btn){
    if(ended) return;
    if(!started) startTimer();
    clickCount++;
    counts[g]++;
    lastGroup = g;
    document.getElementById('cnt-' + g).textContent = counts[g];

    // 熱量：毎回ばらつきつつ着実に上昇（純粋な指標）
    const roll = Math.random();
    const hs = roll < 0.1 ? rand(1,3) : roll < 0.85 ? rand(3,7) : rand(8,14);
    heat = clamp(heat + hs, 0, 100);
    updateHeatUI();

    // 形：上限までは理想に近づき、そこからは個性が出る
    let quirky = false;
    if(prog[g] < peak[g]){
      const remain = 1 - prog[g] / peak[g];
      prog[g] = Math.min(peak[g], prog[g] + rand(0.05, 0.11) * Math.max(0.2, remain));
      if(prog[g] >= peak[g]) spawnPop(btn, `${GROUP_NAME[g]}はもう十分かも`, 'quirk');
    } else {
      quirky = true;
      prog[g] = clamp(prog[g] + rand(-0.03, 0.015), 0.55, peak[g]);
      const q = quirk[g];
      if(g !== 'tail') q.rot = clamp(q.rot + rand(-5, 5), -25, 25); // 丸いしっぽは回転させない
      q.sy  = clamp(q.sy + rand(-0.04, 0.07), -0.3, 0.5);
      q.sx  = clamp(q.sx + rand(-0.04, 0.06), -0.25, 0.4);
    }
    updateMatchUI();
    matchBar.classList.toggle('quirky', quirky);
    matchCaption.classList.toggle('quirky', quirky);
    matchCaption.textContent = quirky
      ? `${GROUP_NAME[g]}に個性が出てきた…`
      : `${GROUP_NAME[g]}が少しずつ理想に近づいている…`;

    applyShape(realCreature, computeShape(true));
    spawnCrumbs(g, 3 + Math.floor(Math.random()*4));

    const isCritical = Math.random() < 0.12;
    if(isCritical){
      critCount++;
      const t = pick(criticalTexts);
      spawnPop(btn, t, 'critical');
      statusLine.textContent = t;
      statusLine.classList.add('critical');
      app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake');
    } else {
      spawnPop(btn, '+熱量!', '');
      statusLine.textContent = Math.random() < 0.75 ? pick(processTexts[g]) : pick(processTexts.any);
      statusLine.classList.remove('critical');
    }
  }

  function spawnPop(btn, text, cls){
    const rect = btn.getBoundingClientRect();
    const appRect = app.getBoundingClientRect();
    const pop = document.createElement('div');
    pop.className = 'pop' + (cls ? ' ' + cls : '');
    pop.textContent = text;
    pop.style.left = (rect.left - appRect.left + rect.width/2 - 24 + (Math.random()*24-12)) + 'px';
    pop.style.top = (rect.top - appRect.top - 8) + 'px';
    app.appendChild(pop);
    setTimeout(() => pop.remove(), 700);
  }

  function spawnCrumbs(g, count){
    const target = realCreature.querySelector(g === 'ears' ? '.earL' : `.${g}`) || realCreature;
    const r = target.getBoundingClientRect();
    const appRect = app.getBoundingClientRect();
    const colors = [currentColor.base, currentColor.dark, currentColor.light];
    for(let i=0;i<count;i++){
      const c = document.createElement('div');
      c.className = 'crumb';
      const size = 3 + Math.random()*6;
      c.style.width = size+'px';
      c.style.height = size+'px';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.left = (r.left - appRect.left + r.width/2 + (Math.random()*40-20)) + 'px';
      c.style.top = (r.top - appRect.top + r.height/2 + (Math.random()*20-10)) + 'px';
      c.style.setProperty('--dx', (Math.random()*60-30)+'px');
      app.appendChild(c);
      setTimeout(() => c.remove(), 800);
    }
  }

  /* =========================================================
     完成 → 図鑑へ
     ========================================================= */
  function endGame(){
    ended = true;
    clearInterval(timerId);
    partBtns.forEach(b => b.disabled = true);
    setTimeout(finishGame, 350);
  }

  function finishGame(){
    const shape = computeShape(false);
    applyShape(realCreature, shape);
    const name = makeName();
    const match = matchPercent();
    const beforeColors = unlockedColors(save.made).length;

    save.made += 1;
    save.kneads += clickCount;
    const entry = {
      no: save.made,
      name,
      color: currentColor.id,
      match,
      heat: Math.round(heat),
      shape,
      date: new Date().toISOString().slice(0,10)
    };
    save.zukan.push(entry);
    if(save.zukan.length > ZUKAN_MAX) save.zukan = save.zukan.slice(-ZUKAN_MAX);
    writeSave();

    const newColors = unlockedColors(save.made).slice(beforeColors);

    // 結果は事実として小さく（グレースケール）
    flatReport.textContent = `理想との一致度 ${match}%（事実）`;
    buildCreature(resultCreature);
    applyColor(resultCreature, currentColor);
    applyShape(resultCreature, shape);
    rabbitNo.textContent = `No.${entry.no}`;
    rabbitName.textContent = `「${name}」`;

    // 意図が伝わるよう、最初の1体だけ一言そえる
    if(save.made === 1){
      introLine.textContent = '理想どおりじゃない形が、このうさぎの形。';
      introLine.style.display = 'block';
    } else {
      introLine.style.display = 'none';
    }

    factRows.innerHTML = '';
    buildLines().forEach(l => factRows.appendChild(makeRow(l, false)));
    newColors.forEach(c => factRows.appendChild(makeRow({ icon:'🎨', text:`新しい粘土「${c.name}」が使えるようになった` }, true)));

    totalLine.textContent = `これまでに ${save.made} 体つくって、${save.kneads} 回こねた`;

    resultScreen.classList.add('show');
    sendResultToPortal(entry);
  }

  // その回のデータから「見てたよ」の言葉を組み立てる（評価語は使わない）
  function buildLines(){
    const n = v => `<b>${v}</b>`;
    const main = pick([
      { icon:'⏱️', text:`${n(TIME_LIMIT)} 秒、手を止めなかった` },
      { icon:'🤲', text:`${n(clickCount)} 回、粘土に触れてた` },
      { icon:'🔥', text:`熱量は ${n(Math.round(heat) + '%')} まで上がってた` }
    ]);
    const extras = [];
    const sorted = GROUPS.slice().sort((a,b) => counts[b] - counts[a]);
    const top = sorted[0];
    if(counts[top] > 0){
      extras.push({ icon:'👀', text:`いちばん時間をかけたのは${GROUP_NAME[top]}（${n(counts[top])} 回）` });
    }
    const untouched = GROUPS.filter(g => counts[g] === 0);
    if(untouched.length === 0){
      extras.push({ icon:'🐰', text:`耳も顔もからだもしっぽも、全部さわってた` });
    } else if(untouched.length < GROUPS.length){
      extras.push({ icon:'🐰', text:`${untouched.map(g => GROUP_NAME[g]).join('と')}は、粘土のままの形を残してた` });
    }
    const quirkyGroups = GROUPS.filter(g => quirkMag(quirk[g]) >= 0.45);
    if(quirkyGroups.length > 0){
      const g = pick(quirkyGroups);
      extras.push({ icon:'✨', text:`${GROUP_NAME[g]}をこねつづけて、形に個性が出た` });
    }
    if(critCount > 0){
      extras.push({ icon:'⚡', text:`${n(critCount)} 回、ゾーンに入ってた` });
    }
    return [main].concat(shuffle(extras).slice(0, 2));
  }

  function makeRow(line, isEvent){
    const row = document.createElement('div');
    row.className = 'factRow' + (isEvent ? ' event' : '');
    const icon = document.createElement('div');
    icon.className = 'icon';
    icon.textContent = line.icon;
    const txt = document.createElement('div');
    txt.className = 'txt';
    txt.innerHTML = line.text; // 数値以外は固定文なので安全
    row.appendChild(icon);
    row.appendChild(txt);
    return row;
  }

  function renderZukan(){
    zukanGrid.innerHTML = '';
    const list = save.zukan.slice().reverse();
    zukanSub.textContent = save.made > 0
      ? `これまでに ${save.made} 体（最新 ${list.length} 体を表示）`
      : '';
    if(list.length === 0){
      zukanGrid.innerHTML = '<div id="zukanEmpty">まだ1体もいません。<br>作ったうさぎはここに並びます。</div>';
      return;
    }
    list.forEach(e => {
      const card = document.createElement('div');
      card.className = 'zCard';
      const wrap = document.createElement('div');
      wrap.className = 'zStageWrap';
      const stageEl = document.createElement('div');
      stageEl.className = 'zStage';
      const cr = document.createElement('div');
      cr.className = 'creature';
      buildCreature(cr);
      applyColor(cr, colorById(e.color));
      applyShape(cr, e.shape);
      stageEl.appendChild(cr);
      wrap.appendChild(stageEl);
      const no = document.createElement('div');
      no.className = 'zNo';
      no.textContent = `No.${e.no}`;
      const nm = document.createElement('div');
      nm.className = 'zName';
      nm.textContent = e.name;
      card.appendChild(wrap);
      card.appendChild(no);
      card.appendChild(nm);
      zukanGrid.appendChild(card);
    });
  }

  // ポータルサイトに埋め込まれている場合、結果を親ウィンドウへ送信する
  function sendResultToPortal(entry){
    try{
      window.parent.postMessage({
        type: 'moyamoyaGameResult',
        gameId: 'clay-rabbit',
        summary: `No.${entry.no}「${entry.name}」が完成（${clickCount}回こねた）`,
        detail: { no: entry.no, name: entry.name, color: entry.color, heat: entry.heat, match: entry.match, clicks: clickCount, counts: Object.assign({}, counts) }
      }, '*');
    }catch(e){ /* ポータル外で単体表示している場合は何もしない */ }
  }

  /* =========================================================
     イベント
     ========================================================= */
  partBtns.forEach(btn => {
    btn.addEventListener('click', () => knead(btn.dataset.group, btn));
  });
  // キーボード：1〜4 で耳・顔・からだ・しっぽ
  window.addEventListener('keydown', (e) => {
    const idx = ['1','2','3','4'].indexOf(e.key);
    if(idx < 0 || ended || resultScreen.classList.contains('show') || zukanScreen.classList.contains('show')) return;
    knead(GROUPS[idx], partBtns[idx]);
  });
  retryBtn.addEventListener('click', initRun);
  function openZukan(){
    if(started && !ended) return; // 制作中は開かない（時間が進んでしまうため）
    renderZukan();
    zukanScreen.classList.add('show');
  }
  document.getElementById('zukanBtn').addEventListener('click', openZukan);
  document.getElementById('openZukanBtn').addEventListener('click', openZukan);
  document.getElementById('closeZukanBtn').addEventListener('click', () => zukanScreen.classList.remove('show'));

  buildCreature(idealCreature);
  buildCreature(realCreature);
  initRun();
})();
</script>
</body>
