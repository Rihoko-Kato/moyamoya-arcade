<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>粘土フィギュア工房</title>
<style>
  :root{
    --bg1:#f3e6d3;
    --bg2:#e8d4b8;
    --clay:#c97b56;
    --clay-dark:#a15a3a;
    --clay-light:#e6a880;
    --board:#8a6248;
    --board-dark:#5f4230;
    --accent:#e08a3c;
    --accent-dark:#c06a24;
    --text-main:#4a352a;
    --text-sub:#8a6f5c;
    --zone-rough:#b8a48e;
    --zone-neat:#7fbf5a;
    --zone-quirk:#a77ad8;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0;padding:0;height:100%;
    font-family:"Hiragino Sans","Yu Gothic","Zen Maru Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(circle at 20% 15%, #fff3de 0%, transparent 45%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--text-main);
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  #app{
    position:relative;
    width:100%; height:100%;
    max-width:520px;
    margin:0 auto;
    display:flex; flex-direction:column; align-items:center;
    padding:8px 12px 12px;
  }

  /* ===== HUD ===== */
  #hud{
    width:100%;
    display:flex; justify-content:space-between; align-items:center;
    font-weight:800;
    margin-bottom:4px;
  }
  #scoreBox{ font-size:20px; font-variant-numeric:tabular-nums; }
  #scoreBox small{ display:block; font-size:10px; color:var(--text-sub); font-weight:600; }
  #zukanBox{ font-size:12px; color:var(--text-sub); text-align:center; }
  #zukanBox b{ font-size:16px; color:var(--text-main); }
  #clock{
    font-size:15px; background:#ffffffa0; padding:4px 12px; border-radius:14px;
    font-variant-numeric:tabular-nums;
  }
  #clock.hurry{ color:#d4423f; animation:hurry .5s ease infinite alternate; }
  @keyframes hurry{ to{ transform:scale(1.08); } }

  /* ===== 今日の棚 ===== */
  #shelf{
    width:100%;
    height:58px;
    display:flex; align-items:flex-end; gap:2px;
    overflow-x:auto; overflow-y:hidden;
    padding:0 4px 6px;
    border-bottom:8px solid var(--board);
    box-shadow:0 3px 0 var(--board-dark);
    border-radius:2px;
    scrollbar-width:none;
  }
  #shelf::-webkit-scrollbar{ display:none; }
  #shelf .empty{ font-size:11px; color:var(--text-sub); margin:auto; }
  .mini{ position:relative; flex-shrink:0; width:40px; height:46px; }
  .mini .creature{ position:absolute; left:0; top:0; width:150px; height:170px; transform:scale(.27); transform-origin:0 0; }
  .mini.new::after{
    content:"新"; position:absolute; top:-2px; right:-2px;
    font-size:9px; font-weight:900; color:#fff; background:#e0708a;
    border-radius:6px; padding:0 3px;
  }
  .mini.arrive{ animation:arrive .4s cubic-bezier(.3,1.6,.4,1); }
  @keyframes arrive{ from{ transform:translateY(-30px) scale(1.4); opacity:0; } to{ transform:none; opacity:1; } }

  /* ===== 作業台 ===== */
  #boxArea{
    width:100%; flex:1;
    display:flex; align-items:center; justify-content:center;
    min-height:150px;
    position:relative;
  }
  .boxStage{ width:150px; height:170px; position:relative; }
  .boxStage::after{
    content:"";
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    width:120px; height:16px;
    background:var(--board);
    border-radius:50%;
    box-shadow:0 3px 0 var(--board-dark);
    z-index:0;
  }
  #rabbitStage.shelve{ animation:shelve .45s ease-in forwards; }
  @keyframes shelve{ to{ transform:translateY(-160px) scale(.3); opacity:0; } }
  #rabbitStage.fresh{ animation:fresh .35s cubic-bezier(.3,1.6,.4,1); }
  @keyframes fresh{ from{ transform:scale(.4); opacity:0; } to{ transform:none; opacity:1; } }
  #nameTag{
    position:absolute; left:50%; bottom:2px; transform:translateX(-50%);
    font-size:11.5px; font-weight:800; color:var(--text-main);
    background:#fffdf6e0; border:1px solid #e2c9a2; border-radius:10px;
    padding:2px 10px; white-space:nowrap; max-width:96%; overflow:hidden; text-overflow:ellipsis;
  }

  .creature{ position:absolute; inset:0; }
  .creature .part{
    position:absolute;
    background:radial-gradient(circle at 35% 28%, var(--clay-light), var(--clay) 55%, var(--clay-dark) 100%);
    box-shadow:0 5px 10px rgba(90,50,20,.25), inset 0 0 0 2px rgba(255,255,255,.12);
    transition:transform .12s ease;
  }
  .earL{ width:18px; height:48px; left:32px; top:2px; border-radius:50% 50% 40% 40%/60% 60% 30% 30%; }
  .earR{ width:18px; height:48px; left:100px; top:2px; border-radius:50% 50% 40% 40%/60% 60% 30% 30%; }
  .head{ width:66px; height:60px; left:42px; top:42px; border-radius:50%; }
  .body{ width:98px; height:78px; left:26px; top:86px; border-radius:50% 50% 46% 46%/58% 58% 42% 42%; }
  .footL{ width:26px; height:16px; left:30px; top:152px; border-radius:50%; }
  .footR{ width:26px; height:16px; left:94px; top:152px; border-radius:50%; }
  .tail{ width:22px; height:22px; left:117px; top:114px; border-radius:50%; }
  .creature .part.earL, .creature .part.earR{ z-index:0; }
  .creature .part.footL, .creature .part.footR{ z-index:1; }
  .creature .part.body, .creature .part.tail{ z-index:2; }
  .creature .part.head{ z-index:3; }
  .face{
    position:absolute; left:42px; top:42px; width:66px; height:60px;
    z-index:4; pointer-events:none;
    transition:transform .12s ease;
  }
  .eye{ position:absolute; width:5px; height:7px; background:#4a352a; border-radius:50%; top:26px; }
  .eyeL{ left:18px; } .eyeR{ left:42px; }
  .nose{ position:absolute; width:8px; height:6px; background:#e0708a; border-radius:50%; left:29px; top:33px; }

  .pop{
    position:absolute; font-size:15px; font-weight:900; color:var(--accent-dark);
    pointer-events:none; animation:popUp .9s ease forwards; z-index:10; white-space:nowrap;
    transform:translateX(-50%);
    text-shadow:0 1px 0 #fff;
  }
  .pop.big{ font-size:18px; color:#c2456e; }
  @keyframes popUp{
    0%{ opacity:0; margin-top:0; } 15%{ opacity:1; margin-top:-6px; } 100%{ opacity:0; margin-top:-50px; }
  }
  .crumb{ position:absolute; border-radius:50%; pointer-events:none; animation:crumbFall .7s ease-out forwards; z-index:9; }
  @keyframes crumbFall{ 0%{ opacity:1; transform:translate(0,0); } 100%{ opacity:0; transform:translate(var(--dx), 50px); } }

  /* ===== ボタン ===== */
  #partBtns{
    width:100%;
    display:grid; grid-template-columns:repeat(4, 1fr); gap:6px;
  }
  .partBtn{
    padding:8px 2px 7px;
    border:none; border-radius:14px;
    background:linear-gradient(160deg,var(--accent),var(--accent-dark));
    color:#fff8ec;
    font-size:14px; font-weight:800; font-family:inherit;
    box-shadow:0 5px 0 #9c5019;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .partBtn:active{ transform:translateY(4px); box-shadow:0 1px 0 #9c5019; }
  .partBtn .lbl{ display:block; font-size:10px; font-weight:700; opacity:.95; margin-top:1px; min-height:13px; }
  .meter{ display:flex; gap:2px; margin:5px 6px 0; height:7px; }
  .meter i{ flex:1; border-radius:2px; background:#ffffff40; }
  .meter i.on.r{ background:var(--zone-rough); }
  .meter i.on.n{ background:#b6f08a; }
  .meter i.on.q{ background:#e0c8ff; }
  #actRow{ width:100%; display:flex; gap:6px; margin-top:8px; }
  #shelveBtn{
    flex:1;
    padding:12px; border:none; border-radius:16px;
    background:linear-gradient(160deg,#7fbf5a,#4f9a34);
    color:#fff; font-size:16px; font-weight:900; font-family:inherit;
    box-shadow:0 5px 0 #3a7424; cursor:pointer;
  }
  #shelveBtn:active{ transform:translateY(4px); box-shadow:0 1px 0 #3a7424; }
  #redoBtn{
    flex:0 0 86px;
    border:2px solid #d8bd94; background:#fff8ec; color:var(--text-main);
    border-radius:16px; font-size:12px; font-weight:800; font-family:inherit; cursor:pointer;
  }

  /* ===== はじまり・結果・図鑑 ===== */
  .overlay{
    position:fixed; inset:0; z-index:50;
    background:rgba(60,40,25,.92);
    display:none; flex-direction:column; align-items:center;
    padding:16px; overflow-y:auto; text-align:center; color:#fff3de;
  }
  .overlay.show{ display:flex; }
  .overlayInner{ margin:auto 0; width:100%; max-width:380px; }
  .title{ font-size:22px; font-weight:900; margin:0 0 6px; color:#ffd76a; }
  .howto{
    text-align:left; font-size:13px; line-height:1.85;
    background:#00000030; border-radius:14px; padding:10px 14px; margin:12px 0;
  }
  .howto .z{ display:inline-block; font-size:11px; font-weight:800; color:#fff; padding:0 6px; border-radius:8px; margin-right:2px; }
  .best{ font-size:12px; color:#e8d3b5; margin-bottom:12px; }
  .mainBtn{
    padding:13px 36px; border:none; border-radius:30px;
    background:linear-gradient(160deg,#ffd76a,#e0a93a);
    color:#4a2f10; font-weight:900; font-size:16px; font-family:inherit;
    box-shadow:0 6px 0 #a97c1e; cursor:pointer;
  }
  .subBtn{
    padding:11px 20px; border:2px solid #ffffff44; border-radius:30px;
    background:transparent; color:#f0dcc0; font-weight:700; font-size:13px; font-family:inherit; cursor:pointer;
  }
  .btnRow{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:4px; }
  #finalScore{ font-size:46px; font-weight:900; color:#ffd76a; line-height:1.1; font-variant-numeric:tabular-nums; }
  #newBest{ display:inline-block; margin:4px 0; font-size:12px; font-weight:900; letter-spacing:2px; color:#4a2f10; background:#ffd76a; padding:3px 12px; border-radius:12px; }
  #bestLine{ font-size:12px; color:#e8d3b5; margin-bottom:10px; }
  .stats{ display:flex; gap:8px; justify-content:center; margin-bottom:10px; }
  .stat{ background:#00000030; border-radius:12px; padding:8px 10px; min-width:84px; }
  .stat .n{ font-size:20px; font-weight:900; color:#ffd76a; }
  .stat .l{ font-size:10.5px; color:#e8d3b5; }
  #resultShelf{
    display:flex; flex-wrap:wrap; justify-content:center; gap:2px;
    background:#00000025; border-radius:12px; padding:6px; margin-bottom:6px;
  }
  #bestPiece{ font-size:12px; color:#e8d3b5; margin-bottom:10px; line-height:1.6; }
  #bestPiece b{ color:#fff3de; }
  #comment{ font-size:13px; background:#00000030; border-radius:12px; padding:8px 12px; margin-bottom:14px; }
  #zukanList{ text-align:left; font-size:11.5px; line-height:1.7; columns:2; column-gap:12px; margin:10px 0; }
  #zukanList div{ break-inside:avoid; }
  #zukanList .locked{ color:#9a8670; }
  #countdown{
    position:absolute; left:50%; top:45%; transform:translate(-50%,-50%);
    font-size:64px; font-weight:900; color:var(--accent-dark); z-index:20; pointer-events:none;
  }
</style>
</head>
<body>

<div id="app">
  <div id="hud">
    <div id="scoreBox"><small>SCORE</small><span id="scoreVal">0</span></div>
    <div id="zukanBox">図鑑 <b id="zukanVal">0</b> / 81</div>
    <div id="clock">⏱ 60</div>
  </div>

  <div id="shelf"><span class="empty">今日の棚（まだからっぽ）</span></div>

  <div id="boxArea">
    <div class="boxStage" id="rabbitStage"><div class="creature" id="rabbit"></div></div>
    <div id="nameTag"></div>
  </div>

  <div id="partBtns">
    <button class="partBtn" data-g="ears">耳<div class="meter"></div><span class="lbl"></span></button>
    <button class="partBtn" data-g="head">顔<div class="meter"></div><span class="lbl"></span></button>
    <button class="partBtn" data-g="body">からだ<div class="meter"></div><span class="lbl"></span></button>
    <button class="partBtn" data-g="tail">しっぽ<div class="meter"></div><span class="lbl"></span></button>
  </div>
  <div id="actRow">
    <button id="redoBtn">つくり直す</button>
    <button id="shelveBtn">棚に飾る！</button>
  </div>
</div>

<div id="startScreen" class="overlay show">
  <div class="overlayInner">
    <div class="title">🐰 粘土フィギュア工房</div>
    <div class="howto">
      今日は60秒、好きなキャラのフィギュアを好きに作る日。<br>
      パーツのボタンを押すほど、形が変わっていく。<br>
      <span class="z" style="background:var(--zone-rough)">粘土のまま</span>→
      <span class="z" style="background:var(--zone-neat)">整った形</span>→
      <span class="z" style="background:var(--zone-quirk)">個性的</span><br>
      できたら「棚に飾る！」。<b>まだ図鑑にない形</b>なら新作ボーナス！<br>
      <span style="font-size:11.5px;opacity:.8">キーボード：1〜4でこねる／Enterで飾る／Backspaceで作り直す</span>
    </div>
    <div class="best" id="startBest"></div>
    <div class="btnRow">
      <button class="mainBtn" id="startBtn">工房をひらく</button>
      <button class="subBtn" id="zukanBtn1">📖 図鑑</button>
    </div>
  </div>
</div>

<div id="resultScreen" class="overlay">
  <div class="overlayInner">
    <div class="title">今日の作業おわり！</div>
    <div id="finalScore">0</div>
    <div id="newBest">NEW BEST!</div>
    <div id="bestLine"></div>
    <div class="stats">
      <div class="stat"><div class="n" id="stMade">0</div><div class="l">作った数</div></div>
      <div class="stat"><div class="n" id="stNew">0</div><div class="l">新作</div></div>
      <div class="stat"><div class="n" id="stZukan">0</div><div class="l">図鑑 / 81</div></div>
    </div>
    <div id="resultShelf"></div>
    <div id="bestPiece"></div>
    <div id="comment"></div>
    <div class="btnRow">
      <button class="mainBtn" id="retryBtn">もう1日つくる</button>
      <button class="subBtn" id="zukanBtn2">📖 図鑑</button>
    </div>
  </div>
</div>

<div id="zukanScreen" class="overlay">
  <div class="overlayInner">
    <div class="title">📖 フィギュア図鑑</div>
    <div class="best" id="zukanSub"></div>
    <div id="zukanList"></div>
    <button class="subBtn" id="closeZukan">とじる</button>
  </div>
</div>

<script>
(function(){
  const GROUPS = ['ears','head','body','tail'];
  const PARTS = ['earL','earR','head','body','tail','footL','footR','face'];
  const PART_GROUP = { earL:'ears', earR:'ears', head:'head', face:'head', body:'body', footL:'body', footR:'body', tail:'tail' };

  // こねた回数で3段階：0〜2 粘土のまま / 3〜6 整った形 / 7〜 個性的
  const MAX_KNEAD = 12;
  const ZONES = ['rough','neat','quirk'];
  function zoneOf(c){ return c <= 2 ? 'rough' : c <= 6 ? 'neat' : 'quirk'; }
  const ZONE_LABEL = {
    ears: { rough:'粘土のまま', neat:'ぴん', quirk:'ながーい' },
    head: { rough:'ぼんやり',   neat:'ふつう', quirk:'まんまる' },
    body: { rough:'かたまり',   neat:'すわりよく', quirk:'ずんぐり' },
    tail: { rough:'どこ？',     neat:'ふわっと', quirk:'でかい' }
  };
  const NAME_PHRASE = {
    ears: { rough:'耳がまだ粘土っぽい', neat:'耳がぴんとした', quirk:'耳がながーい' },
    head: { rough:'ぼんやり顔の', neat:'すました顔の', quirk:'まんまる顔の' },
    body: { rough:'かたまりっぽい', neat:'すわりのいい', quirk:'ずんぐりした' },
    tail: { rough:'しっぽが行方不明の', neat:'しっぽふわっとした', quirk:'しっぽでかめの' }
  };
  // 特別な形には特別な名前（ヘンな形ほど面白く）
  const SPECIAL = {
    'rough,rough,rough,rough': '原型（ただの粘土）',
    'quirk,quirk,quirk,quirk': '超大作（なにかの化身）',
    'neat,neat,neat,neat':     'きちんとうさぎ',
    'quirk,rough,rough,rough': '耳だけ本気のかたまり',
    'rough,rough,rough,quirk': 'しっぽが本体',
    'quirk,quirk,rough,rough': '上半身だけ全力',
    'rough,quirk,rough,rough': '顔だけまんまるの謎生物'
  };

  const COMMENTS = {
    great: ['棚がにぎやかになってきた','もはや個展ひらける','いろんな子が生まれた日だった'],
    good:  ['いい作業日だった','新しい形、見つけたね','棚を眺めるだけで楽しい'],
    normal:['また粘土こねにおいで','明日はどんな子ができるかな','まずは1体、おつかれさま']
  };

  /* 自己ベストと図鑑（この端末に保存） */
  const SAVE_KEY = 'clayFigure_v1';
  function loadSave(){
    try{ return Object.assign({ best:0, days:0, zukan:{} }, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); }
    catch(e){ return { best:0, days:0, zukan:{} }; }
  }
  function writeSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
  let save = loadSave();

  function rand(a,b){ return a + Math.random()*(b-a); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function lerp(a,b,t){ return a + (b-a)*t; }

  const app = document.getElementById('app');
  const rabbit = document.getElementById('rabbit');
  const rabbitStage = document.getElementById('rabbitStage');
  const nameTag = document.getElementById('nameTag');
  const shelf = document.getElementById('shelf');
  const clockEl = document.getElementById('clock');
  const partBtns = document.querySelectorAll('.partBtn');

  /* =========================================================
     うさぎの形
     ========================================================= */
  function buildCreature(el){
    el.innerHTML = `
      <div class="part earL" data-part="earL"></div>
      <div class="part earR" data-part="earR"></div>
      <div class="part body" data-part="body"></div>
      <div class="part tail" data-part="tail"></div>
      <div class="part footL" data-part="footL"></div>
      <div class="part footR" data-part="footR"></div>
      <div class="part head" data-part="head"></div>
      <div class="face" data-part="face"><div class="eye eyeL"></div><div class="eye eyeR"></div><div class="nose"></div></div>`;
  }
  // 粘土の塊の状態（毎回少しブレる）
  function blobOf(p){
    const j = () => rand(-4,4);
    switch(p){
      case 'earL':  return { rx:34+j(),  ry:84+j(),  rot:-70+rand(-10,10), sx:.32, sy:.30 };
      case 'earR':  return { rx:-34+j(), ry:84+j(),  rot:70+rand(-10,10),  sx:.32, sy:.30 };
      case 'head':  return { rx:j(),     ry:38+j(),  rot:10+rand(-8,8),    sx:.75, sy:.68 };
      case 'body':  return { rx:j(),     ry:-14+j(), rot:-6+rand(-8,8),    sx:1.12, sy:.86 };
      case 'tail':  return { rx:-47+j(), ry:-5+j(),  rot:40,               sx:.5,  sy:.5 };
      case 'footL': return { rx:32+j(),  ry:-35+j(), rot:25,               sx:.5,  sy:.6 };
      case 'footR': return { rx:-32+j(), ry:-35+j(), rot:-25,              sx:.5,  sy:.6 };
      case 'face':  return { rx:j(),     ry:38+j(),  rot:0,                sx:.3,  sy:.3 };
    }
  }
  let blob = {};
  let knead = {};

  function shapeKey(){ return GROUPS.map(g => zoneOf(knead[g])).join(','); }
  function shapeName(key){
    if(SPECIAL[key]) return SPECIAL[key];
    const zs = key.split(',');
    const parts = GROUPS.map((g, i) => ({ g, z:zs[i] })).filter(x => x.z !== 'neat');
    if(parts.length === 0) return 'きちんとうさぎ';
    // 個性的 → 粘土のまま の順に、目立つ特徴を2つまで
    parts.sort((a,b) => (a.z === 'quirk' ? 0 : 1) - (b.z === 'quirk' ? 0 : 1));
    return parts.slice(0,2).map(x => NAME_PHRASE[x.g][x.z]).join('、') + 'うさぎ';
  }

  function render(){
    PARTS.forEach(p => {
      const g = PART_GROUP[p];
      const c = knead[g];
      const t = Math.min(1, c / 5) * 0.94;          // 整っていく度合い
      const q = Math.max(0, c - 6);                 // 個性の度合い
      const b = blob[p];
      let rx = lerp(b.rx, 0, t), ry = lerp(b.ry, 0, t), rot = lerp(b.rot, 0, t);
      let sx = lerp(b.sx, 1, t), sy = lerp(b.sy, 1, t);
      if(p === 'earL' || p === 'earR'){ sy *= 1 + q*0.14; ry -= q*0.14*22; rot += (p === 'earL' ? -1 : 1) * q*1.5; }
      if(g === 'head'){ sx *= 1 + q*0.06; sy *= 1 + q*0.05; }
      if(p === 'body'){ sx *= 1 + q*0.08; sy *= 1 - q*0.02; }
      if(g === 'tail'){ sx *= 1 + q*0.18; sy *= 1 + q*0.18; rx += q*2; ry -= q*1.2; }
      const el = rabbit.querySelector(`[data-part="${p}"]`);
      el.style.transform = `translate(${rx.toFixed(1)}px, ${ry.toFixed(1)}px) rotate(${rot.toFixed(1)}deg) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`;
    });
    partBtns.forEach(btn => {
      const g = btn.dataset.g;
      const c = knead[g];
      const meter = btn.querySelector('.meter');
      if(!meter.children.length){
        for(let i=1;i<=MAX_KNEAD;i++){
          const s = document.createElement('i');
          s.className = i <= 2 ? 'r' : i <= 6 ? 'n' : 'q';
          meter.appendChild(s);
        }
      }
      [...meter.children].forEach((s, i) => s.classList.toggle('on', i < c));
      btn.querySelector('.lbl').textContent = ZONE_LABEL[g][zoneOf(c)];
    });
    // いま作っている形の名前（図鑑にないものは「？」つき）
    const key = shapeKey();
    nameTag.textContent = (save.zukan[key] ? '' : '🆕 ') + shapeName(key);
  }

  function newRabbit(){
    PARTS.forEach(p => blob[p] = blobOf(p));
    GROUPS.forEach(g => knead[g] = 0);
    rabbitStage.classList.remove('shelve','fresh');
    void rabbitStage.offsetWidth;
    rabbitStage.classList.add('fresh');
    render();
  }

  /* =========================================================
     状態とループ
     ========================================================= */
  const DAY = 60;
  let running = false, elapsed = 0, score = 0;
  let today = [];          // 今日飾ったもの { key, name, isNew }
  let todayKeys = {};
  let newCount = 0;
  let lastTs = null, rafId = null;

  function renderHud(){
    document.getElementById('scoreVal').textContent = score.toLocaleString();
    document.getElementById('zukanVal').textContent = Object.keys(save.zukan).length;
  }

  function doKnead(g, btn){
    if(!running) return;
    if(knead[g] >= MAX_KNEAD){ spawnPop(btn, 'これ以上は無理！'); return; }
    knead[g]++;
    render();
    spawnCrumbs(g);
    if(knead[g] === 3) spawnPop(btn, '整った！');
    else if(knead[g] === 7) spawnPop(btn, '個性が出た！');
  }

  // 棚に飾る：図鑑にない形なら新作ボーナス
  let shelving = false;
  function shelve(){
    if(!running || shelving) return;   // 飾っている途中の連打は受け付けない
    shelving = true;
    const key = shapeKey();
    const name = shapeName(key);
    const isNew = !save.zukan[key];
    const firstToday = !todayKeys[key];
    let gained, label;
    if(isNew){ gained = 500; label = `新作！ +500`; newCount++; }
    else if(firstToday){ gained = 200; label = `今日はじめての形 +200`; }
    else { gained = 10; label = `+10`; }   // 同じ形の連打で稼げないように少なめ
    if(SPECIAL[key] && isNew) gained += 100;
    score += gained;
    save.zukan[key] = true;
    todayKeys[key] = true;
    writeSave();
    today.push({ key, name, isNew });

    addToShelf(isNew);
    spawnPop(document.getElementById('shelveBtn'), isNew ? `🆕「${name}」` : label, isNew);
    if(isNew) setTimeout(() => spawnPop(document.getElementById('shelveBtn'), `+${gained}`, false), 250);
    renderHud();
    rabbitStage.classList.add('shelve');
    setTimeout(() => { shelving = false; if(running) newRabbit(); }, 420);
  }

  function addToShelf(isNew){
    const empty = shelf.querySelector('.empty');
    if(empty) empty.remove();
    const m = document.createElement('div');
    m.className = 'mini arrive' + (isNew ? ' new' : '');
    const cr = rabbit.cloneNode(true);
    cr.removeAttribute('id');
    m.appendChild(cr);
    shelf.appendChild(m);
    shelf.scrollLeft = shelf.scrollWidth;
  }

  function loop(ts){
    if(!running) return;
    if(lastTs === null) lastTs = ts;
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    elapsed += dt;
    const left = Math.max(0, DAY - elapsed);
    clockEl.textContent = `⏱ ${Math.ceil(left)}`;
    clockEl.classList.toggle('hurry', left <= 10);
    if(left <= 0){ closeDay(); return; }
    rafId = requestAnimationFrame(loop);
  }

  function spawnPop(btn, text, big){
    const r = btn.getBoundingClientRect(), a = app.getBoundingClientRect();
    const p = document.createElement('div');
    p.className = 'pop' + (big ? ' big' : '');
    p.textContent = text;
    p.style.left = (r.left - a.left + r.width/2) + 'px';
    p.style.top = (r.top - a.top - 10) + 'px';
    app.appendChild(p);
    setTimeout(() => p.remove(), 900);
  }
  function spawnCrumbs(g){
    const t = rabbit.querySelector(g === 'ears' ? '.earL' : '.' + g);
    const r = t.getBoundingClientRect(), a = app.getBoundingClientRect();
    for(let i=0;i<4;i++){
      const c = document.createElement('div');
      c.className = 'crumb';
      const s = 3 + Math.random()*5;
      c.style.width = s + 'px'; c.style.height = s + 'px';
      c.style.background = pick(['#c97b56','#a15a3a','#e6a880']);
      c.style.left = (r.left - a.left + r.width/2 + rand(-15,15)) + 'px';
      c.style.top = (r.top - a.top + r.height/2) + 'px';
      c.style.setProperty('--dx', rand(-30,30) + 'px');
      app.appendChild(c);
      setTimeout(() => c.remove(), 700);
    }
  }

  function openDay(){
    ['startScreen','resultScreen','zukanScreen'].forEach(id => document.getElementById(id).classList.remove('show'));
    elapsed = 0; score = 0; today = []; todayKeys = {}; newCount = 0;
    shelf.innerHTML = '<span class="empty">今日の棚（まだからっぽ）</span>';
    renderHud();
    clockEl.textContent = `⏱ ${DAY}`;
    newRabbit();
    const cd = document.createElement('div');
    cd.id = 'countdown';
    app.appendChild(cd);
    let n = 3;
    cd.textContent = n;
    const iv = setInterval(() => {
      n--;
      if(n > 0){ cd.textContent = n; return; }
      clearInterval(iv);
      cd.remove();
      running = true;
      lastTs = null;
      rafId = requestAnimationFrame(loop);
    }, 550);
  }

  function closeDay(){
    running = false;
    cancelAnimationFrame(rafId);
    const isBest = score > save.best;
    save.days++;
    if(isBest) save.best = score;
    writeSave();
    const zukanCount = Object.keys(save.zukan).length;
    document.getElementById('finalScore').textContent = score.toLocaleString();
    document.getElementById('newBest').style.display = isBest && score > 0 ? 'inline-block' : 'none';
    document.getElementById('bestLine').textContent = `自己ベスト ${save.best.toLocaleString()}`;
    document.getElementById('stMade').textContent = today.length;
    document.getElementById('stNew').textContent = newCount;
    document.getElementById('stZukan').textContent = zukanCount;
    // 今日の棚をそのまま結果に並べる
    const rs = document.getElementById('resultShelf');
    rs.innerHTML = '';
    shelf.querySelectorAll('.mini').forEach(m => { const c = m.cloneNode(true); c.classList.remove('arrive'); rs.appendChild(c); });
    rs.style.display = today.length ? 'flex' : 'none';
    const fav = today.filter(t => t.isNew).slice(-1)[0] || today.slice(-1)[0];
    document.getElementById('bestPiece').innerHTML = fav ? `今日の新顔：<b></b>` : '';
    if(fav) document.querySelector('#bestPiece b').textContent = `「${fav.name}」`;
    const pool = newCount >= 6 ? COMMENTS.great : today.length >= 4 ? COMMENTS.good : COMMENTS.normal;
    document.getElementById('comment').textContent = pick(pool);
    setTimeout(() => document.getElementById('resultScreen').classList.add('show'), 300);
    sendResultToPortal(zukanCount);
  }

  // 81種すべての名前を図鑑に並べる（見つけていないものは ？？？）
  function openZukan(){
    const list = document.getElementById('zukanList');
    list.innerHTML = '';
    const keys = [];
    ZONES.forEach(a => ZONES.forEach(b => ZONES.forEach(c => ZONES.forEach(d => keys.push([a,b,c,d].join(','))))));
    keys.forEach(k => {
      const d = document.createElement('div');
      const got = !!save.zukan[k];
      d.className = got ? '' : 'locked';
      d.textContent = got ? shapeName(k) : '？？？';
      list.appendChild(d);
    });
    document.getElementById('zukanSub').textContent = `見つけた形 ${Object.keys(save.zukan).length} / 81`;
    document.getElementById('zukanScreen').classList.add('show');
  }

  // ポータルサイトに埋め込まれている場合、結果を親ウィンドウへ送信する（score は記録用）
  function sendResultToPortal(zukanCount){
    try{
      window.parent.postMessage({
        type: 'moyamoyaGameResult',
        gameId: 'clay-rabbit',
        summary: `スコア ${score.toLocaleString()}（${today.length}体・新作${newCount}）`,
        detail: { score, made: today.length, newShapes: newCount, zukan: zukanCount }
      }, '*');
    }catch(e){ /* ポータル外で単体表示している場合は何もしない */ }
  }

  /* ===== 操作 ===== */
  partBtns.forEach(btn => btn.addEventListener('click', () => doKnead(btn.dataset.g, btn)));
  document.getElementById('shelveBtn').addEventListener('click', shelve);
  document.getElementById('redoBtn').addEventListener('click', () => { if(running) newRabbit(); });
  window.addEventListener('keydown', e => {
    if(!running) return;
    const i = ['1','2','3','4'].indexOf(e.key);
    if(i >= 0){ doKnead(GROUPS[i], partBtns[i]); return; }
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); shelve(); }
    if(e.key === 'Backspace'){ e.preventDefault(); newRabbit(); }
  });
  document.getElementById('startBtn').addEventListener('click', openDay);
  document.getElementById('retryBtn').addEventListener('click', openDay);
  document.getElementById('zukanBtn1').addEventListener('click', openZukan);
  document.getElementById('zukanBtn2').addEventListener('click', openZukan);
  document.getElementById('closeZukan').addEventListener('click', () => document.getElementById('zukanScreen').classList.remove('show'));

  buildCreature(rabbit);
  newRabbit();
  renderHud();
  document.getElementById('startBest').textContent = save.best > 0 ? `自己ベスト ${save.best.toLocaleString()} ／ 図鑑 ${Object.keys(save.zukan).length} / 81` : '';
})();
</script>
</body>
</html>
