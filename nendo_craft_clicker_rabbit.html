<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>粘土うさぎ屋さん</title>
<style>
  :root{
    --bg1:#f3e6d3;
    --bg2:#e8d4b8;
    --clay:#c97b56;
    --clay-dark:#a15a3a;
    --clay-light:#e6a880;
    --board:#8a6248;
    --board-dark:#5f4230;
    --accent:#e08a3c;
    --accent-dark:#c06a24;
    --text-main:#4a352a;
    --text-sub:#8a6f5c;
    --zone-rough:#b8a48e;
    --zone-neat:#7fbf5a;
    --zone-quirk:#a77ad8;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0;padding:0;height:100%;
    font-family:"Hiragino Sans","Yu Gothic","Zen Maru Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(circle at 20% 15%, #fff3de 0%, transparent 45%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--text-main);
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  #app{
    position:relative;
    width:100%; height:100%;
    max-width:520px;
    margin:0 auto;
    display:flex; flex-direction:column; align-items:center;
    padding:8px 12px 12px;
  }

  /* ===== HUD ===== */
  #hud{
    width:100%;
    display:flex; justify-content:space-between; align-items:center;
    font-weight:800;
    margin-bottom:6px;
  }
  #money{ font-size:20px; font-variant-numeric:tabular-nums; }
  #money small{ display:block; font-size:10px; color:var(--text-sub); font-weight:600; }
  #comboBox{ font-size:12px; color:var(--accent-dark); opacity:0; transition:opacity .2s ease; text-align:center; }
  #comboBox.on{ opacity:1; }
  #comboBox b{ font-size:18px; display:block; line-height:1; }
  #clock{
    font-size:15px; background:#ffffffa0; padding:4px 12px; border-radius:14px;
    font-variant-numeric:tabular-nums;
  }
  #clock.hurry{ color:#d4423f; animation:hurry .5s ease infinite alternate; }
  @keyframes hurry{ to{ transform:scale(1.08); } }

  /* ===== お客さん ===== */
  #customerArea{
    width:100%;
    display:flex; align-items:flex-start; gap:8px;
    min-height:76px;
  }
  #customer{
    font-size:40px; line-height:1;
    flex-shrink:0;
    transition:transform .3s ease, opacity .3s ease;
  }
  #customer.leave{ transform:translateX(-60px); opacity:0; }
  #customer.arrive{ animation:arrive .35s cubic-bezier(.3,1.6,.4,1); }
  @keyframes arrive{ from{ transform:translateX(50px); opacity:0; } to{ transform:none; opacity:1; } }
  #orderBubble{
    flex:1;
    position:relative;
    background:#fffdf6;
    border:2px solid #e2c9a2;
    border-radius:14px;
    padding:6px 10px 8px;
  }
  #orderText{ font-size:13px; font-weight:800; line-height:1.5; min-height:20px; }
  #orderChips{ display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .chip{
    font-size:11px; font-weight:800; padding:2px 8px; border-radius:10px;
    color:#fff; background:var(--zone-rough);
    opacity:.55;
  }
  .chip.neat{ background:var(--zone-neat); }
  .chip.quirk{ background:var(--zone-quirk); }
  .chip.ok{ opacity:1; box-shadow:0 0 0 2px #fff, 0 0 0 4px currentColor; }
  .chip.ok::after{ content:" ✓"; }
  #patience{
    height:5px; border-radius:3px; background:#0001; margin-top:6px; overflow:hidden;
  }
  #patienceBar{ height:100%; width:100%; background:#7fbf5a; transition:background .3s ease; }
  #queue{ font-size:16px; letter-spacing:2px; opacity:.6; margin-left:4px; align-self:center; white-space:nowrap; }
  #reaction{
    position:absolute; right:8px; top:-14px;
    font-size:22px; opacity:0; pointer-events:none;
  }
  #reaction.show{ animation:react .9s ease; }
  @keyframes react{ 0%{ opacity:0; transform:translateY(6px) scale(.6); } 25%{ opacity:1; transform:none; } 80%{ opacity:1; } 100%{ opacity:0; transform:translateY(-10px); } }

  /* ===== うさぎ ===== */
  #boxArea{
    width:100%; flex:1;
    display:flex; align-items:center; justify-content:center;
    min-height:150px;
    position:relative;
  }
  .boxStage{ width:150px; height:170px; position:relative; }
  .boxStage::after{
    content:"";
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    width:120px; height:16px;
    background:var(--board);
    border-radius:50%;
    box-shadow:0 3px 0 var(--board-dark);
    z-index:0;
  }
  #rabbitStage.sold{ animation:sold .45s ease-in forwards; }
  @keyframes sold{ to{ transform:translateX(-140px) scale(.6); opacity:0; } }
  #rabbitStage.fresh{ animation:fresh .35s cubic-bezier(.3,1.6,.4,1); }
  @keyframes fresh{ from{ transform:scale(.4); opacity:0; } to{ transform:none; opacity:1; } }

  .creature{ position:absolute; inset:0; }
  .creature .part{
    position:absolute;
    background:radial-gradient(circle at 35% 28%, var(--clay-light), var(--clay) 55%, var(--clay-dark) 100%);
    box-shadow:0 5px 10px rgba(90,50,20,.25), inset 0 0 0 2px rgba(255,255,255,.12);
    transition:transform .12s ease, border-radius .12s ease;
  }
  .earL{ width:18px; height:48px; left:32px; top:2px; border-radius:50% 50% 40% 40%/60% 60% 30% 30%; }
  .earR{ width:18px; height:48px; left:100px; top:2px; border-radius:50% 50% 40% 40%/60% 60% 30% 30%; }
  .head{ width:66px; height:60px; left:42px; top:42px; border-radius:50%; }
  .body{ width:98px; height:78px; left:26px; top:86px; border-radius:50% 50% 46% 46%/58% 58% 42% 42%; }
  .footL{ width:26px; height:16px; left:30px; top:152px; border-radius:50%; }
  .footR{ width:26px; height:16px; left:94px; top:152px; border-radius:50%; }
  .tail{ width:22px; height:22px; left:117px; top:114px; border-radius:50%; }
  .creature .part.earL, .creature .part.earR{ z-index:0; }
  .creature .part.footL, .creature .part.footR{ z-index:1; }
  .creature .part.body, .creature .part.tail{ z-index:2; }
  .creature .part.head{ z-index:3; }
  .face{
    position:absolute; left:42px; top:42px; width:66px; height:60px;
    z-index:4; pointer-events:none;
    transition:transform .12s ease;
  }
  .eye{ position:absolute; width:5px; height:7px; background:#4a352a; border-radius:50%; top:26px; }
  .eyeL{ left:18px; } .eyeR{ left:42px; }
  .nose{ position:absolute; width:8px; height:6px; background:#e0708a; border-radius:50%; left:29px; top:33px; }

  .pop{
    position:absolute; font-size:15px; font-weight:900; color:var(--accent-dark);
    pointer-events:none; animation:popUp .8s ease forwards; z-index:10; white-space:nowrap;
    transform:translateX(-50%);
  }
  @keyframes popUp{
    0%{ opacity:0; margin-top:0; } 15%{ opacity:1; margin-top:-6px; } 100%{ opacity:0; margin-top:-46px; }
  }
  .crumb{ position:absolute; border-radius:50%; pointer-events:none; animation:crumbFall .7s ease-out forwards; z-index:9; }
  @keyframes crumbFall{ 0%{ opacity:1; transform:translate(0,0); } 100%{ opacity:0; transform:translate(var(--dx), 50px); } }

  /* ===== ボタン ===== */
  #partBtns{
    width:100%;
    display:grid; grid-template-columns:repeat(4, 1fr); gap:6px;
  }
  .partBtn{
    padding:8px 2px 7px;
    border:none; border-radius:14px;
    background:linear-gradient(160deg,var(--accent),var(--accent-dark));
    color:#fff8ec;
    font-size:14px; font-weight:800; font-family:inherit;
    box-shadow:0 5px 0 #9c5019;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .partBtn:active{ transform:translateY(4px); box-shadow:0 1px 0 #9c5019; }
  .partBtn .lbl{ display:block; font-size:10px; font-weight:700; opacity:.95; margin-top:1px; min-height:13px; }
  .meter{ display:flex; gap:2px; margin:5px 6px 0; height:7px; }
  .meter i{ flex:1; border-radius:2px; background:#ffffff40; }
  .meter i.r{ } .meter i.on.r{ background:var(--zone-rough); }
  .meter i.on.n{ background:#b6f08a; }
  .meter i.on.q{ background:#e0c8ff; }
  #actRow{ width:100%; display:flex; gap:6px; margin-top:8px; }
  #deliverBtn{
    flex:1;
    padding:12px; border:none; border-radius:16px;
    background:linear-gradient(160deg,#7fbf5a,#4f9a34);
    color:#fff; font-size:16px; font-weight:900; font-family:inherit;
    box-shadow:0 5px 0 #3a7424; cursor:pointer;
  }
  #deliverBtn:active{ transform:translateY(4px); box-shadow:0 1px 0 #3a7424; }
  #redoBtn{
    flex:0 0 86px;
    border:2px solid #d8bd94; background:#fff8ec; color:var(--text-main);
    border-radius:16px; font-size:12px; font-weight:800; font-family:inherit; cursor:pointer;
  }

  /* ===== はじまり・結果 ===== */
  .overlay{
    position:fixed; inset:0; z-index:50;
    background:rgba(60,40,25,.92);
    display:none; flex-direction:column; align-items:center;
    padding:16px; overflow-y:auto; text-align:center; color:#fff3de;
  }
  .overlay.show{ display:flex; }
  .overlayInner{ margin:auto 0; width:100%; max-width:360px; }
  .title{ font-size:22px; font-weight:900; margin:0 0 6px; color:#ffd76a; }
  .howto{
    text-align:left; font-size:13px; line-height:1.85;
    background:#00000030; border-radius:14px; padding:10px 14px; margin:12px 0;
  }
  .howto .z{ display:inline-block; font-size:11px; font-weight:800; color:#fff; padding:0 6px; border-radius:8px; margin-right:2px; }
  .best{ font-size:12px; color:#e8d3b5; margin-bottom:12px; }
  .mainBtn{
    padding:13px 40px; border:none; border-radius:30px;
    background:linear-gradient(160deg,#ffd76a,#e0a93a);
    color:#4a2f10; font-weight:900; font-size:16px; font-family:inherit;
    box-shadow:0 6px 0 #a97c1e; cursor:pointer;
  }
  #finalMoney{ font-size:46px; font-weight:900; color:#ffd76a; line-height:1.1; font-variant-numeric:tabular-nums; }
  #newBest{ display:inline-block; margin:4px 0; font-size:12px; font-weight:900; letter-spacing:2px; color:#4a2f10; background:#ffd76a; padding:3px 12px; border-radius:12px; }
  #bestLine{ font-size:12px; color:#e8d3b5; margin-bottom:10px; }
  .stats{ display:flex; gap:8px; justify-content:center; margin-bottom:10px; }
  .stat{ background:#00000030; border-radius:12px; padding:8px 10px; min-width:84px; }
  .stat .n{ font-size:20px; font-weight:900; color:#ffd76a; }
  .stat .l{ font-size:10.5px; color:#e8d3b5; }
  #soldList{
    font-size:11.5px; color:#e8d3b5; margin-bottom:10px; line-height:1.6;
    max-height:70px; overflow-y:auto;
  }
  #comment{ font-size:13px; background:#00000030; border-radius:12px; padding:8px 12px; margin-bottom:14px; }
  #countdown{
    position:absolute; left:50%; top:45%; transform:translate(-50%,-50%);
    font-size:64px; font-weight:900; color:var(--accent-dark); z-index:20; pointer-events:none;
  }
</style>
</head>
<body>

<div id="app">
  <div id="hud">
    <div id="money"><small>売上</small><span id="moneyVal">0</span>円</div>
    <div id="comboBox"><b id="comboVal">0</b>連続満足</div>
    <div id="clock">⏱ 60</div>
  </div>

  <div id="customerArea">
    <div id="customer">🐻</div>
    <div id="orderBubble">
      <div id="reaction"></div>
      <div id="orderText"></div>
      <div id="orderChips"></div>
      <div id="patience"><div id="patienceBar"></div></div>
    </div>
    <div id="queue"></div>
  </div>

  <div id="boxArea">
    <div class="boxStage" id="rabbitStage"><div class="creature" id="rabbit"></div></div>
  </div>

  <div id="partBtns">
    <button class="partBtn" data-g="ears">耳<div class="meter"></div><span class="lbl"></span></button>
    <button class="partBtn" data-g="head">顔<div class="meter"></div><span class="lbl"></span></button>
    <button class="partBtn" data-g="body">からだ<div class="meter"></div><span class="lbl"></span></button>
    <button class="partBtn" data-g="tail">しっぽ<div class="meter"></div><span class="lbl"></span></button>
  </div>
  <div id="actRow">
    <button id="redoBtn">つくり直す</button>
    <button id="deliverBtn">お渡しする！</button>
  </div>
</div>

<div id="startScreen" class="overlay show">
  <div class="overlayInner">
    <div class="title">🐰 粘土うさぎ屋さん</div>
    <div class="howto">
      お客さんの注文どおりのうさぎを作って売ろう。営業は60秒！<br>
      パーツのボタンを押すほど、形が変わっていく。<br>
      <span class="z" style="background:var(--zone-rough)">粘土のまま</span>→
      <span class="z" style="background:var(--zone-neat)">整った形</span>→
      <span class="z" style="background:var(--zone-quirk)">個性的</span><br>
      注文に合ったら「お渡しする！」<br>
      <span style="font-size:11.5px;opacity:.8">キーボード：1〜4でこねる／Enterで渡す／Backspaceで作り直す</span>
    </div>
    <div class="best" id="startBest"></div>
    <button class="mainBtn" id="startBtn">開店する</button>
  </div>
</div>

<div id="resultScreen" class="overlay">
  <div class="overlayInner">
    <div class="title">閉店！</div>
    <div id="finalMoney">0円</div>
    <div id="newBest">NEW BEST!</div>
    <div id="bestLine"></div>
    <div class="stats">
      <div class="stat"><div class="n" id="stSold">0</div><div class="l">売れた数</div></div>
      <div class="stat"><div class="n" id="stPerfect">0</div><div class="l">注文どおり</div></div>
      <div class="stat"><div class="n" id="stCombo">0</div><div class="l">最大連続</div></div>
    </div>
    <div id="soldList"></div>
    <div id="comment"></div>
    <button class="mainBtn" id="retryBtn">もう1日営業する</button>
  </div>
</div>

<script>
(function(){
  const GROUPS = ['ears','head','body','tail'];
  const GNAME = { ears:'耳', head:'顔', body:'からだ', tail:'しっぽ' };
  const PARTS = ['earL','earR','head','body','tail','footL','footR','face'];
  const PART_GROUP = { earL:'ears', earR:'ears', head:'head', face:'head', body:'body', footL:'body', footR:'body', tail:'tail' };

  // こねた回数で3段階：0〜2 粘土のまま / 3〜6 整った形 / 7〜 個性的
  const MAX_KNEAD = 12;
  function zoneOf(c){ return c <= 2 ? 'rough' : c <= 6 ? 'neat' : 'quirk'; }
  const ZONE_LABEL = {
    ears: { rough:'粘土のまま', neat:'ぴん', quirk:'ながーい' },
    head: { rough:'ぼんやり',   neat:'ふつう', quirk:'まんまる' },
    body: { rough:'かたまり',   neat:'すわりよく', quirk:'ずんぐり' },
    tail: { rough:'どこ？',     neat:'ふわっと', quirk:'でかい' }
  };
  const ORDER_PHRASE = {
    ears: { rough:'耳はまだ粘土っぽい', neat:'耳がぴんとした', quirk:'耳がながーい' },
    head: { rough:'ぼんやり顔の', neat:'ふつうの顔の', quirk:'まんまる顔の' },
    body: { rough:'かたまりっぽい', neat:'すわりのいい', quirk:'ずんぐりした' },
    tail: { rough:'しっぽが見えない', neat:'しっぽふわっとした', quirk:'しっぽでかめの' }
  };
  // 注文は個性的なものが多め（理想どおりより、ちょっと変なほうが人気）
  const ZONE_WEIGHT = [['quirk',0.48],['neat',0.32],['rough',0.20]];
  const CUSTOMERS = ['🐻','🐱','🦊','🐼','🐸','🐧','🦉','🐨','🐯','🐷','👵','👦','👧','👨‍🦳'];

  const COMMENTS = {
    great: ['行列のできるうさぎ屋さん！','もう看板職人だね','お客さん、ほくほく顔だった'],
    good:  ['いい商売だった！','常連さんがつきそう','手つきが職人っぽくなってきた'],
    normal:['明日はもっと売れそう','注文を見る目がついてきた','まずは開店おめでとう']
  };

  /* 自己ベスト */
  const SAVE_KEY = 'clayShop_v1';
  function loadSave(){
    try{ return Object.assign({ best:0, days:0 }, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); }
    catch(e){ return { best:0, days:0 }; }
  }
  function writeSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
  let save = loadSave();

  function rand(a,b){ return a + Math.random()*(b-a); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function weighted(list){ let r = Math.random(); for(const [v,w] of list){ if((r -= w) < 0) return v; } return list[0][0]; }
  function lerp(a,b,t){ return a + (b-a)*t; }

  const app = document.getElementById('app');
  const rabbit = document.getElementById('rabbit');
  const rabbitStage = document.getElementById('rabbitStage');
  const customerEl = document.getElementById('customer');
  const orderText = document.getElementById('orderText');
  const orderChips = document.getElementById('orderChips');
  const patienceBar = document.getElementById('patienceBar');
  const reaction = document.getElementById('reaction');
  const queueEl = document.getElementById('queue');
  const clockEl = document.getElementById('clock');
  const partBtns = document.querySelectorAll('.partBtn');

  /* =========================================================
     うさぎの形
     ========================================================= */
  function buildCreature(el){
    el.innerHTML = `
      <div class="part earL" data-part="earL"></div>
      <div class="part earR" data-part="earR"></div>
      <div class="part body" data-part="body"></div>
      <div class="part tail" data-part="tail"></div>
      <div class="part footL" data-part="footL"></div>
      <div class="part footR" data-part="footR"></div>
      <div class="part head" data-part="head"></div>
      <div class="face" data-part="face"><div class="eye eyeL"></div><div class="eye eyeR"></div><div class="nose"></div></div>`;
  }
  // 粘土の塊の状態（毎回少しブレる）
  function blobOf(p){
    const j = () => rand(-4,4);
    switch(p){
      case 'earL':  return { rx:34+j(),  ry:84+j(),  rot:-70+rand(-10,10), sx:.32, sy:.30 };
      case 'earR':  return { rx:-34+j(), ry:84+j(),  rot:70+rand(-10,10),  sx:.32, sy:.30 };
      case 'head':  return { rx:j(),     ry:38+j(),  rot:10+rand(-8,8),    sx:.75, sy:.68 };
      case 'body':  return { rx:j(),     ry:-14+j(), rot:-6+rand(-8,8),    sx:1.12, sy:.86 };
      case 'tail':  return { rx:-47+j(), ry:-5+j(),  rot:40,               sx:.5,  sy:.5 };
      case 'footL': return { rx:32+j(),  ry:-35+j(), rot:25,               sx:.5,  sy:.6 };
      case 'footR': return { rx:-32+j(), ry:-35+j(), rot:-25,              sx:.5,  sy:.6 };
      case 'face':  return { rx:j(),     ry:38+j(),  rot:0,                sx:.3,  sy:.3 };
    }
  }
  let blob = {};
  let knead = {};

  function render(){
    PARTS.forEach(p => {
      const g = PART_GROUP[p];
      const c = knead[g];
      const t = Math.min(1, c / 5) * 0.94;          // 整っていく度合い
      const q = Math.max(0, c - 6);                 // 個性の度合い
      const b = blob[p];
      let rx = lerp(b.rx, 0, t), ry = lerp(b.ry, 0, t), rot = lerp(b.rot, 0, t);
      let sx = lerp(b.sx, 1, t), sy = lerp(b.sy, 1, t);
      if(g === 'ears' && (p === 'earL' || p === 'earR')){ sy *= 1 + q*0.14; ry -= q*0.14*22; rot += (p === 'earL' ? -1 : 1) * q*1.5; }
      if(g === 'head'){ sx *= 1 + q*0.06; sy *= 1 + q*0.05; }
      if(g === 'body' && p === 'body'){ sx *= 1 + q*0.08; sy *= 1 - q*0.02; }
      if(g === 'tail'){ sx *= 1 + q*0.18; sy *= 1 + q*0.18; rx += q*2; ry -= q*1.2; }
      const el = rabbit.querySelector(`[data-part="${p}"]`);
      el.style.transform = `translate(${rx.toFixed(1)}px, ${ry.toFixed(1)}px) rotate(${rot.toFixed(1)}deg) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`;
    });
    // ボタンのメーター
    partBtns.forEach(btn => {
      const g = btn.dataset.g;
      const c = knead[g];
      const meter = btn.querySelector('.meter');
      if(!meter.children.length){
        for(let i=1;i<=MAX_KNEAD;i++){
          const s = document.createElement('i');
          s.className = i <= 2 ? 'r' : i <= 6 ? 'n' : 'q';
          meter.appendChild(s);
        }
      }
      [...meter.children].forEach((s, i) => s.classList.toggle('on', i < c));
      btn.querySelector('.lbl').textContent = ZONE_LABEL[g][zoneOf(c)];
    });
    updateChips();
  }

  function newRabbit(){
    PARTS.forEach(p => blob[p] = blobOf(p));
    GROUPS.forEach(g => knead[g] = 0);
    rabbitStage.classList.remove('sold','fresh');
    void rabbitStage.offsetWidth;
    rabbitStage.classList.add('fresh');
    render();
  }

  /* =========================================================
     お客さん
     ========================================================= */
  let order = null;   // { who, wants:{ g:zone }, patience, maxPatience }
  let queue = [];

  function makeOrder(){
    const n = elapsed < 15 ? 1 + (Math.random() < 0.4 ? 1 : 0) : elapsed < 35 ? 2 : 2 + (Math.random() < 0.5 ? 1 : 0);
    const gs = GROUPS.slice().sort(() => Math.random() - .5).slice(0, n);
    const wants = {};
    gs.forEach(g => wants[g] = weighted(ZONE_WEIGHT));
    const maxPatience = Math.max(9, 18 - elapsed * 0.12);
    return { who: pick(CUSTOMERS), wants, patience:maxPatience, maxPatience };
  }

  function nextCustomer(){
    order = queue.shift() || makeOrder();
    while(queue.length < 2) queue.push(makeOrder());
    customerEl.textContent = order.who;
    customerEl.classList.remove('leave','arrive'); void customerEl.offsetWidth; customerEl.classList.add('arrive');
    const gs = GROUPS.filter(g => order.wants[g]);
    orderText.textContent = gs.map(g => ORDER_PHRASE[g][order.wants[g]]).join('、') + 'うさぎ、ください！';
    orderChips.innerHTML = '';
    gs.forEach(g => {
      const z = order.wants[g];
      const chip = document.createElement('span');
      chip.className = 'chip ' + (z === 'rough' ? '' : z === 'neat' ? 'neat' : 'quirk');
      chip.dataset.g = g;
      chip.textContent = `${GNAME[g]}：${ZONE_LABEL[g][z]}`;
      orderChips.appendChild(chip);
    });
    queueEl.textContent = queue.map(q => q.who).join('');
    updateChips();
  }

  function updateChips(){
    if(!order) return;
    orderChips.querySelectorAll('.chip').forEach(ch => {
      const g = ch.dataset.g;
      ch.classList.toggle('ok', zoneOf(knead[g]) === order.wants[g]);
    });
  }

  function showReaction(emoji){
    reaction.textContent = emoji;
    reaction.classList.remove('show'); void reaction.offsetWidth; reaction.classList.add('show');
  }

  /* =========================================================
     状態とループ
     ========================================================= */
  const DAY = 60;
  let running = false, elapsed = 0, money = 0, combo = 0, maxCombo = 0, soldCount = 0, perfectCount = 0;
  let soldNames = [];
  let lastTs = null, rafId = null;

  function setMoney(){ document.getElementById('moneyVal').textContent = money.toLocaleString(); }
  function setCombo(){
    document.getElementById('comboVal').textContent = combo;
    document.getElementById('comboBox').classList.toggle('on', combo >= 2);
  }

  function doKnead(g, btn){
    if(!running) return;
    if(knead[g] >= MAX_KNEAD){ spawnPop(btn, 'これ以上は無理！'); return; }
    knead[g]++;
    render();
    spawnCrumbs(g);
    if(knead[g] === 3) spawnPop(btn, '整った！');
    else if(knead[g] === 7) spawnPop(btn, '個性が出た！');
  }

  function rabbitName(){
    const parts = GROUPS.filter(g => zoneOf(knead[g]) !== 'neat').map(g => ORDER_PHRASE[g][zoneOf(knead[g])]);
    return (parts.length ? parts.slice(0,2).join('、') : 'ととのった') + 'うさぎ';
  }

  function deliver(){
    if(!running || !order) return;
    const gs = GROUPS.filter(g => order.wants[g]);
    const hit = gs.filter(g => zoneOf(knead[g]) === order.wants[g]).length;
    const perfect = hit === gs.length;
    let gained;
    if(perfect){
      combo++;
      maxCombo = Math.max(maxCombo, combo);
      perfectCount++;
      gained = (gs.length * 300 + 200) * Math.min(3, 1 + Math.floor(combo / 3) * 0.5); // 連続満足で最大3倍
      // 待たせなかったぶんのチップ
      gained += Math.round(order.patience / order.maxPatience * 200);
      showReaction(pick(['😍','🥰','✨','💖']));
    } else {
      combo = 0;
      gained = hit * 150 + 30;
      showReaction(hit > 0 ? pick(['🙂','😊']) : pick(['🤔','😅']));
    }
    gained = Math.round(gained / 10) * 10;
    money += gained;
    soldCount++;
    soldNames.push(rabbitName());
    setMoney(); setCombo();
    spawnPop(document.getElementById('deliverBtn'), `+${gained}円${perfect ? '　注文どおり！' : ''}`);
    rabbitStage.classList.add('sold');
    setTimeout(() => { if(running){ newRabbit(); nextCustomer(); } }, 450);
  }

  function customerLeaves(){
    combo = 0; setCombo();
    showReaction('💢');
    customerEl.classList.add('leave');
    setTimeout(() => { if(running) nextCustomer(); }, 350);
  }

  function loop(ts){
    if(!running) return;
    if(lastTs === null) lastTs = ts;
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    elapsed += dt;
    const left = Math.max(0, DAY - elapsed);
    clockEl.textContent = `⏱ ${Math.ceil(left)}`;
    clockEl.classList.toggle('hurry', left <= 10);

    if(order){
      order.patience -= dt;
      const r = Math.max(0, order.patience / order.maxPatience);
      patienceBar.style.width = (r * 100) + '%';
      patienceBar.style.background = r > .5 ? '#7fbf5a' : r > .25 ? '#e8b23a' : '#d4423f';
      if(order.patience <= 0){ order = null; customerLeaves(); }
    }
    if(left <= 0){ closeShop(); return; }
    rafId = requestAnimationFrame(loop);
  }

  function spawnPop(btn, text){
    const r = btn.getBoundingClientRect(), a = app.getBoundingClientRect();
    const p = document.createElement('div');
    p.className = 'pop';
    p.textContent = text;
    p.style.left = (r.left - a.left + r.width/2) + 'px';
    p.style.top = (r.top - a.top - 10) + 'px';
    app.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
  function spawnCrumbs(g){
    const t = rabbit.querySelector(g === 'ears' ? '.earL' : '.' + g);
    const r = t.getBoundingClientRect(), a = app.getBoundingClientRect();
    for(let i=0;i<4;i++){
      const c = document.createElement('div');
      c.className = 'crumb';
      const s = 3 + Math.random()*5;
      c.style.width = s + 'px'; c.style.height = s + 'px';
      c.style.background = pick(['#c97b56','#a15a3a','#e6a880']);
      c.style.left = (r.left - a.left + r.width/2 + rand(-15,15)) + 'px';
      c.style.top = (r.top - a.top + r.height/2) + 'px';
      c.style.setProperty('--dx', rand(-30,30) + 'px');
      app.appendChild(c);
      setTimeout(() => c.remove(), 700);
    }
  }

  function openShop(){
    document.getElementById('startScreen').classList.remove('show');
    document.getElementById('resultScreen').classList.remove('show');
    elapsed = 0; money = 0; combo = 0; maxCombo = 0; soldCount = 0; perfectCount = 0; soldNames = [];
    queue = [];
    setMoney(); setCombo();
    clockEl.textContent = `⏱ ${DAY}`;
    newRabbit();
    nextCustomer();
    const cd = document.createElement('div');
    cd.id = 'countdown';
    app.appendChild(cd);
    let n = 3;
    cd.textContent = n;
    const iv = setInterval(() => {
      n--;
      if(n > 0){ cd.textContent = n; return; }
      clearInterval(iv);
      cd.remove();
      running = true;
      lastTs = null;
      rafId = requestAnimationFrame(loop);
    }, 550);
  }

  function closeShop(){
    running = false;
    cancelAnimationFrame(rafId);
    const isBest = money > save.best;
    save.days++;
    if(isBest) save.best = money;
    writeSave();
    document.getElementById('finalMoney').textContent = money.toLocaleString() + '円';
    document.getElementById('newBest').style.display = isBest && money > 0 ? 'inline-block' : 'none';
    document.getElementById('bestLine').textContent = `自己ベスト ${save.best.toLocaleString()}円`;
    document.getElementById('stSold').textContent = soldCount;
    document.getElementById('stPerfect').textContent = perfectCount;
    document.getElementById('stCombo').textContent = maxCombo;
    document.getElementById('soldList').textContent = soldNames.length ? '売れたうさぎ：' + soldNames.slice(-6).join(' / ') : '';
    const pool = perfectCount >= 8 ? COMMENTS.great : perfectCount >= 4 ? COMMENTS.good : COMMENTS.normal;
    document.getElementById('comment').textContent = pick(pool);
    setTimeout(() => document.getElementById('resultScreen').classList.add('show'), 300);
    sendResultToPortal();
  }

  // ポータルサイトに埋め込まれている場合、結果を親ウィンドウへ送信する（score はランキング用）
  function sendResultToPortal(){
    try{
      window.parent.postMessage({
        type: 'moyamoyaGameResult',
        gameId: 'clay-rabbit',
        summary: `売上 ${money.toLocaleString()}円（${soldCount}羽・注文どおり${perfectCount}）`,
        detail: { score: money, sold: soldCount, perfect: perfectCount, maxCombo }
      }, '*');
    }catch(e){ /* ポータル外で単体表示している場合は何もしない */ }
  }

  /* ===== 操作 ===== */
  partBtns.forEach(btn => btn.addEventListener('click', () => doKnead(btn.dataset.g, btn)));
  document.getElementById('deliverBtn').addEventListener('click', deliver);
  document.getElementById('redoBtn').addEventListener('click', () => { if(running) newRabbit(); });
  window.addEventListener('keydown', e => {
    if(!running) return;
    const i = ['1','2','3','4'].indexOf(e.key);
    if(i >= 0){ doKnead(GROUPS[i], partBtns[i]); return; }
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); deliver(); }
    if(e.key === 'Backspace'){ e.preventDefault(); newRabbit(); }
  });
  document.getElementById('startBtn').addEventListener('click', openShop);
  document.getElementById('retryBtn').addEventListener('click', openShop);

  buildCreature(rabbit);
  newRabbit();
  document.getElementById('startBest').textContent = save.best > 0 ? `自己ベスト ${save.best.toLocaleString()}円` : '';
})();
</script>
</body>
</html>
