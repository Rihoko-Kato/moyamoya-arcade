<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>自己嫌悪ディフェンス</title>
<style>
  :root{
    --night1:#0d0b1e;
    --night2:#1b1638;
    --night3:#26204a;
    --monster-bg:#3a2560ee;
    --monster-border:#b07ae0;
    --monster-text:#efe2ff;
    --fact-bg:#3a3a44ee;
    --fact-border:#8a8a96;
    --fact-text:#d8d8de;
    --gold:#ffe9a8;
    --text-main:#e8e2f5;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    font-family:"Hiragino Sans","Yu Gothic","Zen Maru Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
  }
  #app{
    position:relative; width:100%; height:100%;
    background:linear-gradient(160deg, var(--night1), var(--night2) 55%, var(--night3));
    color:var(--text-main);
    overflow:hidden;
    transition:background 1s ease;
  }
  #app.dawn{ background:linear-gradient(160deg, #ffd9b8, #ffeccf 60%, #d3ecff); }

  #stars{ position:absolute; inset:0; z-index:0; transition:opacity .8s ease; }
  #app.dawn #stars{ opacity:0; }
  .star{ position:absolute; background:#fff; border-radius:50%; animation:twinkle 3s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.25;} 50%{opacity:.9;} }

  /* ===== HUD ===== */
  #hud{
    position:absolute; top:0; left:0; right:0; z-index:20;
    padding:8px 12px 0;
    pointer-events:none;
  }
  #hudRow{ display:flex; justify-content:space-between; align-items:center; font-weight:800; }
  #score{ font-size:20px; font-variant-numeric:tabular-nums; }
  #score small{ display:block; font-size:10px; opacity:.7; font-weight:600; }
  #nightLabel{ font-size:13px; letter-spacing:2px; color:#cfc4ee; text-align:center; }
  #comboBox{ font-size:11px; color:var(--gold); text-align:center; opacity:0; transition:opacity .2s; }
  #comboBox.on{ opacity:1; }
  #comboBox b{ font-size:16px; }
  #lives{ font-size:17px; letter-spacing:2px; }
  #lives .lost{ opacity:.2; filter:grayscale(1); }
  #gaugeOuter{
    margin-top:6px;
    height:12px; border-radius:8px; overflow:hidden;
    background:#00000040; border:1.5px solid #4d3f7a;
    position:relative;
  }
  #gaugeInner{ height:100%; width:0%; background:linear-gradient(90deg,#7ec9e8,#a78bfa); }
  #gaugeLabel{ position:absolute; left:8px; top:-1px; font-size:9.5px; font-weight:700; color:#fff; }

  /* ===== 考えごと ===== */
  #layer{ position:absolute; inset:0; z-index:5; }
  .thought{
    position:absolute;
    width:max-content; /* 画面の端でも縦に潰れないように */
    max-width:140px;
    padding:7px 11px;
    border-radius:14px;
    font-size:12px; font-weight:700; line-height:1.4;
    text-align:center;
    transform:translate(-50%,-50%);
    box-shadow:0 4px 10px rgba(0,0,0,.35);
    cursor:pointer;
    touch-action:manipulation;
  }
  .thought.emo{ background:var(--monster-bg); border:1.5px solid var(--monster-border); color:var(--monster-text); }
  .thought.fact{ background:var(--fact-bg); border:1.5px solid var(--fact-border); color:var(--fact-text); font-weight:500; border-radius:5px; }
  .thought.boss{
    max-width:190px; font-size:15px; padding:10px 14px;
    background:#3a1f4aee; border:2px solid #d07ad8; color:#ffd8f4;
    box-shadow:0 0 18px rgba(208,122,216,.55);
  }
  .thought.boss .hp{ display:block; font-size:10px; letter-spacing:2px; opacity:.85; }
  .thought.star{ background:none; box-shadow:none; padding:0; font-size:30px; line-height:1; filter:drop-shadow(0 0 6px #fff6c0); }
  /* 夜が深まると混ざる、どうでもいい考えごと */
  .thought.weird{ background:#1f3a5aee; border:1.5px dashed #8fc8ff; color:#dcefff; border-radius:18px; }

  /* 柵と、吹き飛ばした考えごとが変身したひつじ */
  #fence{
    position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    width:72px; height:34px; z-index:3; pointer-events:none;
    background:
      linear-gradient(#c9a27a,#c9a27a) 0 8px/100% 4px no-repeat,
      linear-gradient(#c9a27a,#c9a27a) 0 18px/100% 4px no-repeat,
      repeating-linear-gradient(90deg, #a87e58 0 6px, transparent 6px 19px);
    opacity:.85;
  }
  .runSheep{
    position:absolute; bottom:4px; left:-40px; z-index:3; pointer-events:none;
    animation:sheepRun 2.4s linear forwards;
  }
  .runSheep span{ display:block; font-size:24px; animation:sheepHop 2.4s ease-in-out forwards; }
  @keyframes sheepRun{ to{ left:calc(100% + 40px); } }
  /* 🐑 は左向きなので、右へ走るときは反転させる */
  @keyframes sheepHop{
    0%,40%{ transform:scaleX(-1) translateY(0); }
    50%{ transform:scaleX(-1) translateY(-34px) rotate(12deg); }
    60%,100%{ transform:scaleX(-1) translateY(0); }
  }
  #sheepCount{ font-size:11px; color:#cfc4ee; text-align:center; }
  #app.dawn #sheepCount{ color:#6a5a3a; }
  .thought.hit{ animation:hitShake .2s ease; }
  @keyframes hitShake{ 25%{ margin-left:-5px; } 75%{ margin-left:5px; } }
  .thought.gone{ transition:transform .45s cubic-bezier(.2,.7,.3,1), opacity .45s ease; opacity:0; pointer-events:none; }
  .thought.passed{ transition:opacity .35s ease, transform .35s ease; opacity:0; transform:translate(-50%,-50%) scale(.5); pointer-events:none; }

  #sleeper{
    position:absolute; left:50%; top:58%;
    transform:translate(-50%,-50%);
    z-index:4;
    width:104px; height:104px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #4a3f7a, #241d47);
    box-shadow:0 0 0 8px rgba(255,255,255,.04), 0 10px 30px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center;
    font-size:44px;
    pointer-events:none;
  }
  #sleeper.hurt{ animation:hurt .5s ease; }
  @keyframes hurt{ 30%{ transform:translate(-50%,-50%) rotate(-16deg) scale(1.08); } 65%{ transform:translate(-50%,-50%) rotate(10deg); } }
  #app.dawn #sleeper{ background:radial-gradient(circle at 35% 30%, #fff2c2, #ffd76a); }

  .burst{
    position:absolute; width:20px; height:20px; margin:-10px 0 0 -10px;
    border-radius:50%; border:3px solid #a9c9ffcc;
    pointer-events:none; z-index:12;
    animation:burst .45s ease-out forwards;
  }
  @keyframes burst{ from{ opacity:.9; transform:scale(.2); } to{ opacity:0; transform:scale(5); } }
  .pts{
    position:absolute; transform:translate(-50%,-50%);
    font-size:14px; font-weight:900; color:var(--gold);
    text-shadow:0 2px 6px rgba(0,0,0,.6);
    pointer-events:none; z-index:18; white-space:nowrap;
    animation:ptsUp .8s ease forwards;
  }
  .pts.bad{ color:#ff8a9a; }
  .pts.fact{ color:#d8d8de; font-size:12px; }
  @keyframes ptsUp{ 0%{ opacity:0; margin-top:0; } 20%{ opacity:1; } 100%{ opacity:0; margin-top:-50px; } }

  #banner{
    position:absolute; left:50%; top:36%; transform:translate(-50%,-50%);
    z-index:25; text-align:center; pointer-events:none;
    opacity:0;
  }
  #banner.show{ animation:banner 1.8s ease forwards; }
  @keyframes banner{ 0%{ opacity:0; transform:translate(-50%,-30%); } 15%,75%{ opacity:1; transform:translate(-50%,-50%); } 100%{ opacity:0; } }
  #banner .big{ font-size:30px; font-weight:900; letter-spacing:4px; color:var(--gold); text-shadow:0 3px 12px rgba(0,0,0,.4); }
  #banner .small{ font-size:13px; font-weight:700; margin-top:4px; }
  #banner{ width:90%; max-width:420px; }
  #banner .dream{
    margin-top:10px; font-size:13px; font-weight:700; line-height:1.6;
    background:#ffffffd8; color:#4a3f6a; border-radius:14px; padding:8px 12px;
  }
  #banner .dream:empty{ display:none; }
  #banner .dream::before{ content:"💤 今夜見た夢"; display:block; font-size:10.5px; color:#8a7fb0; }
  #banner.long{ animation-duration:3.6s; }
  #app.dawn #banner .big{ color:#c9891a; text-shadow:none; }
  #app.dawn #banner .small{ color:#6a5a3a; }

  /* ===== はじまり・結果 ===== */
  .overlay{
    position:fixed; inset:0; z-index:50;
    background:rgba(13,11,30,.92);
    display:none; flex-direction:column; align-items:center;
    padding:16px; overflow-y:auto; text-align:center; color:var(--text-main);
  }
  .overlay.show{ display:flex; }
  .overlayInner{ margin:auto 0; width:100%; max-width:360px; }
  .title{ font-size:22px; font-weight:900; margin-bottom:4px; color:var(--gold); }
  .howto{
    text-align:left; font-size:13px; line-height:1.85;
    background:#ffffff0e; border-radius:14px; padding:10px 14px; margin:12px 0;
  }
  .tag{ display:inline-block; font-size:11px; font-weight:800; padding:0 7px; border-radius:7px; margin-right:3px; }
  .tag.e{ background:var(--monster-bg); border:1px solid var(--monster-border); }
  .tag.f{ background:var(--fact-bg); border:1px solid var(--fact-border); border-radius:3px; }
  .best{ font-size:12px; color:#b7a9e0; margin-bottom:12px; }
  .mainBtn{
    padding:13px 38px; border:none; border-radius:30px;
    background:linear-gradient(160deg,#ffd76a,#e0a93a);
    color:#4a2f10; font-weight:900; font-size:16px; font-family:inherit;
    box-shadow:0 6px 0 #a97c1e; cursor:pointer;
  }
  #finalScore{ font-size:46px; font-weight:900; color:var(--gold); line-height:1.1; font-variant-numeric:tabular-nums; }
  #newBest{ display:inline-block; margin:4px 0; font-size:12px; font-weight:900; letter-spacing:2px; color:#4a2f10; background:var(--gold); padding:3px 12px; border-radius:12px; }
  #bestLine{ font-size:12px; color:#b7a9e0; margin-bottom:10px; }
  .stats{ display:flex; gap:8px; justify-content:center; margin-bottom:12px; }
  .stat{ background:#ffffff10; border-radius:12px; padding:8px 10px; min-width:84px; }
  .stat .n{ font-size:20px; font-weight:900; color:var(--gold); }
  .stat .l{ font-size:10.5px; color:#b7a9e0; }
  #comment{ font-size:13px; background:#ffffff0e; border-radius:12px; padding:8px 12px; margin-bottom:14px; }
  #lastDream{
    font-size:13px; line-height:1.6; text-align:left;
    background:#ffffffe0; color:#4a3f6a; border-radius:12px; padding:8px 12px; margin-bottom:12px;
  }
  #lastDream:empty{ display:none; }
  #lastDream::before{ content:"💤 最後に見た夢"; display:block; font-size:10.5px; color:#8a7fb0; }
</style>
</head>
<body>

<div id="app">
  <div id="stars"></div>

  <div id="hud">
    <div id="hudRow">
      <div id="score"><small>SCORE</small><span id="scoreVal">0</span></div>
      <div>
        <div id="nightLabel">1夜目</div>
        <div id="sheepCount">🐑 0</div>
        <div id="comboBox"><b id="comboVal">0</b> COMBO</div>
      </div>
      <div id="lives"></div>
    </div>
    <div id="gaugeOuter"><div id="gaugeInner"></div><div id="gaugeLabel">朝まで</div></div>
  </div>

  <div id="sleeper"><span id="face">😴</span></div>
  <div id="layer"></div>
  <div id="fence"></div>
  <div id="banner"><div class="big" id="bannerBig"></div><div class="small" id="bannerSmall"></div><div class="dream" id="bannerDream"></div></div>
</div>

<div id="startScreen" class="overlay show">
  <div class="overlayInner">
    <div class="title">🌙 自己嫌悪ディフェンス</div>
    <div class="howto">
      眠ろうとすると、考えごとが押し寄せてくる。<br>
      <span class="tag e">むらさき</span>タップで吹き飛ばす<br>
      <span class="tag f">グレー</span>さわらずに通すと得点<br>
      吹き飛ばした考えごとは、ひつじになって柵をこえていく🐑<br>
      🌠 タップでボーナス＆眠りが深くなる<br>
      ゲージがたまると朝。夜を重ねるほど手強くなる。<br>
      ❤ がなくなったら、おしまい。
    </div>
    <div class="best" id="startBest"></div>
    <button class="mainBtn" id="startBtn">電気を消す</button>
  </div>
</div>

<div id="resultScreen" class="overlay">
  <div class="overlayInner">
    <div class="title">ねむれなかった…</div>
    <div id="finalScore">0</div>
    <div id="newBest">NEW BEST!</div>
    <div id="bestLine"></div>
    <div class="stats">
      <div class="stat"><div class="n" id="stNight">0</div><div class="l">越えた夜</div></div>
      <div class="stat"><div class="n" id="stBlast">0</div><div class="l">数えたひつじ</div></div>
      <div class="stat"><div class="n" id="stCombo">0</div><div class="l">最大コンボ</div></div>
    </div>
    <div id="lastDream"></div>
    <div id="comment"></div>
    <button class="mainBtn" id="retryBtn">もう一度ねる</button>
  </div>
</div>

<script>
(function(){
  /* 夜ごとのテーマ（研究の「しんどいシーン」から） */
  const THEMES = [
    { name:'バイトのこと',
      emo:['先輩なのに情けない','フォローに入れなかった','店長どう思ったかな','また同じミスした','要領悪すぎる','頼りないって思われた','迷惑かけてばっかり','向いてないのかも'],
      fact:['明日もシフトがある','閉店が15分遅れた','新人が2人いた','電話が3件鳴った','次のシフトは土曜'] },
    { name:'制作のこと',
      emo:['この程度しかできない','いつも無計画だ','センスがない','時間かけたのに無駄','人に見せられない','みんなもっと上手い','また中途半端','才能ないのかな'],
      fact:['締め切りは金曜','今日は3時間作業した','試作を2回作った','色の調整が残ってる','材料はあと半分'] },
    { name:'面接・発表のこと',
      emo:['みんな賢そうだった','何も言えなかった','胸を張れる経験がない','あきれられたかも','自分には何もない','声が震えてた','比べたら全然だめ','準備不足だった'],
      fact:['面接は20分だった','質問に3つ答えた','結果は来週わかる','次の面接は火曜','発表は8分で終わった'] },
    { name:'家族・親しい人のこと',
      emo:['なんであんな言い方…','素直になれなかった','また強がっちゃった','嫌な顔してたかな','ありがとうって言えなかった','可愛げがないな','言い過ぎたかも','前もこんなことあった'],
      fact:['週末に会う予定がある','LINEの返信が来てた','朝ごはんは一緒','電話は10分だった','お土産を渡しそびれた'] }
  ];
  const BOSS_TEXTS = ['自分はダメな人間だ','どうせ何やってもムダ','みんなに嫌われてる','自分には何もない'];
  // ボスのまぬけな倒れ方
  const BOSS_DOWN = ['…ぐぅ（ボスも寝た）','まくらに負けた','毛布にくるまって退場','あくびして帰った'];
  // 夜が深まると混ざる、どうでもいい考えごと（届いてもハートは減らない。夢に混ざる）
  const WEIRD = ['冷蔵庫のプリン食べたっけ','ペンギンって膝あるのかな','明日の天気なんだろ','あの歌の続きなんだっけ','なんで靴下って片方消える？','カピバラって何考えてる？','おにぎりの具、何が最強？'];
  // 「今夜見た夢」の材料
  const DREAM_WHO = {
    'バイトのこと':['店長','先輩','新人くん','常連さん'],
    '制作のこと':['先生','ライバル','巨大な粘土','完成した作品'],
    '面接・発表のこと':['面接官','隣の就活生','司会者','教授'],
    '家族・親しい人のこと':['お母さん','いとこ','飼い猫','おばあちゃん']
  };
  const DREAM_WHERE = ['プリンの上で','雲の上で','冷蔵庫の中で','巨大なおふとんの上で','月面で','回転寿司のレーンの上で','ペンギンの行列の中で'];
  const DREAM_DO = ['空を飛んでいた','タップダンスしていた','綿あめを配っていた','ひたすら回転していた','ラーメンを茹でていた','カラオケで100点を出していた'];
  const MANTRAS = ['まあいっか！','寝たら忘れる！','それはそれ！','明日考えよう','おふとんの勝ち','今日は閉店！','続きは夢で','ひと晩おいとこ','いったん保留！','深呼吸〜'];
  const COMMENTS = {
    great: ['夜の番人みたいだった','もう考えごとの方が逃げていく','その連打、プロ級'],
    good:  ['いい夜を重ねたね','ひつじも感心してた','かなり眠れてた'],
    normal:['次はもっと眠れそう','今夜はここまで','おふとんはまた待ってる']
  };

  const SAVE_KEY = 'jikokenArcade_v1';
  function loadSave(){
    try{ return Object.assign({ best:0, bestNight:0 }, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); }
    catch(e){ return { best:0, bestNight:0 }; }
  }
  function writeSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
  let save = loadSave();

  function rand(a,b){ return a + Math.random()*(b-a); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  const app = document.getElementById('app');
  const layer = document.getElementById('layer');
  const sleeper = document.getElementById('sleeper');
  const face = document.getElementById('face');
  const gaugeInner = document.getElementById('gaugeInner');

  (function stars(){
    const box = document.getElementById('stars');
    for(let i=0;i<46;i++){
      const s = document.createElement('div');
      s.className = 'star';
      const z = rand(1, 2.4);
      s.style.width = z + 'px'; s.style.height = z + 'px';
      s.style.left = rand(0,100) + '%'; s.style.top = rand(0,90) + '%';
      s.style.animationDelay = rand(0,3) + 's';
      box.appendChild(s);
    }
  })();

  const MAX_LIVES = 3;

  /* ===== 状態 ===== */
  let running = false, paused = false;
  let night = 1, theme = null;
  let score = 0, combo = 0, maxCombo = 0, lives = MAX_LIVES;
  let blasted = 0, nightsCleared = 0;
  let gauge = 0, thoughts = [];
  let nextEmo = 0, nextFact = 0, nextStar = 0, nextWeird = 0, bossSpawned = false;
  let sheepCount = 0, dreamBits = [], lastDream = '';
  let lastTs = null, rafId = null;

  // 夜が進むほど速く・多く
  function travelSecs(){ return Math.max(4.2, 9 - (night - 1) * 0.8); }
  function emoInterval(){ return Math.max(0.45, 1.35 - (night - 1) * 0.14); }

  function center(){
    const r = sleeper.getBoundingClientRect(), a = app.getBoundingClientRect();
    return { cx: r.left - a.left + r.width/2, cy: r.top - a.top + r.height/2 };
  }
  function renderHud(){
    document.getElementById('scoreVal').textContent = score.toLocaleString();
    document.getElementById('comboVal').textContent = combo;
    document.getElementById('comboBox').classList.toggle('on', combo >= 3);
    document.getElementById('nightLabel').textContent = `${night}夜目`;
    const lv = document.getElementById('lives');
    lv.innerHTML = '';
    for(let i=0;i<MAX_LIVES;i++){
      const s = document.createElement('span');
      s.textContent = '❤'; s.style.color = '#ff5a7a';
      if(i >= lives) s.className = 'lost';
      lv.appendChild(s);
    }
    gaugeInner.style.width = Math.min(100, gauge) + '%';
    document.getElementById('sheepCount').textContent = `🐑 ${sheepCount}`;
  }

  /* ===== 出現 ===== */
  function spawn(kind){
    const w = app.clientWidth, h = app.clientHeight;
    const { cx, cy } = center();
    const el = document.createElement('div');
    el.className = 'thought ' + kind;
    let x, y, vx, vy, hp = 1, text = '';
    if(kind === 'star'){
      el.textContent = '🌠';
      x = -30; y = rand(h*0.2, h*0.4); vx = rand(80, 110); vy = rand(8, 20);
    } else {
      if(kind === 'boss'){
        text = pick(BOSS_TEXTS);
        hp = 3 + Math.floor(night / 2);
        el.innerHTML = '<span class="txt"></span><span class="hp"></span>';
        el.querySelector('.txt').textContent = text;
        el.querySelector('.hp').textContent = '●'.repeat(hp);
      } else {
        text = kind === 'emo' ? pick(theme.emo) : kind === 'weird' ? pick(WEIRD) : pick(theme.fact);
        el.textContent = text;
      }
      const edge = pick(['top','left','right','bottom']);
      const m = 60;
      if(edge === 'top'){ x = rand(30, w-30); y = 60; }
      else if(edge === 'bottom'){ x = rand(30, w-30); y = h + m; }
      else if(edge === 'left'){ x = -m; y = rand(90, h-40); }
      else { x = w + m; y = rand(90, h-40); }
      const dist = Math.max(1, Math.hypot(cx - x, cy - y));
      const secs = kind === 'fact' ? travelSecs() * 1.3 : kind === 'boss' ? travelSecs() * 1.8 : travelSecs() * rand(0.85, 1.15);
      vx = (cx - x) / dist * dist / secs;
      vy = (cy - y) / dist * dist / secs;
    }
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    layer.appendChild(el);
    const t = { kind, el, x, y, vx, vy, hp, maxHp:hp, done:false, text };
    el.addEventListener('pointerdown', e => { e.preventDefault(); tap(t); });
    thoughts.push(t);
  }

  /* ===== タップ ===== */
  function tap(t){
    if(!running || paused || t.done) return;
    if(t.kind === 'emo' || t.kind === 'weird'){
      combo++; maxCombo = Math.max(maxCombo, combo); blasted++;
      const mult = 1 + Math.floor(combo / 10);
      const pts = (t.kind === 'weird' ? 15 : 10) * mult;
      dreamBits.push(t.text);
      score += pts;
      gauge += 1;
      blast(t);
      showPts(t.x, t.y, Math.random() < 0.35 ? pick(MANTRAS) : `+${pts}`);
    } else if(t.kind === 'boss'){
      t.hp--;
      t.el.classList.remove('hit'); void t.el.offsetWidth; t.el.classList.add('hit');
      t.el.querySelector('.hp').textContent = '●'.repeat(t.hp) + '○'.repeat(t.maxHp - t.hp);
      burstAt(t.x, t.y);
      if(t.hp <= 0){
        combo++; maxCombo = Math.max(maxCombo, combo); blasted++;
        score += 100 * night;
        gauge += 8;
        dreamBits.push(t.text);
        blast(t);
        showPts(t.x, t.y, `${pick(BOSS_DOWN)} +${100 * night}`);
      }
    } else if(t.kind === 'fact'){
      // 事実は撃たなくていい。さわるとコンボが切れる
      combo = 0;
      t.el.classList.remove('hit'); void t.el.offsetWidth; t.el.classList.add('hit');
      showPts(t.x, t.y, 'それは事実', 'bad');
    } else if(t.kind === 'star'){
      t.done = true;
      score += 50;
      gauge += 7;
      t.el.classList.add('passed');
      setTimeout(() => t.el.remove(), 400);
      showPts(t.x, t.y, '🌠 +50');
    }
    renderHud();
  }

  function blast(t){
    t.done = true;
    const { cx, cy } = center();
    let dx = t.x - cx, dy = t.y - cy;
    const d = Math.max(1, Math.hypot(dx, dy));
    t.el.classList.add('gone');
    t.el.style.transform = `translate(-50%,-50%) translate(${dx/d*300}px, ${dy/d*300}px) rotate(${rand(-90,90)}deg) scale(.6)`;
    burstAt(t.x, t.y);
    setTimeout(() => t.el.remove(), 480);
    if(t.kind === 'emo' || t.kind === 'boss' || t.kind === 'weird') runSheep();
  }

  // 吹き飛ばした考えごとが、ひつじになって柵をこえていく（ひつじを数えて眠る）
  function runSheep(){
    sheepCount++;
    if(app.querySelectorAll('.runSheep').length >= 8) return;   // 画面にあふれないように
    const s = document.createElement('div');
    s.className = 'runSheep';
    s.innerHTML = '<span>🐑</span>';
    s.style.animationDelay = rand(0, 0.3) + 's';
    s.firstChild.style.animationDelay = s.style.animationDelay;
    app.appendChild(s);
    setTimeout(() => s.remove(), 3000);
  }
  function burstAt(x, y){
    const b = document.createElement('div');
    b.className = 'burst';
    b.style.left = x + 'px'; b.style.top = y + 'px';
    app.appendChild(b);
    setTimeout(() => b.remove(), 460);
  }
  function showPts(x, y, text, cls){
    const p = document.createElement('div');
    p.className = 'pts' + (cls ? ' ' + cls : '');
    p.textContent = text;
    p.style.left = Math.max(50, Math.min(app.clientWidth - 50, x)) + 'px';
    p.style.top = y + 'px';
    app.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }

  function reach(t){
    t.done = true;
    if(t.kind === 'fact'){
      // 通した事実は得点に
      score += 20;
      showPts(t.x, t.y - 20, '+20', 'fact');
      t.el.classList.add('passed');
      setTimeout(() => t.el.remove(), 360);
      return;
    }
    if(t.kind === 'weird'){
      dreamBits.push(t.text);
      showPts(t.x, t.y - 20, '夢に混ざった', 'fact');
      t.el.classList.add('passed');
      setTimeout(() => t.el.remove(), 360);
      return;
    }
    lives--;
    combo = 0;
    t.el.classList.add('passed');
    setTimeout(() => t.el.remove(), 360);
    sleeper.classList.remove('hurt'); void sleeper.offsetWidth; sleeper.classList.add('hurt');
    face.textContent = '😣';
    setTimeout(() => { face.textContent = '😴'; }, 600);
    if(navigator.vibrate) navigator.vibrate([30,40,30]);
  }

  /* ===== ループ ===== */
  function loop(ts){
    if(!running) return;
    if(lastTs === null) lastTs = ts;
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;

    if(!paused){
      nextEmo -= dt; nextFact -= dt; nextStar -= dt; nextWeird -= dt;
      if(nextEmo <= 0){ spawn('emo'); nextEmo = emoInterval() * rand(0.8, 1.2); }
      if(nextFact <= 0){ spawn('fact'); nextFact = rand(2.8, 4.2); }
      if(nextStar <= 0){ spawn('star'); nextStar = rand(7, 11); }
      // 夜が深まる（2夜目以降の後半）と、どうでもいい考えごとが混ざってくる
      if(night >= 2 && gauge >= 40 && nextWeird <= 0){ spawn('weird'); nextWeird = rand(2.5, 4); }
      if(!bossSpawned && gauge >= 50){ bossSpawned = true; spawn('boss'); }

      const { cx, cy } = center();
      let pressure = 0;
      thoughts.forEach(t => {
        if(t.done) return;
        t.x += t.vx * dt; t.y += t.vy * dt;
        t.el.style.left = t.x + 'px'; t.el.style.top = t.y + 'px';
        if(t.kind === 'star'){
          if(t.x > app.clientWidth + 40){ t.done = true; t.el.remove(); }
          return;
        }
        if(t.kind === 'emo' || t.kind === 'boss') pressure += t.kind === 'boss' ? 2 : 1;
        if(Math.hypot(cx - t.x, cy - t.y) < 54) reach(t);
      });
      thoughts = thoughts.filter(t => !t.done || t.el.isConnected);

      // 眠りは少しずつ深くなる。考えごとが多いほどゆっくり
      gauge += Math.max(1.2, 4.5 - pressure * 0.45) * dt; // 1晩おおよそ20〜30秒
      renderHud();

      if(lives <= 0){ gameOver(); return; }
      if(gauge >= 100){ morning(); }
    }
    rafId = requestAnimationFrame(loop);
  }

  function clearThoughts(){
    thoughts.forEach(t => {
      if(t.done) return;
      if(t.kind === 'emo' || t.kind === 'boss' || t.kind === 'weird'){ t.kind = 'cleared'; blast(t); }
      else { t.done = true; t.el.classList.add('passed'); setTimeout(() => t.el.remove(), 360); }
    });
    thoughts = [];
  }

  function showBanner(big, small, dream){
    document.getElementById('bannerBig').textContent = big;
    document.getElementById('bannerSmall').textContent = small;
    document.getElementById('bannerDream').textContent = dream || '';
    const b = document.getElementById('banner');
    b.classList.toggle('long', !!dream);
    b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  }

  // 吹き飛ばした考えごとの断片から、ヘンな夢をつくる
  function makeDream(){
    if(dreamBits.length === 0) return 'ぐっすりで、夢は見なかった。';
    const q = s => '「' + (Array.from(s.replace(/…$/,'')).length > 12 ? Array.from(s).slice(0, 11).join('') + '…' : s.replace(/…$/,'')) + '」';
    const who = DREAM_WHO[theme.name] || ['だれか'];
    const bits = dreamBits.slice().sort(() => Math.random() - .5);
    let d = `${pick(who)}が、${pick(DREAM_WHERE)}${q(bits[0])}と歌いながら${pick(DREAM_DO)}。`;
    if(bits.length >= 2) d += `そのあと${pick(who)}が、${q(bits[1])}と書かれた風船を${pick(['飛ばしていた','食べていた','抱きしめていた','うちわにしていた'])}。`;
    return d;
  }

  // 朝が来たら次の夜へ
  function morning(){
    paused = true;
    nightsCleared++;
    const bonus = 200 * night + lives * 50;
    score += bonus;
    clearThoughts();
    app.classList.add('dawn');
    face.textContent = '😌';
    lastDream = makeDream();
    showBanner('朝！', `${night}夜目クリア　+${bonus}`, lastDream);
    renderHud();
    setTimeout(() => {
      if(!running) return;
      night++;
      startNight();
    }, 3800);
  }

  function startNight(){
    theme = THEMES[(night - 1) % THEMES.length];
    gauge = 0;
    bossSpawned = false;
    dreamBits = [];
    nextEmo = 0.8; nextFact = rand(2.5, 3.5); nextStar = rand(5, 9); nextWeird = rand(1, 3);
    app.classList.remove('dawn');
    face.textContent = '😴';
    showBanner(`${night}夜目`, `今夜のモヤモヤ：${theme.name}`);
    renderHud();
    paused = false;
  }

  function startGame(){
    document.getElementById('startScreen').classList.remove('show');
    document.getElementById('resultScreen').classList.remove('show');
    layer.innerHTML = '';
    thoughts = [];
    night = 1; score = 0; combo = 0; maxCombo = 0; lives = MAX_LIVES; blasted = 0; nightsCleared = 0;
    sheepCount = 0; lastDream = '';
    app.querySelectorAll('.runSheep').forEach(e => e.remove());
    running = true;
    startNight();
    lastTs = null;
    rafId = requestAnimationFrame(loop);
  }

  function gameOver(){
    running = false;
    cancelAnimationFrame(rafId);
    clearThoughts();
    const isBest = score > save.best;
    if(isBest) save.best = score;
    save.bestNight = Math.max(save.bestNight, nightsCleared);
    writeSave();
    document.getElementById('finalScore').textContent = score.toLocaleString();
    document.getElementById('newBest').style.display = isBest && score > 0 ? 'inline-block' : 'none';
    document.getElementById('bestLine').textContent = `自己ベスト ${save.best.toLocaleString()} ／ 最高 ${save.bestNight}夜`;
    document.getElementById('stNight').textContent = nightsCleared;
    document.getElementById('stBlast').textContent = sheepCount;
    // 朝を迎えられなかった夜も、それまでの考えごとで夢を見る
    document.getElementById('lastDream').textContent = dreamBits.length ? makeDream() : lastDream;
    document.getElementById('stCombo').textContent = maxCombo;
    const pool = nightsCleared >= 5 ? COMMENTS.great : nightsCleared >= 2 ? COMMENTS.good : COMMENTS.normal;
    document.getElementById('comment').textContent = pick(pool);
    setTimeout(() => document.getElementById('resultScreen').classList.add('show'), 600);
    sendResultToPortal();
  }

  // ポータルサイトに埋め込まれている場合、結果を親ウィンドウへ送信する（score はランキング用）
  function sendResultToPortal(){
    try{
      window.parent.postMessage({
        type: 'moyamoyaGameResult',
        gameId: 'jikoken-defense',
        summary: `スコア ${score.toLocaleString()}（${nightsCleared}夜を越えた）`,
        detail: { score, nights: nightsCleared, blasted, sheep: sheepCount, maxCombo }
      }, '*');
    }catch(e){ /* ポータル外で単体表示している場合は何もしない */ }
  }

  document.getElementById('startBest').textContent = save.best > 0 ? `自己ベスト ${save.best.toLocaleString()} ／ 最高 ${save.bestNight}夜` : '';
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  renderHud();
})();
</script>
</body>
